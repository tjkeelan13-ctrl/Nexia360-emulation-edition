name: Xbox - Loader Comparison

on:
  workflow_dispatch:
  push:
    branches: [Mousehook]
    paths:
      - '.github/workflows/xbox-loader-test.yml'

permissions:
  contents: read

concurrency:
  group: xbox-loader-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Prepare isolated loader comparison
        shell: python
        run: |
          import hashlib
          import re
          import textwrap
          from pathlib import Path
          from urllib.request import urlopen

          # Reuse the exact preparation code from the successful managed build.
          url = (
              'https://raw.githubusercontent.com/'
              'tjkeelan13-ctrl/Nexia360-emulation-edition/'
              'c1a9d425bba580f1198f34dae728236028d9f616/'
              '.github/workflows/xbox-managed-build.yml'
          )
          with urlopen(url, timeout=45) as response:
              data = response.read()
          if hashlib.sha256(data).hexdigest() != '8125a5447c4769bb0579d555751929c6be565c0655167fe74ea5496dcd116ae2':
              raise RuntimeError('Base workflow integrity check failed')
          blocks = re.findall(r'(?m)^        run: \|\n((?: {10}.*\n|\n)*)', data.decode('utf-8-sig'))
          if len(blocks) != 2:
              raise RuntimeError('Unexpected base workflow structure')
          exec(compile(textwrap.dedent(blocks[0]), 'verified-preparation', 'exec'), {})
          root = Path('xbox-managed-probe')

          def patch(name, before, after):
              path = root / name
              text = path.read_text(encoding='utf-8')
              if text.count(before) != 1:
                  raise RuntimeError('Patch location missing or ambiguous: ' + name)
              path.write_text(text.replace(before, after, 1), encoding='utf-8')

          # A separate app identity keeps both installed probes untouched.
          for path in root.iterdir():
              if path.is_file():
                  text = path.read_text(encoding='utf-8')
                  text = text.replace('NexiaXboxManagedProbe', 'NexiaXboxLoaderProbe')
                  text = text.replace('Nexia Managed Probe', 'Nexia Loader Probe')
                  text = text.replace('NEXIA MANAGED PROBE 0.2', 'NEXIA LOADER PROBE 0.3')
                  text = text.replace('0.2.', '0.3.')
                  text = text.replace('0cf44b44-3d0a-4c82-969b-cfb64774c99e', '9582ef7b-b534-4ffd-8223-ae8bff5b1269')
                  path.write_text(text, encoding='utf-8')

          (root / 'Payload').mkdir(exist_ok=True)
          (root / 'Payload/Payload.csproj').write_text('''<Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>netstandard2.0</TargetFramework>
              <AssemblyName>NexiaPackagedPayload</AssemblyName>
              <Version>1.0.0</Version>
              <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
            </PropertyGroup>
            <ItemGroup><Compile Include="Payload.cs" /></ItemGroup>
          </Project>
          ''', encoding='utf-8')
          (root / 'Payload/Payload.cs').write_text('''namespace NexiaPackagedPayload {
              public static class Calculator {
                  public static int Compute() { return 42; }
              }
          }
          ''', encoding='utf-8')
          (root / 'LoaderSupport.cs').write_text('''using System;
          using System.IO;
          using System.Reflection;

          namespace NexiaXboxLoaderProbe {
              internal static class LoaderSupport {
                  private static Type contextType;
                  private static object context;
                  public static string PackagedName() {
                      var assembly = Assembly.Load(new AssemblyName("NexiaPackagedPayload"));
                      var type = assembly.GetType("NexiaPackagedPayload.Calculator", true);
                      var value = type.GetMethod("Compute").Invoke(null, null);
                      if (!(value is int) || (int)value != 42)
                          throw new InvalidOperationException("Packaged DLL returned the wrong answer");
                      return "packaged DLL returned 42";
                  }
                  public static string Discover() {
                      // Public API inspection only; no private runtime fields or patches.
                      contextType = typeof(object).Assembly.GetType("System.Runtime.Loader.AssemblyLoadContext");
                      if (contextType == null || !contextType.IsPublic)
                          throw new NotSupportedException("Public AssemblyLoadContext type unavailable");
                      var property = contextType.GetProperty("Default", BindingFlags.Public | BindingFlags.Static);
                      if (property == null)
                          throw new NotSupportedException("Public Default context property unavailable");
                      context = property.GetValue(null);
                      if (context == null)
                          throw new NotSupportedException("Runtime returned no default load context");
                      return context.GetType().FullName;
                  }
                  private static MethodInfo Method(string name, Type argument) {
                      if (context == null)
                          throw new ProbeSkipException("no usable public context; see discovery result");
                      var method = contextType.GetMethod(name, BindingFlags.Public | BindingFlags.Instance,
                          null, new Type[] { argument }, null);
                      if (method == null)
                          throw new NotSupportedException(name + " is unavailable in this runtime");
                      return method;
                  }
                  public static Assembly LoadBytes(byte[] bytes) {
                      var method = Method("LoadFromStream", typeof(Stream));
                      using (var stream = new MemoryStream(bytes))
                          return (Assembly)method.Invoke(context, new object[] { stream });
                  }
                  public static Assembly LoadPath(string path) {
                      return (Assembly)Method("LoadFromAssemblyPath", typeof(string))
                          .Invoke(context, new object[] { Path.GetFullPath(path) });
                  }
              }
          }
          ''', encoding='utf-8')
          patch('ManagedProbe.csproj', '<Compile Include="ProbeTests.cs" />', '''<Compile Include="ProbeTests.cs" />
              <Compile Include="LoaderSupport.cs" />
              <Reference Include="NexiaPackagedPayload">
                <HintPath>payload-bin/NexiaPackagedPayload.dll</HintPath><Private>true</Private>
              </Reference>''')
          patch('App.xaml.cs', 'await Step("Managed controller API", () => "connected=" + Gamepad.Gamepads.Count);',
                'await Step("Packaged DLL by name", () => LoaderSupport.PackagedName());')
          patch('App.xaml.cs', 'await Step("Load IL bytes + execute", () => tests.LoadMemory());', '''await Step("Public load-context API", () => LoaderSupport.Discover());
                          await Step("Context stream + execute", () => tests.LoadMemory());''')
          patch('App.xaml.cs', '"LocalState DLL + execute"', '"Context file path + execute"')
          patch('App.xaml.cs', '"Rewrite IL + execute"', '"Context rewritten IL + execute"')
          patch('App.xaml.cs', '"Nexia original facade"', '"Context original facade"')
          patch('App.xaml.cs', '"Forwarder-flag control"', '"Context forwarder control"')
          patch('App.xaml.cs', 'WriteLog("App version: " + Windows.ApplicationModel.Package.Current.Id.Version.ToString());', '''var v = Windows.ApplicationModel.Package.Current.Id.Version;
                          WriteLog("App version: " + v.Major + "." + v.Minor + "." + v.Build + "." + v.Revision);''')
          patch('ProbeTests.cs', 'Assembly loaded = Assembly.Load(bytes);', '''return RunLoaded(LoaderSupport.LoadBytes(bytes));
                  }
                  private static int RunLoaded(Assembly loaded)
                  {''')
          patch('ProbeTests.cs', 'Assembly facade = Assembly.Load(bytes);', 'Assembly facade = LoaderSupport.LoadBytes(bytes);')
          patch('ProbeTests.cs', '''// This deliberately tests reading bytes from writable storage, then
                      // Assembly.Load(bytes). It does NOT claim LoadFrom(path) support.
                      Require(RunPayload(File.ReadAllBytes(path)) == 43, "LocalState method did not return 43.");
                      return "read DLL bytes; returned 43";''', '''// A different public entry point; do not silently fall back to byte loading.
                      Require(RunLoaded(LoaderSupport.LoadPath(path)) == 43, "LocalState method did not return 43.");
                      return "LoadFromAssemblyPath returned 43";''')
          patch('build.ps1', '    & $msbuild "$root\\ManagedProbe.csproj" /restore', '''    & dotnet build "$root\\Payload\\Payload.csproj" --configuration Release --output "$root\\payload-bin"
              if ($LASTEXITCODE -ne 0) { throw 'Packaged test DLL compilation failed.' }
              & $msbuild "$root\\ManagedProbe.csproj" /restore''')
          patch('build.ps1', '    $mainManifest = Read-AppxManifest $package', '''    $payloadCheck = [IO.Compression.ZipFile]::OpenRead($package)
              try {
                  if (!$payloadCheck.GetEntry('NexiaPackagedPayload.dll')) {
                      throw 'Packaged test DLL is missing from the install package.'
                  }
              } finally { $payloadCheck.Dispose() }
              $mainManifest = Read-AppxManifest $package''')
          (root / 'README.txt').write_text('''NEXIA LOADER PROBE 0.3 - EXPERIMENT, NOT THE EMULATOR

          Compares a precompiled packaged DLL loaded by assembly name against public
          AssemblyLoadContext entry points discovered in the installed runtime.
          Context tests are skipped if the runtime exposes no usable default context.
          This does not embed .NET 9, Nexia's custom TitleLoadContext, XNA, or any game.
          Results do not establish CastleMiner Z compatibility or performance.

          The prior 0.2 log confirmed Assembly.Load(byte[]) is not supported in AppX.
          No private runtime fields, OS patches, or permission changes are used here.
          Native and managed 0.2 probes have different package identities and stay intact.

          Install this package with its included Dependencies using Xbox Device Portal.
          Use Game as for the earlier test. Tests run automatically at launch.
          Send the finished screen and LocalState/managed-probe-log.txt.
          The log resets on launch. Do not uninstall working emulators or dependencies.

          This revised build and Xbox behavior are untested at preparation time.
          Source/notice provenance: NEXIA-LICENSE.txt and THIRD-PARTY-NOTICES.txt.
          ''', encoding='utf-8')
          print('Prepared loader comparison; Windows build and Xbox execution still need testing.')

      - name: Build and sign UWP loader comparison
        shell: pwsh
        env:
          PROBE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/xbox-managed-probe/build.ps1", [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          ./xbox-managed-probe/build.ps1 -BuildNumber ([int]$env:PROBE_BUILD_NUMBER)

      - name: Upload signed package or failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: XboxLoaderTest-x64-${{ github.run_number }}
          path: xbox-managed-probe/out/
          retention-days: 7
          if-no-files-found: warn
