name: Xbox - Managed Build

on:
  workflow_dispatch:
  push:
    branches: [Mousehook]
    paths:
      - '.github/workflows/xbox-managed-build.yml'

permissions:
  contents: read

concurrency:
  group: xbox-managed-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Prepare managed test and packaging fixes
        shell: python
        run: |
          import ast
          import hashlib
          import re
          import textwrap
          from pathlib import Path
          from urllib.request import urlopen

          # Recover verified source from a fixed historical commit.
          # No existing source file or folder is needed in your checkout.
          url = (
              "https://raw.githubusercontent.com/"
              "tjkeelan13-ctrl/Nexia360-emulation-edition/"
              "981ef63a319eac7f2ae4e59b0c2dfc8c9cf92a1a/"
              ".github/workflows/xbox-managed-probe.yml"
          )
          with urlopen(url, timeout=45) as response:
              data = response.read()
          expected = "d695cc0ae37039e4e5b0c2fb03705a33fe8cefb62496afc1149383cf5772857c"
          if hashlib.sha256(data).hexdigest() != expected:
              raise RuntimeError("Downloaded source failed integrity verification")

          root = Path("xbox-managed-probe")
          root.mkdir(exist_ok=True)
          blocks = re.findall(
              r"(?m)^        run: \|\n((?: {10}.*\n|\n)*)",
              data.decode("utf-8-sig")
          )
          written = set()
          for block in blocks:
              for node in ast.parse(textwrap.dedent(block)).body:
                  if not isinstance(node, ast.Expr):
                      continue
                  call = node.value
                  if not (isinstance(call, ast.Call)
                          and isinstance(call.func, ast.Attribute)
                          and call.func.attr == "write_text"):
                      continue
                  target = call.func.value
                  if not (isinstance(target, ast.BinOp)
                          and isinstance(target.op, ast.Div)):
                      raise RuntimeError("Unexpected source-file declaration")
                  name = ast.literal_eval(target.right)
                  if not isinstance(name, str) or "/" in name or "\\" in name:
                      raise RuntimeError("Unexpected source filename")
                  content = ast.literal_eval(call.args[0])
                  (root / name).write_text(content, encoding="utf-8")
                  written.add(name)
          if len(written) != 11:
              raise RuntimeError("Source extraction incomplete")

          script = root / "build.ps1"
          code = script.read_text(encoding="utf-8")
          def replace_once(old, new):
              global code
              if code.count(old) != 1:
                  raise RuntimeError("Expected packaging patch location missing")
              code = code.replace(old, new, 1)

          # Accept both possible package formats.
          old_search = "Get-ChildItem $packages -Recurse -Filter '*.appx'"
          if code.count(old_search) != 2:
              raise RuntimeError("Unexpected package-search code")
          code = code.replace(old_search, "Get-ChildItem $packages -Recurse -File")
          replace_once(
              "$_.Name -like 'NexiaXboxManagedProbe*.appx'",
              "$_.Extension -in @('.appx', '.msix')"
          )
          replace_once(
              r"$_.FullName -match '[\\/]Dependencies[\\/]' -and $_.FullName -match '[\\/]x64[\\/]'",
              r"$_.Extension -in @('.appx', '.msix') -and $_.FullName -match '[\\/]Dependencies[\\/]' -and $_.FullName -match '[\\/](x64|neutral)[\\/]'"
          )
          replace_once(
              'NexiaXboxManagedProbe_0.2.${BuildNumber}.0_x64.appx',
              'NexiaXboxManagedProbe_0.2.${BuildNumber}.0_x64$($apps[0].Extension)'
          )
          replace_once(
              "Get-ChildItem \"$out\\Dependencies\" -Filter '*.appx'",
              "Get-ChildItem \"$out\\Dependencies\" -File | Where-Object { $_.Extension -in @('.appx', '.msix') }"
          )
          replace_once(
              "$mainManifest = Read-AppxManifest $package",
              '''$mainManifest = Read-AppxManifest $package
              if ($mainManifest.Package.Identity.Name -ne 'NexiaXboxManagedProbe' -or
                  $mainManifest.Package.Identity.Publisher -ne 'CN=NexiaXboxManagedProbe' -or
                  $mainManifest.Package.Identity.ProcessorArchitecture -ne 'x64') {
                  throw 'Unexpected package identity, publisher or architecture.'
              }'''
          )
          script.write_text(code, encoding="utf-8")
          print("Prepared managed test sources, manifest fix and APPX/MSIX discovery fix.")

      - name: Build and sign managed UWP test
        shell: pwsh
        env:
          PROBE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/xbox-managed-probe/build.ps1", [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          ./xbox-managed-probe/build.ps1 -BuildNumber ([int]$env:PROBE_BUILD_NUMBER)

      - name: Upload package or build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: XboxManagedBuild-x64-${{ github.run_number }}
          path: xbox-managed-probe/out/
          retention-days: 7
          if-no-files-found: warn
