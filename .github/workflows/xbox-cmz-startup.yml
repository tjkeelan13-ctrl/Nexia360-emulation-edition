          using System.Reflection;
          using System.Threading;
          using Microsoft.Xna.Framework;
          using Microsoft.Xna.Framework.Graphics;
          
          namespace NexiaCMZLoader {
              public static class StartupHooks {
                  private static readonly object Gate = new object();
                  private static readonly List<string> Lines = new List<string>();
                  private static readonly HashSet<string> Seen = new HashSet<string>();
                  private static string logPath;
                  private static int failed;
                  private static long updates, draws;
                  public static bool Failed { get { return Interlocked.CompareExchange(ref failed,0,0) != 0; } }
                  public static void Begin(string folder) {
                      logPath=Path.Combine(folder,"cmz-startup-log.txt");
                      File.WriteAllText(logPath,"CMZ ORIGINAL STARTUP ATTEMPT 0.11 " + DateTime.UtcNow.ToString("O") + "\r\n");
                      Note("Original startup 0.11: Draw-thread GPU work queue + experimental water effect; previous terrain/sprite/music fixes retained.");
                      Note("Music playback was reported working by the user in 0.9. The new terrain shader is an approximate reimplementation, NOT a lossless Xbox shader conversion. Terrain and water shading remain approximate. Original-model/other effects, avatars and couch co-op remain separate work.");
                      Note("Trial-only development policy is unchanged. All original input archives are retained.");
                  }
                  public static void Note(string text) {
                      lock(Gate) {
                          Lines.Add(text);
                          try { File.AppendAllText(logPath,DateTime.UtcNow.ToString("O")+" "+text+"\r\n"); } catch { }
                      }
                  }
                  public static void Once(string text) { lock(Gate) { if(Seen.Add(text)) Note(text); } }
                  public static void Enter(string method) {
                      if(method=="Update") Interlocked.Increment(ref updates);
                      if(method=="Draw") {
                          FrameGpuWork.EnterDraw();
                          Interlocked.Increment(ref draws);
                          Once("FRAME GPU QUEUE: original Draw owns scheduled graphics operations; UI dispatch is not used.");
                      }
                      Once("ENTER original "+method);
                  }
                  public static void Returned(string method) {
                      if(method=="Draw") FrameGpuWork.ExitDraw();
                      Once("RETURN original "+method);
                  }
                  public static void Stop(Exception error,string stage) {
                      if(stage=="Draw") FrameGpuWork.ExitDraw();
                      Interlocked.Exchange(ref failed,1);
                      FrameGpuWork.Abort(error);
                      while(error is TargetInvocationException && error.InnerException!=null) error=error.InnerException;
                      Note("STOPPED at "+stage+": "+error);
                  }
                  public static string Snapshot() {
                      lock(Gate) {
                          int first=Math.Max(0,Lines.Count-12);
                          return "CMZ ORIGINAL STARTUP 0.11 - EXPERIMENTAL\n" +
                              string.Join("\n",Lines.GetRange(first,Lines.Count-first))+
                              "\nOriginal calls: update="+Interlocked.Read(ref updates)+" draw="+Interlocked.Read(ref draws)+
                              "\nLog: LocalState/cmz-startup-log.txt";
                      }
                  }
                  // The original console-only affinity hint does not describe this CPU's topology.
                  // Retain the host scheduler rather than pin to arbitrary Xbox 360 thread indices.
                  public static void ConsoleAffinity(System.Threading.Thread thread,int[] cores) {
                      if(thread==null || cores==null) throw new ArgumentNullException();
                      Once("PORT ADAPTATION: console CPU-affinity hint ignored; using the Xbox host scheduler.");
                  }
                  public static void BeforeConstruction(Assembly game,Assembly engine) {
                      var type=engine.GetType("DNA.Reflection.ReflectionTools",true);
                      var register=type.GetMethod("RegisterAssembly",BindingFlags.Public|BindingFlags.Static,
                          null,new Type[]{typeof(Assembly),typeof(Assembly)},null);
                      if(register==null) throw new MissingMethodException(type.FullName,"RegisterAssembly");
                      register.Invoke(null,new object[]{game,engine});
                      Once("Original game/engine reflection registration completed.");
                  }
                  public static void AfterConstruction(Game game) {
                      game.Content=new StartupContentManager(game.Services);
                      var manager=game.Services.GetService(typeof(IGraphicsDeviceManager)) as GraphicsDeviceManager;
                      if(manager==null) throw new InvalidOperationException("Original constructor did not register a GraphicsDeviceManager.");
                      manager.GraphicsProfile=GraphicsProfile.HiDef;
                      manager.PreferredBackBufferWidth=1280;
                      manager.PreferredBackBufferHeight=720;
                      manager.SynchronizeWithVerticalRetrace=true;
                      game.IsFixedTimeStep=true;
                      game.TargetElapsedTime=TimeSpan.FromSeconds(1.0/60.0);
                      game.IsMouseVisible=false;
                      Once("Original CastleMinerZGame constructor returned; original game owns the graphics manager.");
                  }
              }
          }
          ''')
