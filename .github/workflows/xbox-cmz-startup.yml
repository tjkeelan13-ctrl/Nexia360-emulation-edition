                  body.Emit(OpCodes.Ldarg,streaming.Parameters[1]);body.Emit(OpCodes.Ldarg,streaming.Parameters[2]);body.Emit(OpCodes.Ldarg,streaming.Parameters[3]);
                  body.Emit(OpCodes.Call,residentGuard);
