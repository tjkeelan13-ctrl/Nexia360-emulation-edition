      - name: Write StartupFiles.cs (1 of 1)
        shell: python
        run: |
          from pathlib import Path
          path = Path("xbox-cmz-services") / 'StartupFiles.cs'
          path.parent.mkdir(parents=True, exist_ok=True)
          with path.open('w', encoding="utf-8", newline="") as output:
              output.write(r'''// Only this app's private, verified content archive is imported. No game download or online service.
          using System;
          using System.Collections.Generic;
          using System.IO;
          using System.IO.Compression;
          using System.Linq;
          using System.Reflection;
          using System.Security.Cryptography;
          using Microsoft.Xna.Framework.Content;
          using Windows.ApplicationModel;
          using Windows.Storage;

          namespace NexiaCMZLoader {
              public static class StartupFiles {
                  public static string ContentFolder { get; private set; }
                  internal static Assembly EngineAssembly, GameAssembly;
                  public static void ImportContent(string localFolder) {
                      const string expected="1888e88cc80cad625d2ae0416ea200c91919107b0b151e2d094f6380fd442132";
                      string zip=Path.Combine(localFolder,"CastleMinerZ-startup-content.zip");
                      if(!File.Exists(zip)) throw new FileNotFoundException("Upload CastleMinerZ-startup-content.zip to this app's LocalState, keeping it zipped.",zip);
                      if(new FileInfo(zip).Length!=29032679) throw new InvalidDataException("Wrong startup content archive size.");
                      string actual;
                      using(var input=File.OpenRead(zip)) using(var sha=SHA256.Create())
                          actual=BitConverter.ToString(sha.ComputeHash(input)).Replace("-","").ToLowerInvariant();
                      if(actual!=expected) throw new InvalidDataException("Startup content archive hash mismatch.");
                      ContentFolder=Path.Combine(localFolder,"StartupContent07");Directory.CreateDirectory(ContentFolder);
                      using(var input=File.OpenRead(zip)) using(var archive=new ZipArchive(input,ZipArchiveMode.Read)) {
                          if(archive.Entries.Count!=228) throw new InvalidDataException("Unexpected content inventory.");
                          var seen=new HashSet<string>(StringComparer.OrdinalIgnoreCase);long total=0;
                          foreach(var entry in archive.Entries) {
                              var name=CleanRelative(entry.FullName);
                              if(!seen.Add(name)) throw new InvalidDataException("Duplicate content entry");
                              total+=entry.Length;
                              if(entry.Length<0 || entry.Length>64*1024*1024 || total>192*1024*1024) throw new InvalidDataException("Content size limit exceeded.");
                              var destination=Below(ContentFolder,name);Directory.CreateDirectory(Path.GetDirectoryName(destination));
                              using(var source=entry.Open()) using(var output=File.Create(destination)) {
                                  var buffer=new byte[65536];long written=0;int n;
                                  while((n=source.Read(buffer,0,buffer.Length))>0) {
                                      written+=n;if(written>entry.Length) throw new InvalidDataException("Oversized content entry");
                                      output.Write(buffer,0,n);
                                  }
                                  if(written!=entry.Length) throw new EndOfStreamException("Incomplete content entry");
                              }
                          }
                      }
                      StartupHooks.Note("Verified/imported original content pack. 98 texture/font assets converted; other formats remain original.");
                  }
                  internal static string CleanRelative(string path) {
                      if(string.IsNullOrWhiteSpace(path)) throw new ArgumentException("Empty content path");
                      path=path.Replace('\\','/');
                      if(path.StartsWith("/") || path.Contains(":")) throw new ArgumentException("Content path must be relative");
                      var parts=path.Split('/');
                      if(parts.Any(p=>p.Length==0 || p=="." || p==".." || p.IndexOfAny(Path.GetInvalidFileNameChars())>=0))
                          throw new ArgumentException("Unsafe content path");
                      return string.Join(Path.DirectorySeparatorChar.ToString(),parts);
                  }
                  internal static string Below(string root,string path) {
                      var prefix=Path.GetFullPath(root).TrimEnd(Path.DirectorySeparatorChar)+Path.DirectorySeparatorChar;
                      var full=Path.GetFullPath(Path.Combine(prefix,CleanRelative(path)));
                      if(!full.StartsWith(prefix,StringComparison.OrdinalIgnoreCase)) throw new ArgumentException("Path outside content root");
                      return full;
                  }
                  // The private copy of MonoGame in this app routes TitleContainer.OpenStream here.
                  // AudioEngine and ContentManager can therefore read this app's LocalState assets.
                  public static Stream OpenTitleStream(string path) {
                      path=CleanRelative(path);
                      var contentPrefix="Content"+Path.DirectorySeparatorChar;
                      if(path.StartsWith(contentPrefix,StringComparison.OrdinalIgnoreCase)) {
                          if(ContentFolder==null) throw new InvalidOperationException("Startup content not imported");
                          var full=Below(ContentFolder,path.Substring(contentPrefix.Length));
                          StartupHooks.Once("OPEN original title asset: "+path);
                          return File.OpenRead(full);
                      }
                      return File.OpenRead(Below(Package.Current.InstalledLocation.Path,path));
                  }
                  internal static string ContentPath(string name) {
                      if(ContentFolder==null) throw new InvalidOperationException("Startup content unavailable");
                      return Below(ContentFolder,name+".xnb");
                  }
              }
              public sealed class StartupContentManager : ContentManager {
                  private static readonly object ReaderGate=new object();
                  private static readonly HashSet<string> Registered=new HashSet<string>();
                  public StartupContentManager(IServiceProvider services) : base(services,"Content") { }
                  public override T Load<T>(string name) {
                      StartupHooks.Once("LOAD original content: "+name+" as "+typeof(T).FullName);
                      return base.Load<T>(name);
                  }
                  protected override Stream OpenStream(string assetName) {
                      var stream=File.OpenRead(StartupFiles.ContentPath(assetName));
                      try {
                          // Unconverted Xbox shaders/models/other content is not silently treated as PC data.
                          using(var reader=new BinaryReader(stream,System.Text.Encoding.UTF8,true)) {
                              if(new string(reader.ReadChars(3))!="XNB") throw new InvalidDataException("Invalid XNB asset");
                              char platform=(char)reader.ReadByte();
                              int version=reader.ReadByte(),flags=reader.ReadByte();
                              int length=reader.ReadInt32();
                              if(platform!='w') throw new NotSupportedException("This original asset still needs format conversion: "+assetName);
                              if(version!=5 || (flags&0xC0)!=0 || length!=stream.Length) throw new InvalidDataException("Unexpected prepared XNB format");
                              int count=Read7(reader);
                              if(count<1 || count>128) throw new InvalidDataException("Invalid content reader count");
                              for(int i=0;i<count;i++) {
                                  string typeName=reader.ReadString();reader.ReadInt32();
                                  RegisterReader(typeName);
                              }
                          }
                          stream.Position=0;return stream;
                      } catch { stream.Dispose();throw; }
                  }
                  private static int Read7(BinaryReader reader) {
                      int n=0;
                      for(int shift=0;shift<35;shift+=7) { byte b=reader.ReadByte();n|=(b&127)<<shift;if((b&128)==0)return n; }
                      throw new InvalidDataException("Invalid encoded length");
                  }
                  private static Assembly ResolveReaderAssembly(AssemblyName name) {
                      if(name.Name.StartsWith("Microsoft.Xna.Framework",StringComparison.Ordinal)) return typeof(ContentManager).Assembly;
                      if(name.Name=="mscorlib" || name.Name=="System.Private.CoreLib") return typeof(object).Assembly;
                      if(name.Name=="DNA.Common") return StartupFiles.EngineAssembly;
                      if(name.Name=="CastleMinerZ") return StartupFiles.GameAssembly;
                      return Assembly.Load(new AssemblyName(name.Name));
                  }
                  private static Type ResolveReaderType(Assembly assembly,string name,bool ignoreCase) {
                      if(assembly!=null) return assembly.GetType(name,false,ignoreCase);
                      foreach(var provider in new[]{typeof(ContentManager).Assembly,typeof(object).Assembly,StartupFiles.EngineAssembly,StartupFiles.GameAssembly}) {
                          if(provider==null) continue;
                          var type=provider.GetType(name,false,ignoreCase);if(type!=null)return type;
                      }
                      return null;
                  }
                  private static void RegisterReader(string name) {
                      lock(ReaderGate) {
                          if(Registered.Contains(name))return;
                          var type=Type.GetType(name,ResolveReaderAssembly,ResolveReaderType,true);
                          if(!typeof(ContentTypeReader).IsAssignableFrom(type)) throw new InvalidDataException("Invalid content reader type: "+name);
                          ContentTypeReaderManager.AddTypeCreator(name,()=> (ContentTypeReader)Activator.CreateInstance(type));
                          Registered.Add(name);
                      }
                  }
              }
          }
          ''')
