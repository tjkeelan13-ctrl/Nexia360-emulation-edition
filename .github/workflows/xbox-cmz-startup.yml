      - name: Write ModelContent12.cs
        shell: python
        run: |
          from pathlib import Path
          path=Path('xbox-cmz-services') / 'ModelContent12.cs'
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(r'''// Original 0.12 route for converted standard models. Actual graph construction remains MonoGame's ModelReader.
          using System;
          using System.Collections.Generic;
          using System.IO;
          using Microsoft.Xna.Framework.Graphics;

          namespace NexiaCMZLoader {
              public static class ModelContent12 {
                  private static Dictionary<string,string> paths;
                  private static readonly Dictionary<string,ModelFileSpec12> specs=CreateLookup();
                  private static Dictionary<string,ModelFileSpec12> CreateLookup() {
                      var result=new Dictionary<string,ModelFileSpec12>(StringComparer.OrdinalIgnoreCase);
                      foreach(var s in ModelManifest12.Files)result.Add(s.Path.Substring(0,s.Path.Length-4),s);
                      return result;
                  }
                  public static void Import(string folder) {
                      paths=null;
                      paths=ModelArchive12.Import(Path.Combine(folder,"CastleMinerZ-models-basic.zip"),Path.Combine(folder,"ModelContent12"),
                          ModelManifest12.ArchiveLength,ModelManifest12.ArchiveHash,ModelManifest12.Files);
                      StartupHooks.Note("MODEL INPUT: verified 26 converted BasicEffect models. Original bone/mesh metadata and texture references retained; vertex/index words converted, not substitute geometry.");
                  }
                  public static bool TrySpec(string name,out ModelFileSpec12 spec) {
                      spec=null;if(name==null)return false;
                      return specs.TryGetValue(name.Replace('\\','/'),out spec);
                  }
                  public static string OverridePath(string name) {
                      ModelFileSpec12 spec;if(!TrySpec(name,out spec))return null;
                      if(paths==null)throw new InvalidOperationException("Converted model inputs were not imported.");
                      return paths[name.Replace('\\','/')];
                  }
                  public static void ValidateLoaded(Model model,ModelFileSpec12 spec) {
                      if(model==null||model.Root==null||model.Bones.Count!=spec.Bones||model.Meshes.Count!=spec.Meshes)
                          throw new InvalidDataException("Loaded model bone/mesh counts differ from verified input: "+spec.Path);
                      int parts=0,vertices=0,triangles=0;
                      foreach(ModelMesh mesh in model.Meshes) {
                          if(mesh.ParentBone==null)throw new InvalidDataException("Model mesh is missing its original parent bone.");
                          foreach(ModelMeshPart part in mesh.MeshParts) {
                              if(part.VertexBuffer==null||part.IndexBuffer==null||!(part.Effect is BasicEffect))
                                  throw new InvalidDataException("Model shared buffer/material was not linked: "+spec.Path);
                              if(part.VertexOffset<0||part.NumVertices<0||part.StartIndex<0||part.PrimitiveCount<0||
                                  (long)part.VertexOffset+part.NumVertices>part.VertexBuffer.VertexCount||
                                  (long)part.StartIndex+3L*part.PrimitiveCount>part.IndexBuffer.IndexCount)
                                  throw new InvalidDataException("Loaded model draw range is outside its buffers: "+spec.Path);
                              parts++;vertices=checked(vertices+part.NumVertices);triangles=checked(triangles+part.PrimitiveCount);
                          }
                      }
                      if(parts!=spec.Parts||vertices!=spec.PartVertices||triangles!=spec.Triangles)
                          throw new InvalidDataException("Loaded model geometry counts differ from verified input: "+spec.Path);
                      StartupHooks.Once("MODEL READY: "+spec.Path+"; bones="+model.Bones.Count+" meshes="+model.Meshes.Count+" parts="+parts+" triangles="+triangles+
                          ". Original graph loaded on Draw thread; appearance/gameplay not yet verified.");
                  }
              }
          }
          ''',encoding='utf-8')
      - name: Write ModelTests12/ModelTests12.csproj
