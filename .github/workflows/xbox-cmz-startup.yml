      - name: Write MenuTests13/Program.cs
        shell: python
        run: |
          from pathlib import Path
          path=Path('xbox-cmz-services') / 'MenuTests13/Program.cs'
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(r'''// Compile and exercise exact policy/preferences/IL patch code against synthetic inputs.
          // No original game binaries, user artwork, Windows graphics runtime or console are involved.
          using System;
          using System.IO;
          using System.Linq;
          using System.Reflection;
          using System.Security.Cryptography;
          using System.Runtime.Loader;
          using Mono.Cecil;
          using Mono.Cecil.Cil;
          using NexiaCMZLoader;
          using MA=Mono.Cecil.MethodAttributes;
          using TA=Mono.Cecil.TypeAttributes;
          using FA=Mono.Cecil.FieldAttributes;
          internal static class Program {
              private static int count;
              private static void Require(bool value,string why){if(!value)throw new Exception(why);}
              private static void Test(string name,Action action){action();count++;Console.WriteLine("PASS "+name);}
              private static void Throws<T>(Action action) where T:Exception {try{action();}catch(T){return;}throw new Exception("Expected "+typeof(T).Name);}
              private static byte[] Sign(byte[] data){using(var sha=SHA256.Create()){var h=sha.ComputeHash(data,0,25);Array.Copy(h,0,data,25,32);}return data;}
              private static AssemblyDefinition Fixture() {
                  var a=AssemblyDefinition.CreateAssembly(new AssemblyNameDefinition("MenuFixture"+Guid.NewGuid().ToString("N"),new Version(1,0)),"fixture",ModuleKind.Dll);
                  var m=a.MainModule;var t=new TypeDefinition("Fixtures","Original",TA.Public|TA.Class,m.TypeSystem.Object);m.Types.Add(t);
                  var ctor=new MethodDefinition(".ctor",MA.Public|MA.SpecialName|MA.RTSpecialName,m.TypeSystem.Void);t.Methods.Add(ctor);
                  var il=ctor.Body.GetILProcessor();il.Emit(OpCodes.Ldarg_0);il.Emit(OpCodes.Call,m.ImportReference(typeof(object).GetConstructor(Type.EmptyTypes)));il.Emit(OpCodes.Ret);
                  var value=new FieldDefinition("Value",FA.Public,m.TypeSystem.Int32);t.Fields.Add(value);
                  var source=new MethodDefinition("SecondaryLoad",MA.Public,m.TypeSystem.Void);t.Methods.Add(source);source.Body.InitLocals=true;
                  var variable=new VariableDefinition(m.TypeSystem.Int32);source.Body.Variables.Add(variable);il=source.Body.GetILProcessor();
                  il.Emit(OpCodes.Ldc_I4,7);il.Emit(OpCodes.Stloc,variable);il.Emit(OpCodes.Ldarg_0);il.Emit(OpCodes.Ldloc,variable);il.Emit(OpCodes.Stfld,value); // 0..18
                  il.Emit(OpCodes.Ldarg_0);il.Emit(OpCodes.Ldc_I4,99);il.Emit(OpCodes.Stfld,value); // excluded whole assignment
                  il.Emit(OpCodes.Ret);
                  var branch=new MethodDefinition("Branch",MA.Public,m.TypeSystem.Void);t.Methods.Add(branch);il=branch.Body.GetILProcessor();var end=Instruction.Create(OpCodes.Ret);il.Emit(OpCodes.Br,end);il.Append(end);
                  foreach(var tuple in new[]{("StartHandler",2),("SelectHandler",2),("SaveHandler",1)}) {
                      var method=new MethodDefinition(tuple.Item1,MA.Public,m.TypeSystem.Void);t.Methods.Add(method);
                      for(int i=0;i<tuple.Item2;i++)method.Parameters.Add(new ParameterDefinition("p"+i,Mono.Cecil.ParameterAttributes.None,m.TypeSystem.Object));
                      method.Body.GetILProcessor().Emit(OpCodes.Ret);
                  }
                  // Re-read so byte offsets and CodeSize are the same representation consumed at runtime.
                  using(var stream=new MemoryStream()){a.Write(stream);a.Dispose();return AssemblyDefinition.ReadAssembly(new MemoryStream(stream.ToArray()),new ReaderParameters{ReadingMode=ReadingMode.Immediate});}
              }
              private static void ILTests() {
                  using(var a=Fixture()) {
                      var t=a.MainModule.GetType("Fixtures.Original");var source=t.Methods.Single(m=>m.Name=="SecondaryLoad");
                      var original=source.Body.Instructions.Select(i=>i.ToString()).ToArray();int cut=source.Body.Instructions[5].Offset,last=source.Body.Instructions.Last().Offset;
                      var copy=MenuPatch13.CopyStraightLineSlices(t,source,"MenuBoot",new[]{new[]{0,cut},new[]{last,source.Body.CodeSize}});
                      Test("original body retained exactly",()=>Require(original.SequenceEqual(source.Body.Instructions.Select(i=>i.ToString())),"original mutated"));
                      Test("cloned locals are independent",()=>Require(!object.ReferenceEquals(copy.Body.Variables[0],source.Body.Variables[0]) && copy.Body.Instructions.Where(i=>i.Operand is VariableDefinition).All(i=>object.ReferenceEquals(i.Operand,copy.Body.Variables[0])),"local remap"));
                      Test("reversed ranges rejected",()=>Throws<ArgumentException>(()=>MenuPatch13.CopyStraightLineSlices(t,source,"bad",new[]{new[]{cut,0}})));
                      Test("overlap rejected",()=>Throws<ArgumentException>(()=>MenuPatch13.CopyStraightLineSlices(t,source,"bad",new[]{new[]{0,cut},new[]{0,source.Body.CodeSize}})));
                      Test("middle of instruction rejected",()=>Throws<InvalidOperationException>(()=>MenuPatch13.CopyStraightLineSlices(t,source,"bad",new[]{new[]{1,cut}})));
                      Test("missing final return rejected",()=>Throws<InvalidOperationException>(()=>MenuPatch13.CopyStraightLineSlices(t,source,"bad",new[]{new[]{0,cut}})));
                      var branch=t.Methods.Single(m=>m.Name=="Branch");
                      Test("branch-containing slice rejected",()=>Throws<NotSupportedException>(()=>MenuPatch13.CopyStraightLineSlices(t,branch,"bad",new[]{new[]{0,branch.Body.CodeSize}})));
                      Test("full mode leaves input module untouched",()=>{MenuStage13.Enabled=false;MenuPatch13.Apply(a.MainModule,s=>{});Require(source.Body.Instructions.Count==original.Length,"changed");});
                      MenuPatch13.RouteHandler(a.MainModule,t,"StartHandler",2,"Start",false);
                      MenuPatch13.RouteHandler(a.MainModule,t,"SelectHandler",2,"MainSelected",true);
                      MenuPatch13.RouteHandler(a.MainModule,t,"SaveHandler",1,"Save",true);
                      Test("missing hook rejected",()=>Throws<MissingMethodException>(()=>MenuPatch13.RouteHandler(a.MainModule,t,"StartHandler",2,"NoSuchHook",false)));
                      byte[] bytes;using(var s=new MemoryStream()){a.Write(s);bytes=s.ToArray();}
                      // Load the patched fixture, resolving recording hooks to this test assembly.
                      var context=new AssemblyLoadContext("menu-test-"+Guid.NewGuid(),true);
                      context.Resolving+=(c,n)=>n.Name==typeof(Program).Assembly.GetName().Name?typeof(Program).Assembly:null;
                      try {
                          var assembly=context.LoadFromStream(new MemoryStream(bytes));var type=assembly.GetType("Fixtures.Original",true);var obj=Activator.CreateInstance(type);
                          Test("menu IL executes retained block, not deferred block",()=>{type.GetMethod("MenuBoot",BindingFlags.NonPublic|BindingFlags.Instance).Invoke(obj,null);Require((int)type.GetField("Value").GetValue(obj)==7,"not 7");});
                          Test("original full body still executes deferred block",()=>{type.GetMethod("SecondaryLoad").Invoke(obj,null);Require((int)type.GetField("Value").GetValue(obj)==99,"not 99");});
                          var sender=new object();var args=new object();
                          Test("Start hook receives original owner",()=>{type.GetMethod("StartHandler").Invoke(obj,new[]{sender,args});Require(object.ReferenceEquals(MenuStage13.Owner,obj)&&MenuStage13.Argument==null&&MenuStage13.Hook=="Start","wrong Start");});
                          Test("selection hook receives original owner and final event args",()=>{type.GetMethod("SelectHandler").Invoke(obj,new[]{sender,args});Require(object.ReferenceEquals(MenuStage13.Owner,obj)&&object.ReferenceEquals(MenuStage13.Argument,args)&&MenuStage13.Hook=="MainSelected","wrong select");});
                          Test("save hook receives original stats object",()=>{type.GetMethod("SaveHandler").Invoke(obj,new[]{args});Require(object.ReferenceEquals(MenuStage13.Owner,obj)&&object.ReferenceEquals(MenuStage13.Argument,args)&&MenuStage13.Hook=="Save","wrong save");});
                      } finally {context.Unload();}
                  }
              }
              public static int Main() {
                  string root=Path.Combine(Path.GetTempPath(),"menu13-"+Guid.NewGuid().ToString("N"));Directory.CreateDirectory(root);
                  try {
                      Test("default mode is menu",()=>Require(MenuPolicy13.ParseMode(null),"default"));
                      Test("explicit menu mode accepts whitespace/case",()=>Require(MenuPolicy13.ParseMode(" MENU\r\n"),"menu"));
                      Test("explicit full mode preserved",()=>Require(!MenuPolicy13.ParseMode(" full "),"full"));
                      Test("unknown mode rejected",()=>Throws<ArgumentException>(()=>MenuPolicy13.ParseMode("fake")));
                      Test("all physical slots accepted",()=>{for(int i=0;i<4;i++)Require(MenuPolicy13.Slot(i)==i,"slot");});
                      Test("invalid slots rejected",()=>{Throws<ArgumentOutOfRangeException>(()=>MenuPolicy13.Slot(-1));Throws<ArgumentOutOfRangeException>(()=>MenuPolicy13.Slot(4));});
                      Test("main Options route",()=>Require(MenuPolicy13.Main(5)==MenuAction13.Options,"options"));
                      Test("main return route",()=>Require(MenuPolicy13.Main(2)==MenuAction13.ReturnToTitle,"title"));
                      Test("Play purchase codes awards unavailable",()=>{foreach(int tag in new[]{0,1,3,4,-1,100})Require(MenuPolicy13.Main(tag)==MenuAction13.Unavailable,"ungated "+tag);});
                      Test("original Controls and Settings routes",()=>Require(MenuPolicy13.Options(0)==MenuAction13.Controls && MenuPolicy13.Options(2)==MenuAction13.Settings,"options"));
                      Test("destructive world operations unavailable",()=>{foreach(int tag in new[]{1,3,-1,99})Require(MenuPolicy13.Options(tag)==MenuAction13.Unavailable,"storage "+tag);});
                      var v=new MenuPreferenceValues13{Brightness=0.25f,Sensitivity=1.5f,Music=0.6f,Invert=true};
                      byte[] data=MenuPreferences13.Encode(2,v);
                      Test("preference roundtrip",()=>{var x=MenuPreferences13.Decode(2,data);Require(x.Brightness==v.Brightness&&x.Sensitivity==v.Sensitivity&&x.Music==v.Music&&x.Invert,"roundtrip");});
                      Test("slot mismatch rejected",()=>Throws<InvalidDataException>(()=>MenuPreferences13.Decode(1,data)));
                      Test("truncation and trailing data rejected",()=>{Throws<InvalidDataException>(()=>MenuPreferences13.Decode(2,data.Take(56).ToArray()));Throws<InvalidDataException>(()=>MenuPreferences13.Decode(2,data.Concat(new byte[]{0}).ToArray()));});
                      Test("corruption rejected",()=>{var b=(byte[])data.Clone();b[13]^=1;Throws<InvalidDataException>(()=>MenuPreferences13.Decode(2,b));});
                      Test("invalid magic rejected even with matching checksum",()=>{var b=(byte[])data.Clone();b[0]^=1;Throws<InvalidDataException>(()=>MenuPreferences13.Decode(2,Sign(b)));});
                      Test("invalid boolean rejected even with matching checksum",()=>{var b=(byte[])data.Clone();b[24]=2;Throws<InvalidDataException>(()=>MenuPreferences13.Decode(2,Sign(b)));});
                      Test("nonfinite values rejected",()=>{Throws<InvalidDataException>(()=>MenuPreferences13.Encode(0,new MenuPreferenceValues13{Music=float.NaN}));Throws<InvalidDataException>(()=>MenuPreferences13.Encode(0,new MenuPreferenceValues13{Sensitivity=float.PositiveInfinity}));});
                      Test("out-of-range values rejected",()=>{Throws<InvalidDataException>(()=>MenuPreferences13.Encode(0,new MenuPreferenceValues13{Brightness=1}));Throws<InvalidDataException>(()=>MenuPreferences13.Encode(0,new MenuPreferenceValues13{Sensitivity=0}));});
                      Test("preferences survive file reopen",()=>{MenuPreferences13.Save(root,2,v);string note;Require(MenuPreferences13.Load(root,2,out note).Music==v.Music,"reopen");});
                      Test("slots remain separate",()=>{MenuPreferences13.Save(root,1,new MenuPreferenceValues13{Music=0.2f});string note;Require(MenuPreferences13.Load(root,1,out note).Music==0.2f && MenuPreferences13.Load(root,2,out note).Music==0.6f,"isolation");});
                      Test("missing preferences use defaults",()=>{string note;Require(MenuPreferences13.Load(root,3,out note).Music==1,"defaults");});
                      Test("prior good preferences recover from bad primary",()=>{MenuPreferences13.Save(root,2,new MenuPreferenceValues13{Music=0.8f});File.WriteAllText(Path.Combine(root,"slot-2.bin"),"bad");string note;Require(MenuPreferences13.Load(root,2,out note).Music==0.6f && note.Contains("backup"),"backup");Require(File.ReadAllText(Path.Combine(root,"slot-2.bin"))=="bad","original bad primary deleted");});
                      Test("unrelated world sentinel untouched",()=>{string p=Path.Combine(root,"stats.sav");File.WriteAllText(p,"do not touch");MenuPreferences13.Save(root,0,v);Require(File.ReadAllText(p)=="do not touch","world data changed");});
                      Test("invalid sprite input rejected",()=>Throws<InvalidDataException>(()=>MenuSprites13.Import(root)));
                      Test("unrelated atlas path is not redirected",()=>Require(MenuSprites13.OverridePath("OtherSheet")==null,"unrelated"));
                      Test("unverified atlas cannot be consumed",()=>Throws<InvalidOperationException>(()=>MenuSprites13.OverridePath("spritesheet")));
                      string header=Path.Combine(root,"test.xnb");
                      Action<byte,byte,byte,int> write=(platform,ver,flags,size)=>{using(var w=new BinaryWriter(File.Create(header))){w.Write(new byte[]{88,78,66,platform,ver,flags});w.Write(size);}};
                      Test("prepared XNB header accepted",()=>{write(119,5,1,10);MenuBatch13.CheckHeader(header,true);});
                      Test("Xbox original header not passed as converted",()=>{write(120,5,129,10);MenuBatch13.CheckHeader(header,false);Throws<InvalidDataException>(()=>MenuBatch13.CheckHeader(header,true));});
                      Test("header length mismatch rejected",()=>{write(119,5,1,11);Throws<InvalidDataException>(()=>MenuBatch13.CheckHeader(header,true));});
                      ILTests();
                      Console.WriteLine("MENU13 TESTS COMPLETE: "+count+" PASS. Synthetic helpers/IL fixture only; actual game menu, controller, art and Xbox UWP runtime are NOT tested here.");return 0;
                  } catch(Exception e){Console.Error.WriteLine(e);return 1;} finally {Directory.Delete(root,true);}
              }
          }
          ''',encoding='utf-8')
