                  private const string AssetHash="2cf7e69ec1151a24f67d3af35e123a795bb6e7b44d9aefdbf5880e1521ab50e0";
                  private const long ArchiveLength=2786056, AssetLength=15379808;
                  private static string path;
                  private static string Hash(Stream input) { using(var sha=SHA256.Create()) return BitConverter.ToString(sha.ComputeHash(input)).Replace("-","").ToLowerInvariant(); }
                  private static bool Valid(string value) {
                      if(!File.Exists(value) || new FileInfo(value).Length!=AssetLength) return false;
                      using(var input=File.OpenRead(value)) return Hash(input)==AssetHash;
