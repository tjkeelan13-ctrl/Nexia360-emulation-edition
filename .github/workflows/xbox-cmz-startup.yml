# Generator size gate: <=450000 bytes; whole-source compression preserves every file.
# CMZ 1.6.3 co-op respawn terrain, local profiles, native name tags, Nexia stock avatars and LMG material; Windows/Xbox testing pending.
# Existing location: .github/workflows/xbox-cmz-startup.yml, branch Mousehook.
# Hash-pinned public source only. Keep CastleMinerZ-1.6.3-input.zip private.
name: Xbox - CastleMiner Z 1.6.3

on:
  workflow_dispatch:
  push:
    branches: [Mousehook]
    paths:
      - '.github/workflows/xbox-cmz-startup.yml'
permissions:
  contents: read
concurrency:
  group: xbox-cmz-startup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Materialize the CMZ 1.6.3 compatibility source
        shell: python
        run: |
          import base64, hashlib, io, lzma, zipfile
          from pathlib import Path, PurePosixPath
          encoded = """
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          """
          packed = base64.b64decode(encoded, validate=False)
          if hashlib.sha256(packed).hexdigest() != "3de80106a3fec5df5335cbe361b49bd06ecd43811816227e4927f5ed11be06a6":
              raise RuntimeError("CMZ 1.6.3 compressed source digest mismatch")
          raw = lzma.decompress(packed, format=lzma.FORMAT_XZ, memlimit=64*1024*1024)
          if len(raw) != 1678784 or hashlib.sha256(raw).hexdigest() != "33a96b86d2bf6f6e89bef9f6eb9b792bae71f8ff2fd8ed327785326d3f12e6f0":
              raise RuntimeError("CMZ 1.6.3 extracted source digest mismatch")
          root = Path("xbox-cmz-services")
          root.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              entries = archive.infolist()
              if len(entries) != 197 or sum(e.file_size for e in entries) > 8*1024*1024:
                  raise RuntimeError("Unexpected saved source inventory")
              seen = set()
              for entry in entries:
                  name = PurePosixPath(entry.filename)
                  if name.is_absolute() or not name.parts or ".." in name.parts or "\\" in entry.filename or ":" in entry.filename or entry.filename in seen:
                      raise RuntimeError("Unsafe or duplicate source path")
                  seen.add(entry.filename)
                  output = root.joinpath(*name.parts)
                  output.parent.mkdir(parents=True, exist_ok=True)
                  output.write_bytes(archive.read(entry))
          print("Materialized CMZ 1.6.3 compatibility source: 197 public files. Private original game content is imported only on the console.")

      - name: Run regression suites, compile effects and app, sign only after success
        shell: pwsh
        env:
          PROBE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/xbox-cmz-services/build.ps1", [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          ./xbox-cmz-services/build.ps1 -BuildNumber ([int]$env:PROBE_BUILD_NUMBER)

      - name: Upload checked installer or failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: XboxCMZ163-x64-${{ github.run_number }}
          path: xbox-cmz-services/out/
          retention-days: 7
          if-no-files-found: warn
