      - name: Write EffectChecks10/verify_effect.py
        shell: python
        run: |
          from pathlib import Path
          path = Path('xbox-cmz-services') / 'EffectChecks10/verify_effect.py'
          path.parent.mkdir(parents=True, exist_ok=True)
          with path.open('w', encoding='utf-8', newline='') as output:
              output.write(r'''"""Bounded MGFX v10/DirectX structural reader for build-time contract checks.
          Format facts checked against MonoGame v3.8.1 Effect.cs and Shader.cs.
          It does not construct a graphics device or verify rendered appearance.
          """
          import json,struct,sys
          from pathlib import Path
          class Reader:
              def __init__(self,b):self.b=b;self.p=0
              def take(self,n):
                  if n<0 or self.p+n>len(self.b):raise ValueError('Truncated/invalid MGFX range')
                  v=self.b[self.p:self.p+n];self.p+=n;return v
              def num(self,fmt):return struct.unpack('<'+fmt,self.take(struct.calcsize('<'+fmt)))[0]
              def u8(self):return self.num('B')
              def u16(self):return self.num('H')
              def i32(self):return self.num('i')
              def count(self,maxn=4096):
                  n=self.i32()
                  if n<0 or n>maxn:raise ValueError('Invalid element count')
                  return n
              def string(self):
                  n=0
                  for shift in range(0,35,7):
                      a=self.u8();n|=(a&127)<<shift
                      if a<128:
                          if n>65536:raise ValueError('String limit exceeded')
                          return self.take(n).decode('utf8')
                  raise ValueError('Invalid string prefix')
              def annotations(self):
                  if self.count()!=0:raise ValueError('Annotations deliberately unsupported by this verifier')
          def parameters(r,depth=0):
              if depth>8:raise ValueError('Nested parameter depth exceeded')
              out=[]
              for _ in range(r.count()):
                  kind,t=r.u8(),r.u8();name,semantic=r.string(),r.string();r.annotations();rows,cols=r.u8(),r.u8()
                  elements=parameters(r,depth+1);members=parameters(r,depth+1)
                  if not elements and not members:
                      if t in (1,2,3):r.take(rows*cols*4)
                      elif t==4:raise ValueError('String parameter unsupported')
                  out.append(dict(name=name,kind=kind,type=t,rows=rows,columns=cols,elements=elements,members=members))
              return out

          def inputs(dx):
              if dx[:4]!=b'DXBC' or len(dx)<32:raise ValueError('Missing compiled DXBC')
              total,n=struct.unpack_from('<II',dx,24)
              if total!=len(dx) or n>64:raise ValueError('Invalid DXBC header')
              found=None
              for i in range(n):
                  off=struct.unpack_from('<I',dx,32+4*i)[0]
                  if off+8>len(dx):raise ValueError('Bad DXBC chunk offset')
                  kind=dx[off:off+4];size=struct.unpack_from('<I',dx,off+4)[0];data=dx[off+8:off+8+size]
                  if len(data)!=size:raise ValueError('Truncated DXBC chunk')
                  if kind==b'ISGN':
                      count=struct.unpack_from('<I',data)[0];found=[]
                      if count>32:raise ValueError('Signature too large')
                      for j in range(count):
                          p=8+24*j;nameoff,index,system,component,register=struct.unpack_from('<5I',data,p)
                          end=data.index(0,nameoff);name=data[nameoff:end].decode('ascii')
                          found.append(dict(name=name,index=index,component=component,mask=data[p+20]))
              if found is None:raise ValueError('No SM4 input signature')
              return found

          def inspect(data):
              r=Reader(data)
              if r.take(4)!=b'MGFX' or r.u8()!=10 or r.u8()!=1:raise ValueError('Expected MGFX v10 DirectX profile')
              r.take(4)
              for _ in range(r.count(32)):
                  r.string();r.u16()
                  for _ in range(r.count()):r.i32();r.u16()
              shaders=[]
              for _ in range(r.count(512)):
                  vertex=r.u8();blob=r.take(r.count(4*1024*1024));sig=inputs(blob) if vertex else []
                  if blob[:4]!=b'DXBC':raise ValueError('Shader not compiled for DirectX')
                  for _ in range(r.u8()):
                      r.take(3)
                      if r.u8():r.take(20)
                      r.string();r.u8()
                  r.take(r.u8())
                  for _ in range(r.u8()):r.string();r.take(4)
                  shaders.append(dict(vertex=bool(vertex),inputs=sig,length=len(blob)))
              params=parameters(r);techniques=[]
              for _ in range(r.count(64)):
                  name=r.string();r.annotations();passes=[]
                  for _ in range(r.count(64)):
                      pname=r.string();r.annotations();v,p=r.i32(),r.i32()
                      if not (0<=v<len(shaders) and 0<=p<len(shaders) and shaders[v]['vertex'] and not shaders[p]['vertex']):raise ValueError('Invalid shader binding')
                      if r.u8():r.take(18)
                      if r.u8():r.take(25)
                      if r.u8():r.take(12)
                      passes.append(pname)
                  techniques.append(dict(name=name,passes=passes))
              if r.take(4)!=b'MGFX' or r.p!=len(data):raise ValueError('Invalid MGFX footer/trailing bytes')
              return dict(parameters=params,techniques=techniques,shaders=shaders)

          def verify(data,contract):
              result=inspect(data);ps={p['name']:p for p in result['parameters']}
              if len(ps)!=len(result['parameters']):raise ValueError('Duplicate parameter names')
              for name,expected in contract['parameters'].items():
                  if name not in ps:raise ValueError('Required parameter optimized out/missing: '+name)
                  p=ps[name]
                  for key,want in expected.items():
                      got=len(p['elements']) if key=='elements' else p[key]
                      if got!=want:raise ValueError(f'Parameter {name} {key}: {got} != {want}')
              if result['techniques']!=contract['techniques']:raise ValueError('Technique/pass order does not match original CPU contract')
              for s in result['shaders']:
                  if s['vertex']:
                      sig={(v['name'],v['index']):v for v in s['inputs']}
                      if set(sig)!={('COLOR',0),('COLOR',1)}:raise ValueError('Packed terrain/entity input semantics changed')
                      if any(v['component']!=1 for v in sig.values()):raise ValueError('Byte4 requires unsigned-integer shader inputs, not floats')
              return result
          if __name__=='__main__':
              data=Path(sys.argv[1]).read_bytes();contract=json.loads(Path(sys.argv[2]).read_text());v=verify(data,contract)
              print(f"PASS: MGFX v10 DirectX; {len(contract['parameters'])} required typed parameters; {len(v['techniques'])} ordered techniques; all vertex inputs uint COLOR0/COLOR1.")
              print('This validates compiled metadata, not visual fidelity. Xbox performs an additional synthetic packed-vertex texture/pixel readback test.')
          ''')
      - name: Write Effects10/BlockEffect.fx
        shell: python
        run: |
          from pathlib import Path
          path = Path('xbox-cmz-services') / 'Effects10/BlockEffect.fx'
          path.parent.mkdir(parents=True, exist_ok=True)
          with path.open('w', encoding='utf-8', newline='') as output:
              output.write(r'''// Original experimental port shader, not a translation of Xbox GPU microcode.
          // Byte4 COLOR0/COLOR1 packing and CPU-facing interfaces were recovered from the user's game.
          // Simplified lighting, atlas filtering, ambient occlusion and water fog need visual comparison.
          float4x4 World;
          float4x4 View;
          float4x4 Projection;
          float4x4 InverseWorld;
          float4x4 FaceMatrices[6];
          float3 WorldBase;
          float3 SunLight;
          float3 TorchLight;
          float3 FogColor;
          float3 AmbientSun;
          float3 SunSpecular;
          float3 LightDirection;
          float3 EyePosition;
          float WaterLevel;
          float3 EyeWaterConstants;
          float3 BelowWaterColor;
          int WaterDepth;
          float4 VertexUVs[4];
          float3 CubeScaleSunTorch;
          int CubeTx[6];
          texture2D DiffuseAlphaTexture;
          texture2D NormalSpecTexture;
          texture2D MetalLightTexture;
          texture3D EnvMapTexture;
          texture2D MipMapSpecularTexture;
          texture2D MipMapDiffuseTexture;
          sampler2D DiffuseAlphaSampler=sampler_state { Texture=<DiffuseAlphaTexture>; MinFilter=Linear; MagFilter=Linear; MipFilter=Point; AddressU=Clamp; AddressV=Clamp; };
          sampler2D NormalSpecSampler=sampler_state { Texture=<NormalSpecTexture>; MinFilter=Linear; MagFilter=Linear; MipFilter=Point; AddressU=Clamp; AddressV=Clamp; };
          sampler2D MetalLightSampler=sampler_state { Texture=<MetalLightTexture>; MinFilter=Linear; MagFilter=Linear; MipFilter=Point; AddressU=Clamp; AddressV=Clamp; };
          sampler3D EnvSampler=sampler_state { Texture=<EnvMapTexture>; MinFilter=Linear; MagFilter=Linear; MipFilter=Linear; AddressU=Clamp; AddressV=Clamp; AddressW=Clamp; };
          sampler2D MipMapSpecularSampler=sampler_state { Texture=<MipMapSpecularTexture>; MinFilter=Linear; MagFilter=Linear; MipFilter=Linear; AddressU=Clamp; AddressV=Clamp; };
          sampler2D MipMapDiffuseSampler=sampler_state { Texture=<MipMapDiffuseTexture>; MinFilter=Linear; MagFilter=Linear; MipFilter=Linear; AddressU=Clamp; AddressV=Clamp; };
          struct VIn { uint4 locationTile:COLOR0; uint4 aoSunLampFace:COLOR1; };
          struct VOut {
              float4 position:SV_Position;
              float4 uv:TEXCOORD0;
              float3 worldPosition:TEXCOORD1;
              float3 normal:TEXCOORD2;
              float3 tangent:TEXCOORD3;
              float3 bitangent:TEXCOORD4;
              float3 light:TEXCOORD5;
          };
          float3 SafeNormal(float3 v) { return v*rsqrt(max(dot(v,v),0.000001)); }
          VOut MakeVertex(VIn v, bool entity) {
              VOut o=(VOut)0;
              uint face=entity ? min(v.locationTile.w,5u) : min(v.aoSunLampFace.w & 7u,5u);
              uint corner=entity ? (v.aoSunLampFace.x & 3u) : ((v.aoSunLampFace.w >> 4u)&3u);
              uint tile=entity ? (uint)max(CubeTx[face],0) : v.locationTile.w;
              // Material sheets contain an eight-by-eight tile grid. Do not assume float vertex inputs.
              float2 tileBase=float2(tile&7u, tile>>3u)*0.125;
              o.uv.xy=tileBase+VertexUVs[corner].xy;
              // CPU supplies an inset for the lower-resolution material sheets in zw.
              o.uv.zw=tileBase+VertexUVs[corner].zw*2.0;
              float3 local=(float3)v.locationTile.xyz;
              if(entity) local=(local-0.5)*CubeScaleSunTorch.x;
              else local+=WorldBase;
              float4 world=mul(float4(local,1),World);
              o.worldPosition=world.xyz;
              o.position=mul(mul(world,View),Projection);
              float3 n=mul(float4(0,0,1,0),FaceMatrices[face]).xyz;
              float3 t=mul(float4(1,0,0,0),FaceMatrices[face]).xyz;
              float3 b=mul(float4(0,-1,0,0),FaceMatrices[face]).xyz;
              if(entity) {
                  // Row-vector inverse-transpose normal transform; world transform for tangents.
                  n=mul((float3x3)InverseWorld,n);
                  t=mul(float4(t,0),World).xyz;
                  b=mul(float4(b,0),World).xyz;
              } else {
                  n=mul(float4(n,0),World).xyz;
                  t=mul(float4(t,0),World).xyz;
                  b=mul(float4(b,0),World).xyz;
              }
              o.normal=SafeNormal(n);o.tangent=SafeNormal(t);o.bitangent=SafeNormal(b);
              float sun=entity ? CubeScaleSunTorch.y/255.0 : (float)v.aoSunLampFace.y/255.0;
              float lamp=entity ? CubeScaleSunTorch.z/255.0 : (float)v.aoSunLampFace.z/255.0;
              bool bright=!entity && ((v.aoSunLampFace.w&128u)!=0u);
              // The original eight-neighbour AO mask is retained; this is an approximate corner weighting.
              uint mask=v.aoSunLampFace.x;
              uint3 bitIndices=corner==0u ? uint3(0,1,3) : corner==1u ? uint3(1,2,4) : corner==2u ? uint3(3,5,6) : uint3(4,6,7);
              float occupied=(float)(((mask>>bitIndices.x)&1u)+((mask>>bitIndices.y)&1u)+((mask>>bitIndices.z)&1u));
              float ao=entity || bright ? 1.0 : 1.0-occupied*0.14;
              o.light=float3(bright?1.0:saturate(sun),saturate(lamp),ao);
              return o;
          }
          VOut TerrainVS(VIn v) { return MakeVertex(v,false); }
          VOut EntityVS(VIn v) { return MakeVertex(v,true); }
          float4 MaterialPS(VOut v, bool metallic, int waterMode, bool ui, bool reflection):SV_Target {
              if(reflection) clip(v.worldPosition.y-WaterLevel);
              float distanceToEye=length(v.worldPosition-EyePosition);
              float mipBlend=saturate((distanceToEye-24.0)/64.0);
              float4 diffuse=lerp(tex2D(DiffuseAlphaSampler,v.uv.xy),tex2D(MipMapDiffuseSampler,v.uv.zw),mipBlend);
              clip(diffuse.a-0.05);
              float4 normalSpec=lerp(tex2D(NormalSpecSampler,v.uv.xy),tex2D(MipMapSpecularSampler,v.uv.zw),mipBlend);
              float3 tangentNormal=normalSpec.xyz*2.0-1.0;
              float3 normal=SafeNormal(tangentNormal.x*v.tangent+tangentNormal.y*v.bitangent+tangentNormal.z*v.normal);
              float4 material=tex2D(MetalLightSampler,v.uv.xy);
              float3 toSun=SafeNormal(LightDirection);
              float diffuseSun=saturate(dot(normal,toSun));
              float3 light=(AmbientSun+SunLight*diffuseSun)*v.light.x+TorchLight*v.light.y;
              float3 color=diffuse.rgb*max(light,0.025)*v.light.z;
              float3 toEye=SafeNormal(EyePosition-v.worldPosition);
              float3 halfway=SafeNormal(toEye+toSun);
              float spec=pow(saturate(dot(normal,halfway)),16.0+normalSpec.a*80.0)*normalSpec.a;
              color+=SunSpecular*spec*v.light.x;
              if(metallic) {
                  float3 direction=reflect(-toEye,normal);
                  float2 envUV=float2(atan2(direction.z,direction.x)*0.159154943+0.5,acos(clamp(direction.y,-1.0,1.0))*0.318309886);
                  // Original four-layer environment input remains a 3D texture; this is a simplified lookup.
                  float3 environment=tex3D(EnvSampler,float3(envUV,saturate(v.light.x))).rgb;
                  color=lerp(color,environment*max(SunLight+AmbientSun,0.1),saturate(material.r)*0.6);
              }
              // Material-map emission channel interpretation is provisional and explicitly logged by the host.
              color+=diffuse.rgb*material.b;
              if(!ui) {
                  float fog=saturate((distanceToEye-128.0)/96.0);
                  color=lerp(color,FogColor,fog);
                  if(waterMode!=0) {
                      float objectDepth=max(WaterLevel-v.worldPosition.y,0.0);
                      float eyeDepth=max(EyeWaterConstants.x,0.0);
                      float crossing=saturate(objectDepth/max(objectDepth+abs(EyeWaterConstants.z),0.001));
                      float waterDistance=waterMode==2 ? distanceToEye : distanceToEye*crossing;
                      float depthLimit=max((float)WaterDepth,1.0);
                      float density=(objectDepth+eyeDepth+waterDistance*min(max(EyeWaterConstants.y,1.0),4.0))/depthLimit;
                      color=lerp(color,BelowWaterColor,saturate(1.0-exp(-density)));
                  }
              }
              return float4(saturate(color),diffuse.a);
          }

          float4 BlockAboveWaterTechnique_SpecularMaterials(VOut v):SV_Target { return MaterialPS(v,false,1,false,false); }
          float4 BlockAboveWaterTechnique_MetalMaterials(VOut v):SV_Target { return MaterialPS(v,true,1,false,false); }
          float4 BlockAboveWaterTechnique_Reflections(VOut v):SV_Target { return MaterialPS(v,false,1,false,true); }
          technique BlockAboveWaterTechnique
          {
              pass SpecularMaterials { VertexShader=compile vs_4_0 TerrainVS(); PixelShader=compile ps_4_0 BlockAboveWaterTechnique_SpecularMaterials(); }
              pass MetalMaterials { VertexShader=compile vs_4_0 TerrainVS(); PixelShader=compile ps_4_0 BlockAboveWaterTechnique_MetalMaterials(); }
              pass Reflections { VertexShader=compile vs_4_0 TerrainVS(); PixelShader=compile ps_4_0 BlockAboveWaterTechnique_Reflections(); }
          }
          float4 BlockBelowWaterTechnique_SpecularMaterials(VOut v):SV_Target { return MaterialPS(v,false,2,false,false); }
          float4 BlockBelowWaterTechnique_MetalMaterials(VOut v):SV_Target { return MaterialPS(v,true,2,false,false); }
          technique BlockBelowWaterTechnique
          {
              pass SpecularMaterials { VertexShader=compile vs_4_0 TerrainVS(); PixelShader=compile ps_4_0 BlockBelowWaterTechnique_SpecularMaterials(); }
              pass MetalMaterials { VertexShader=compile vs_4_0 TerrainVS(); PixelShader=compile ps_4_0 BlockBelowWaterTechnique_MetalMaterials(); }
          }
          float4 BlockNoWaterTechnique_SpecularMaterials(VOut v):SV_Target { return MaterialPS(v,false,0,false,false); }
          float4 BlockNoWaterTechnique_MetalMaterials(VOut v):SV_Target { return MaterialPS(v,true,0,false,false); }
          technique BlockNoWaterTechnique
          {
