          // This is resident PCM playback through MonoGame, NOT an Xbox WMA streaming decoder.
          using System;
          using System.IO;
          using System.IO.Compression;
          using System.Security.Cryptography;
          namespace NexiaCMZLoader {
              public static class ResidentMusic {
                  private const string ZipHash="d80382ae5bcc419e13c6c34deb0cf4e4f5b1efb32c170bdf0abc49de5c88bdf9";
                  private const string BankHash="7ebaa8133cd553fc0feaf074e6433bbc7e1ce6d1966fcf9622675fe44e251139";
                  private const long ZipLength=106705787, BankLength=117391772;
                  private static string bankPath;
                  private static string Hash(Stream input) {
                      using(var h=SHA256.Create()) return BitConverter.ToString(h.ComputeHash(input)).Replace("-","").ToLowerInvariant();
                  }
                  private static bool VerifiedBank(string path) {
                      if(!File.Exists(path) || new FileInfo(path).Length!=BankLength) return false;
                      using(var input=File.OpenRead(path)) return Hash(input)==BankHash;
                  }
                  public static void Import(string localFolder) {
                      bankPath=null;
                      string directory=Path.Combine(localFolder,"ResidentMusic09");
                      Directory.CreateDirectory(directory);
                      string destination=Path.Combine(directory,"SoundsStreaming.pcm.xwb");
                      if(!VerifiedBank(destination)) {
                          string zip=Path.Combine(localFolder,"CastleMinerZ-music-pcm.zip");
                          if(!File.Exists(zip)) throw new FileNotFoundException(
                              "Upload CastleMinerZ-music-pcm.zip beside the two existing ZIPs in this app's LocalState; keep it zipped.",zip);
                          if(new FileInfo(zip).Length!=ZipLength) throw new InvalidDataException("Wrong PCM music ZIP size.");
                          using(var input=File.OpenRead(zip)) {
                              if(Hash(input)!=ZipHash) throw new InvalidDataException("PCM music ZIP hash mismatch.");
                              input.Position=0;
                              using(var archive=new ZipArchive(input,ZipArchiveMode.Read)) {
                                  if(archive.Entries.Count!=1 || archive.Entries[0].FullName!="SoundsStreaming.pcm.xwb" ||
                                      archive.Entries[0].Length!=BankLength) throw new InvalidDataException("Unexpected PCM music ZIP inventory.");
                                  string temp=destination+".incoming";
                                  try {
                                      using(var source=archive.Entries[0].Open())
                                      using(var output=File.Create(temp)) {
                                          byte[] buffer=new byte[65536];long total=0;int n;
                                          while((n=source.Read(buffer,0,buffer.Length))>0) {
                                              total+=n;if(total>BankLength) throw new InvalidDataException("PCM music bank too large.");
                                              output.Write(buffer,0,n);
                                          }
                                          if(total!=BankLength) throw new EndOfStreamException("Incomplete PCM music bank.");
                                      }
                                      if(!VerifiedBank(temp)) throw new InvalidDataException("Extracted PCM music bank hash mismatch.");
                                      using(var test=File.OpenRead(temp)) ResidentMusicBank.Validate(test,11,"SoundsStreaming");
                                      if(File.Exists(destination)) File.Delete(destination);
                                      File.Move(temp,destination);
                                  } finally { if(File.Exists(temp)) File.Delete(temp); }
                              }
                          }
                      }
                      using(var input=File.OpenRead(destination)) ResidentMusicBank.Validate(input,11,"SoundsStreaming");
                      bankPath=destination;
                      StartupHooks.Note("MUSIC INPUT: verified 11 decoded PCM tracks; about 112 MiB resident audio. Native compressed streaming is not used.");
                  }
                  public static Stream OpenBank() {
                      if(bankPath==null) throw new InvalidOperationException("Verified PCM music bank has not been imported.");
                      StartupHooks.Once("MUSIC ROUTE: original SoundsStreaming cue indices use decoded resident PCM bank. Playback must be confirmed by listening.");
                      return File.OpenRead(bankPath);
                  }
              }
          }
          ''')
