      - name: Write ModelTests12/GraphicsFixtures.cs
        shell: python
        run: |
          from pathlib import Path
          path=Path('xbox-cmz-services') / 'ModelTests12/GraphicsFixtures.cs'
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(r'''// Recording-only fixtures for the model guard. Not MonoGame, not an Xbox/GPU implementation.
          using System.Collections.Generic;
          namespace Microsoft.Xna.Framework.Graphics {
              public class ModelBone { }
              public class BasicEffect { }
              public class VertexBuffer { public int VertexCount {get;set;} }
              public class IndexBuffer { public int IndexCount {get;set;} }
              public class ModelMeshPart {
                  public int VertexOffset {get;set;} public int NumVertices {get;set;}
                  public int StartIndex {get;set;} public int PrimitiveCount {get;set;}
                  public VertexBuffer VertexBuffer {get;set;} public IndexBuffer IndexBuffer {get;set;} public object Effect {get;set;}
              }
              public class ModelMesh { public ModelBone ParentBone {get;set;} public List<ModelMeshPart> MeshParts {get;}=new List<ModelMeshPart>(); }
              public class Model { public ModelBone Root {get;set;} public List<ModelBone> Bones {get;}=new List<ModelBone>(); public List<ModelMesh> Meshes {get;}=new List<ModelMesh>(); }
          }
          namespace NexiaCMZLoader { public static class StartupHooks { public static readonly List<string> Messages=new List<string>(); public static void Note(string s){Messages.Add(s);} public static void Once(string s){if(!Messages.Contains(s))Messages.Add(s);} } }
          ''',encoding='utf-8')
      - name: Write ModelTests12/Program.cs
        shell: python
        run: |
          from pathlib import Path
          path=Path('xbox-cmz-services') / 'ModelTests12/Program.cs'
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(r'''// Actual new importer/model guard compiled with synthetic ZIPs and graphics-free model fixtures.
          // No game data, actual MonoGame assembly, audio driver or GPU is used in these unit tests.
          using System;
          using System.IO;
          using System.IO.Compression;
          using System.Linq;
          using System.Text;
          using System.Collections.Generic;
          using Microsoft.Xna.Framework.Graphics;
          using NexiaCMZLoader;
          class Program {
              static int count;
              static string root=Path.Combine(Path.GetTempPath(),"cmz-model-tests12-"+Guid.NewGuid().ToString("N"));
              static void Need(bool ok,string reason){if(!ok)throw new Exception(reason);}
              static void Test(string name,Action action){action();count++;Console.WriteLine("PASS "+name);}
              static void Reject<T>(Action action) where T:Exception {try{action();}catch(T){return;}throw new Exception("Expected "+typeof(T).Name);}
              static string Hash(byte[] b){using(var s=new MemoryStream(b))return ModelArchive12.Hash(s);}
              static byte[] B(string s){return Encoding.UTF8.GetBytes(s);}
              static byte[] Zip(params KeyValuePair<string,byte[]>[] entries) {
                  using(var memory=new MemoryStream()) {
                      using(var z=new ZipArchive(memory,ZipArchiveMode.Create,true))foreach(var e in entries)using(var s=z.CreateEntry(e.Key).Open())s.Write(e.Value,0,e.Value.Length);
                      return memory.ToArray();
                  }
              }
              static KeyValuePair<string,byte[]> Entry(string name,string data){return new KeyValuePair<string,byte[]>(name,B(data));}
              static ModelFileSpec12 Spec(string name,string data){var b=B(data);return new ModelFileSpec12(name,b.Length,Hash(b),1,1,1,3,1);}
              static Dictionary<string,string> Import(byte[] zip,ModelFileSpec12[] specs,string suffix="out",long? length=null,string hash=null) {
                  string input=Path.Combine(root,"input-"+Guid.NewGuid().ToString("N")+".zip");File.WriteAllBytes(input,zip);
                  return ModelArchive12.Import(input,Path.Combine(root,suffix),length??zip.Length,hash??Hash(zip),specs);
              }
              static Model GoodModel() {
                  var m=new Model();m.Root=new ModelBone();m.Bones.Add(m.Root);var mesh=new ModelMesh{ParentBone=m.Root};m.Meshes.Add(mesh);
                  mesh.MeshParts.Add(new ModelMeshPart{NumVertices=3,PrimitiveCount=1,VertexBuffer=new VertexBuffer{VertexCount=3},IndexBuffer=new IndexBuffer{IndexCount=3},Effect=new BasicEffect()});return m;
              }
              static int Main() {
                  Directory.CreateDirectory(root);
                  try {
                      var specs=new[]{Spec("First.xnb","first fixture"),Spec("Nested/Second.xnb","second fixture")};
                      var zip=Zip(Entry("First.xnb","first fixture"),Entry("Nested/Second.xnb","second fixture"));
                      Test("exact two-entry import and nested paths",()=>{
                          var map=Import(zip,specs,"valid");Need(map.Count==2,"wrong inventory");Need(File.ReadAllText(map["First"])=="first fixture","wrong first bytes");
                          Need(File.ReadAllText(map["Nested/Second"])=="second fixture","wrong nested bytes");
                      });
                      Test("case-insensitive asset lookup without accepting duplicate entries",()=>{var map=Import(zip,specs,"valid");Need(map["first"]==map["First"],"lookup case");});
                      Test("cached valid files preserved",()=>{var map=Import(zip,specs,"valid");string p=map["First"];var when=File.GetLastWriteTimeUtc(p);Import(zip,specs,"valid");Need(File.GetLastWriteTimeUtc(p)==when,"rewrote valid cache");});
                      Test("corrupt cached copy repaired from the pinned archive",()=>{var map=Import(zip,specs,"repair");File.WriteAllText(map["First"],"bad");map=Import(zip,specs,"repair");Need(File.ReadAllText(map["First"])=="first fixture","cache repair");});
                      Test("wrong archive length rejected",()=>Reject<InvalidDataException>(()=>Import(zip,specs,"badlength",zip.Length+1)));
                      Test("wrong archive hash rejected",()=>Reject<InvalidDataException>(()=>Import(zip,specs,"badhash",null,new string('0',64))));
                      Test("unexpected entry count rejected",()=>Reject<InvalidDataException>(()=>Import(Zip(Entry("First.xnb","first fixture")),specs,"count")));
                      Test("unexpected filename rejected",()=>Reject<InvalidDataException>(()=>Import(Zip(Entry("First.xnb","first fixture"),Entry("Other.xnb","second fixture")),specs,"name")));
                      Test("duplicate entry rejected",()=>Reject<InvalidDataException>(()=>Import(Zip(Entry("First.xnb","first fixture"),Entry("First.xnb","second fixture")),specs,"duplicate")));
                      Test("case-alias entry rejected",()=>Reject<InvalidDataException>(()=>Import(Zip(Entry("First.xnb","first fixture"),Entry("first.xnb","second fixture")),specs,"alias")));
                      foreach(string bad in new[]{"../escape.xnb","/absolute.xnb","C:/drive.xnb","Nested\\Second.xnb","Nested//Second.xnb","Nested/./Second.xnb"}) {
                          string capture=bad;
                          Test("unsafe ZIP path rejected: "+capture,()=>Reject<InvalidDataException>(()=>Import(Zip(Entry("First.xnb","first fixture"),Entry(capture,"second fixture")),specs,"unsafe")));
                      }
                      Test("per-entry size enforced",()=>Reject<InvalidDataException>(()=>Import(Zip(Entry("First.xnb","x"),Entry("Nested/Second.xnb","second fixture")),specs,"entrysize")));
                      Test("entry hash mismatch preserves previous copy and removes temporary file",()=>{
                          var map=Import(zip,specs,"transaction");File.WriteAllText(map["First"],"old-original-marker");
                          var wrong=new[]{new ModelFileSpec12("First.xnb",13,new string('0',64),1,1,1,3,1),specs[1]};
                          Reject<InvalidDataException>(()=>Import(zip,wrong,"transaction"));
                          Need(File.ReadAllText(map["First"])=="old-original-marker","damaged previous copy");Need(!File.Exists(map["First"]+".new"),"left temporary");
                      });
                      Test("manifest duplicate rejected",()=>Reject<InvalidDataException>(()=>Import(zip,new[]{specs[0],specs[0]},"dupspec")));
                      Test("manifest oversized entry rejected",()=>Reject<InvalidDataException>(()=>Import(zip,new[]{new ModelFileSpec12("First.xnb",9*1024*1024,Hash(B("a")),1,1,1,3,1)},"oversized")));
                      Test("manifest traversal rejected before file access",()=>Reject<InvalidDataException>(()=>Import(zip,new[]{Spec("../Other.xnb","fixture")},"traversal")));
                      Test("archive source and unrelated file unchanged",()=>{
                          string input=Path.Combine(root,"persistent.zip"),sentinel=Path.Combine(root,"outside.txt");File.WriteAllBytes(input,zip);File.WriteAllText(sentinel,"keep");
                          ModelArchive12.Import(input,Path.Combine(root,"isolated"),zip.Length,Hash(zip),specs);Need(Hash(File.ReadAllBytes(input))==Hash(zip),"source modified");Need(File.ReadAllText(sentinel)=="keep","outside modified");
                      });
                      Test("missing archive reports filename",()=>Reject<FileNotFoundException>(()=>ModelArchive12.Import(Path.Combine(root,"missing.zip"),Path.Combine(root,"missing"),zip.Length,Hash(zip),specs)));
                      var modelSpec=Spec("Fixture.xnb","fixture");
                      Test("loaded model guard accepts exact synthetic graph",()=>ModelContent12.ValidateLoaded(GoodModel(),modelSpec));
                      Test("loaded model bone-count mismatch rejected",()=>{var m=GoodModel();m.Bones.Add(new ModelBone());Reject<InvalidDataException>(()=>ModelContent12.ValidateLoaded(m,modelSpec));});
                      Test("loaded model missing effect rejected",()=>{var m=GoodModel();m.Meshes[0].MeshParts[0].Effect=null;Reject<InvalidDataException>(()=>ModelContent12.ValidateLoaded(m,modelSpec));});
                      Test("loaded model out-of-range index window rejected",()=>{var m=GoodModel();m.Meshes[0].MeshParts[0].StartIndex=1;Reject<InvalidDataException>(()=>ModelContent12.ValidateLoaded(m,modelSpec));});
                      Test("loaded model out-of-range vertex window rejected",()=>{var m=GoodModel();m.Meshes[0].MeshParts[0].VertexOffset=1;Reject<InvalidDataException>(()=>ModelContent12.ValidateLoaded(m,modelSpec));});
                      Test("manifest selects PickAxe only, not arbitrary custom models",()=>{ModelFileSpec12 s;Need(ModelContent12.TrySpec("pickaxe",out s)&&s.Path=="PickAxe.xnb","pickaxe route");Need(!ModelContent12.TrySpec("Enemies/Dragon/DragonBodyHigh",out s),"unverified model selected");Need(!ModelContent12.TrySpec("../PickAxe",out s),"unsafe asset selected");});
                      Console.WriteLine("MODEL12 TESTS COMPLETE: "+count+" PASS. Synthetic importer/graph tests only; NOT actual ModelReader or GPU execution.");return 0;
                  } catch(Exception e){Console.Error.WriteLine(e);return 1;} finally {Directory.Delete(root,true);}
              }
          }
          ''',encoding='utf-8')
      - name: Write README.txt
        shell: python
        run: |
          from pathlib import Path
          path=Path('xbox-cmz-services') / 'README.txt'
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(r'''CMZ ORIGINAL STARTUP 0.12 - STANDARD ORIGINAL MODEL CONTENT
          Experimental port update; not a verified playable or split-screen build.

          BASELINE: USER'S 0.11.6 XBOX RUN
          The user reports no app exit and continued audible music. The supplied log records the
          terrain GPU test inside original Draw and water effect contract completing. The next
          recorded stop is SecondaryLoad -> InventoryItem.Initalize -> Load<Model>("PickAxe"):
          "This original asset still needs format conversion: PickAxe". It is not a missing ZIP.
          The absence of the earlier Present exception is evidence for this run, not a universal
          stability or full-world-rendering guarantee.

          0.12 SCOPE
          26 ORIGINAL standard BasicEffect model assets were converted from the user's previously
          supplied startup-content ZIP. No substitute pickaxe/weapon geometry is generated.
          The converter parses bones, transforms, hierarchy, meshes, parts, shared vertex/index
          buffers and BasicEffect data; validates local triangle indices and all byte ranges;
          and converts only the identified vertex float words and index words from Xbox big-endian
          to little-endian. XNB structural metadata stays intact, and compression is removed.
          Every converted payload was parsed again and its metadata and decoded geometry compared
          to the source. Reversing the GPU-word conversion restores the entire original payload.
          All 32 external Texture2D references resolve to already converted files in the original
          startup-content ZIP. No texture/font/audio ZIP needs replacement.

          The new app imports the separate, hash-pinned CastleMinerZ-models-basic.zip to ModelContent12.
          Its exact 26 entries, sizes, hashes and cache contents are verified. Inputs and other app
          folders are untouched. Only those asset names are redirected; unknown formats remain guarded.
          The ordinary MonoGame ModelReader constructs the real Model, preserving shared-resource
          fixups, BasicEffect assignments, original names/transforms, and ContentManager ownership.
          New model loading (including nested textures and GPU buffer creation) is scheduled inside
          the original Draw callback using the unchanged 0.11 FrameGpuWork queue. A loaded-graph guard
          checks bone/mesh/part/vertex/triangle counts and buffer bounds, then logs MODEL READY.
          A ready-model line proves construction/count checks, NOT drawing, animation or gameplay.

          The first actual error summary is now pinned above the recent on-screen log entries.
          The full exception and call stack remain in the existing startup log. This does not hide
          exceptions or resume a failed startup. The music, frame queue, shaders and license policy
          from 0.11 are retained unchanged; only the model route and small diagnostic presentation change.

          MODELS INCLUDED
          AK, Ammo, Axe, Bars, Block, BoltRifle, Clock, Colt, Compass, FireBall, Gems, Knife,
          Locator, M11, MuzzleFlash, Ore, PickAxe, PumpShotgun, Shadow, Snowball, Spade, Sphere,
          Teleporter, Torch, WoodDoor, marker.

          LIMITATIONS
          CrackBox and Selector use custom effects; eight skinned enemy models use custom animation
          data. Those TEN other original ModelReader assets are NOT converted by this update and
          remain guarded. Avatars, other effects, model/world visual fidelity, physical local-player
          integration and shared-world couch co-op are still separate work. Existing terrain/water
          shaders remain approximate. Trial-only development policy and original game trial checks
          are unchanged. No full-version entitlement or online-services support is asserted.

          VALIDATION
          Performed privately before publication: 26 asset conversions/semantic+byte roundtrips;
          32 existing texture dependencies; 15 synthetic offline parser/converter tests; deterministic
          archive reproduction; workflow source generation, project XML and required public model
          properties in the installed 3.8.1.303 MonoGame UWP assembly.
          New C# tests compile the SAME importer and model guard with synthetic ZIPs and recording-only
          graphics fixtures. They test hashes, exact inventory, malformed paths/duplicates, cache repair,
          failed-write cleanup and model-graph range checks. They use NO actual game content, ModelReader
          or GPU. Existing XACT, SpriteBatch/music, frame scheduling and shader checks rerun in CI.
          The new C# tests, UWP compilation, package and Xbox execution HAVE NOT RUN at preparation time.
          No local Python result should be represented as Xbox ModelReader/graphics validation.

          USER ACTION NOW
          Replace CONTENTS ONLY in .github/workflows/xbox-cmz-startup.yml on Mousehook with the complete
          supplied workflow text. Leave the filename and all previous workflows unchanged. Install
          nothing until the cloud build passes and its actual package/dependencies have been inspected.
          The workflow contains host code, tests, hashes and attribution; NO original game/model assets.

          INSTALLATION AFTER A CHECKED SUCCESSFUL BUILD
          Update the existing NexiaCMZLoader package (same Name/Publisher; 0.12.<run>.0) WITHOUT uninstalling.
          Keep Game mode. Leave all existing folders and these four input ZIPs in LocalState unchanged:
            CastleMinerZ-assemblies.zip
            CastleMinerZ-startup-content.zip
            CastleMinerZ-music-pcm.zip
            CastleMinerZ-terrain-textures.zip
          Add CastleMinerZ-models-basic.zip INTACT alongside them. It is 234840 bytes (about 235 KB),
          not an installer dependency and not a GitHub upload. The app creates its own ModelContent12 folder.
          After launch, report the screen/music and return cmz-startup-log.txt and cmz-loader-log.txt.
          Copy logs before relaunch; startup resets them. No second controller is needed for this stage.
          ''',encoding='utf-8')
