      - name: Write FrameWorkTests11/Program.cs (1/1)
        shell: python
        run: |
          from pathlib import Path
          path = Path('xbox-cmz-services') / 'FrameWorkTests11/Program.cs'
          path.parent.mkdir(parents=True, exist_ok=True)
          with path.open('w', encoding='utf-8', newline='') as output:
              output.write(r'''// Pure scheduling regression tests. These exercise the SAME queue code as the UWP build.
          // Fake render targets/Present below are not a GPU, Xbox runtime, or visual-fidelity test.
          using System;
          using System.Threading;
          using System.Threading.Tasks;
          using NexiaCMZLoader;
          static class Tests {
              static int passes;
              static void Check(bool yes,string name) { if(!yes)throw new Exception("FAIL: "+name);passes++;Console.WriteLine("PASS: "+name); }
              static void WaitForQueue() { if(!SpinWait.SpinUntil(()=>FrameGpuWork.PendingCount>0,5000))throw new Exception("Queue did not fill"); }
              static T RunDraw<T>(Task<T> worker) {
                  WaitForQueue();
                  try { FrameGpuWork.EnterDraw(); }
                  finally { FrameGpuWork.ExitDraw(); }
                  if(!worker.Wait(5000))throw new Exception("Worker did not complete");return worker.GetAwaiter().GetResult();
              }
              public static void Main() {
                  int thread=Thread.CurrentThread.ManagedThreadId; bool target=false;
                  var success=Task.Run(()=>FrameGpuWork.Invoke("test render",()=>{
                      FrameGpuWork.AssertInsideDraw();target=true;
                      try { Check(Thread.CurrentThread.ManagedThreadId==thread,"callback owned by Draw caller, not submitting worker");return 42; }
                      finally { target=false; }
                  }));
                  Check(RunDraw(success)==42,"return value propagated");
                  Check(!target && !FrameGpuWork.IsInsideDraw,"target restored and frame ownership released before simulated Present");
                  int nested=0;
                  var nesting=Task.Run(()=>FrameGpuWork.Invoke("outer",()=>FrameGpuWork.Invoke("inner",()=>++nested)));
                  Check(RunDraw(nesting)==1,"nested request on Draw runs synchronously without deadlock");
                  var error=Task.Run(()=>{
                      try { FrameGpuWork.Invoke<int>("throw",()=>{target=true;try{throw new InvalidOperationException("test");}finally{target=false;}});return false; }
                      catch(InvalidOperationException e) {return e.Message=="test";}
                  });
                  Check(RunDraw(error),"callback exception reaches requesting thread");
                  Check(!target && !FrameGpuWork.IsInsideDraw,"exception path restores fake target before simulated Present");
                  int ran=0;
                  var timed=Task.Run(()=>{
                      try{FrameGpuWork.Invoke("timeout",()=>++ran,null,100);return false;}
                      catch(TimeoutException){return true;}
                  });
                  Check(timed.Wait(5000)&&timed.Result,"queued request times out without hanging");
                  try {FrameGpuWork.EnterDraw();} finally {FrameGpuWork.ExitDraw();}
                  Check(ran==0,"cancelled queued callback never executes later");
                  // Verify cleanup after timeout of an already-running callback occurs on its Draw owner.
                  var started=new ManualResetEventSlim();var release=new ManualResetEventSlim();int disposedOn=0,renderId=0;
                  var running=Task.Run(()=>{
                      try{FrameGpuWork.Invoke("running timeout",()=>{started.Set();if(!release.Wait(15000))throw new Exception("release timeout");return new object();},_=>disposedOn=Thread.CurrentThread.ManagedThreadId,3000);return false;}
                      catch(TimeoutException){return true;}
                  });
                  WaitForQueue();
                  var render=Task.Run(()=>{renderId=Thread.CurrentThread.ManagedThreadId;try{FrameGpuWork.EnterDraw();}finally{FrameGpuWork.ExitDraw();}});
                  Check(started.Wait(5000),"running-timeout fixture entered callback");
                  Check(running.Wait(5000)&&running.Result,"running timeout returns to caller");
                  release.Set();Check(render.Wait(5000)&&disposedOn==renderId,"abandoned result cleaned up on Draw owner");
                  try {FrameGpuWork.EnterDraw();throw new InvalidOperationException("draw failure");}
                  catch(InvalidOperationException) {FrameGpuWork.ExitDraw();}
                  Check(!FrameGpuWork.IsInsideDraw,"draw-failure path releases frame scope");
                  var stopped=Task.Run(()=>{
                      try{FrameGpuWork.Invoke("abort",()=>1);return false;}
                      catch(InvalidOperationException){return true;}
                  });
                  WaitForQueue();FrameGpuWork.Abort(new InvalidOperationException("stop"));
                  Check(stopped.Wait(5000)&&stopped.Result,"startup failure releases queued waiter");
                  Check(FrameGpuWork.PendingCount==0,"stopped queue has no outstanding requests");
                  Console.WriteLine("Finished: "+passes+" PASS; synthetic scheduling only, not Xbox execution.");
              }
          }
          ''')
