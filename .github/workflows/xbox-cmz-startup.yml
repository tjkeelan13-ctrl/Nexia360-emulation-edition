          _*mPbM%k2+WOhMt-l`orX)aqE!kV@MWI5^@g2&?y=2.lP#;c@}&BYYE|F=os1JqazGV)c{Yf0aAlcxYEEUw!kun*N1X03dBgFl0dY(m?0o#r(zl>>nD8OsZ+n-V6dNp}5XOtvUGz;ru.i(6qJ=yxNq{eZPbgRN?h(T@-6xdjj1X_dv+kjpm%P12nY3w{<sX58~+jqj%qN.`hVIV(}><Q0~+R%u9q-kM*BOa<X2L9k2f&(@PCs1A%4q%{PRtTs}wMJD8.qaR4oTfiY&ruK|sM1|9hx_!ll)E-*=+%Di>mP>z4v7{L_dmtP_H-L}LWG*2#?Jqo{LkLY<^.t&9BYV|0uO1<aT!kNJ#6OpM>.M7`C5Z7hQO1-Bha;V6__MmQ>ebEn`VwcXsOe%W!6Ex&G1S1}^9W5#0*AJG;s;YWxAcCnU1t.CH~H)2W1u7C7fUtGOW*Jfy@bvUJ6AZyI)hr_t6U5`2BlA7ZN<=wBJ|MEcl9J0kOamPam~ld!hK%v5`+*agSo%lr-f{RO<L6~H8^|_j&sc1RrtKkSYBJ=Xs@Pv`~Uy|h}M|JudIrS00Fk?75S%eZ3UDuvBYQl0ssI200dcD"""
          packed = base64.b85decode("".join(encoded.split()).replace(".", "$"))
          if hashlib.sha256(packed).hexdigest() != "caed7c9e375d9658bc4dfe52bc4cc064041a4db055c4428311911d370a6e2957":
              raise RuntimeError("CMZ 1.6.3 compressed source digest mismatch")
          raw = lzma.decompress(packed, format=lzma.FORMAT_XZ, memlimit=64*1024*1024)
          if len(raw) != 1856505 or hashlib.sha256(raw).hexdigest() != "45ad5c7f62ac74fbacbfa6b731f79cfa8ba84ddf01bf25b8daaa2fbebf6b6622":
              raise RuntimeError("CMZ 1.6.3 extracted source digest mismatch")
          root = Path("xbox-cmz-services")
          root.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              entries = archive.infolist()
              if len(entries) != 218 or sum(e.file_size for e in entries) > 8*1024*1024:
                  raise RuntimeError("Unexpected saved source inventory")
              seen = set()
              for entry in entries:
                  name = PurePosixPath(entry.filename)
                  if name.is_absolute() or not name.parts or ".." in name.parts or "\\" in entry.filename or ":" in entry.filename or entry.filename in seen:
                      raise RuntimeError("Unsafe or duplicate source path")
                  seen.add(entry.filename)
                  output = root.joinpath(*name.parts)
                  output.parent.mkdir(parents=True, exist_ok=True)
                  output.write_bytes(archive.read(entry))
          print("Materialized CMZ 1.6.3 compatibility source: 218 public files. Private original game content is imported only on the console.")

      - name: Run regression suites, compile effects and app, sign only after success
        shell: pwsh
        env:
          PROBE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/xbox-cmz-services/build.ps1", [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          ./xbox-cmz-services/build.ps1 -BuildNumber ([int]$env:PROBE_BUILD_NUMBER)

      - name: Upload checked installer or failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: XboxCMZ163-x64-${{ github.run_number }}
          path: xbox-cmz-services/out/
          retention-days: 7
          if-no-files-found: warn
