                      string destination=Path.Combine(directory,"Textures.xnb");
                      if(!Valid(destination)) {
                          string archivePath=Path.Combine(localFolder,"CastleMinerZ-terrain-textures.zip");
                          if(!File.Exists(archivePath)) throw new FileNotFoundException("Upload CastleMinerZ-terrain-textures.zip intact beside the other ZIPs in LocalState.",archivePath);
                          if(new FileInfo(archivePath).Length!=ArchiveLength) throw new InvalidDataException("Wrong terrain-texture ZIP size.");
                          using(var input=File.OpenRead(archivePath)) {
                              if(Hash(input)!=ArchiveHash) throw new InvalidDataException("Terrain-texture ZIP hash mismatch.");
                              input.Position=0;
                              using(var zip=new ZipArchive(input,ZipArchiveMode.Read)) {
                                  if(zip.Entries.Count!=1) throw new InvalidDataException("Unexpected terrain archive entry count.");
                                  var entry=zip.Entries[0];
                                  if(entry.FullName!="Terrain/Textures.xnb" || entry.Length!=AssetLength) throw new InvalidDataException("Unexpected terrain archive entry.");
                                  string temporary=destination+".new";
                                  try {
                                      using(var source=entry.Open()) using(var output=File.Create(temporary)) {
                                          var buffer=new byte[65536];long count=0;int read;
                                          while((read=source.Read(buffer,0,buffer.Length))!=0) {count+=read;if(count>AssetLength)throw new InvalidDataException("Oversized terrain content.");output.Write(buffer,0,read);}
                                          if(count!=AssetLength)throw new EndOfStreamException("Incomplete terrain content.");
                                      }
                                      if(!Valid(temporary))throw new InvalidDataException("Converted terrain asset hash mismatch.");
                                      if(File.Exists(destination))File.Delete(destination);
