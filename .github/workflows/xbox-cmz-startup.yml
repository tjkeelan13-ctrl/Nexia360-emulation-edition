          The original 0.6 log linked all engine/game types and the actual Game base, but did not
          execute game methods. 0.7 is deliberately the first actual constructor/lifecycle attempt.
          A wrapper counts attempted Update/Draw calls, not successful gameplay or frame rate.
          The screen may show the original loading image, or stop earlier at a runtime incompatibility.
          It is not a guaranteed menu/world build. Online/guide/license/avatar functions remain guarded;
          no license status or authentication outcome is fabricated.
          Couch co-op is still the target: two physical players, one shared world, independent states.
          It is not implemented by the synthetic local service tests or the lifecycle wrapper.

          After an inspected cloud build
