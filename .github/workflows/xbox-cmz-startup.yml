              pass MetalMaterials { VertexShader=compile vs_4_0 TerrainVS(); PixelShader=compile ps_4_0 BlockNoWaterTechnique_MetalMaterials(); }
          }
          float4 EntityAboveWaterTechnique_SpecularMaterials(VOut v):SV_Target { return MaterialPS(v,false,1,false,false); }
          float4 EntityAboveWaterTechnique_MetalMaterials(VOut v):SV_Target { return MaterialPS(v,true,1,false,false); }
          float4 EntityAboveWaterTechnique_Reflections(VOut v):SV_Target { return MaterialPS(v,false,1,false,true); }
          technique EntityAboveWaterTechnique
          {
              pass SpecularMaterials { VertexShader=compile vs_4_0 EntityVS(); PixelShader=compile ps_4_0 EntityAboveWaterTechnique_SpecularMaterials(); }
              pass MetalMaterials { VertexShader=compile vs_4_0 EntityVS(); PixelShader=compile ps_4_0 EntityAboveWaterTechnique_MetalMaterials(); }
              pass Reflections { VertexShader=compile vs_4_0 EntityVS(); PixelShader=compile ps_4_0 EntityAboveWaterTechnique_Reflections(); }
          }
          float4 EntityBelowWaterTechnique_SpecularMaterials(VOut v):SV_Target { return MaterialPS(v,false,2,false,false); }
          float4 EntityBelowWaterTechnique_MetalMaterials(VOut v):SV_Target { return MaterialPS(v,true,2,false,false); }
          technique EntityBelowWaterTechnique
          {
