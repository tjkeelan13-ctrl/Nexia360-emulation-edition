      - name: Write Package.appxmanifest (1 of 1)
        shell: python
        run: |
          from pathlib import Path
          path = Path("xbox-cmz-services") / 'Package.appxmanifest'
          path.parent.mkdir(parents=True, exist_ok=True)
          with path.open('w', encoding="utf-8", newline="") as output:
              output.write(r'''<?xml version="1.0" encoding="utf-8"?>
          <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
                   xmlns:mp="http://schemas.microsoft.com/appx/2014/phone/manifest"
                   xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10" IgnorableNamespaces="uap mp">
            <Identity Name="NexiaCMZLoader" Publisher="CN=NexiaCMZLoader" Version="0.7.1.0" ProcessorArchitecture="x64" />
            <mp:PhoneIdentity PhoneProductId="8ef2ec60-ef4a-46e4-92bc-c48271b1e847" PhonePublisherId="00000000-0000-0000-0000-000000000000" />
            <Properties>
              <DisplayName>CMZ Assembly Loader</DisplayName>
              <PublisherDisplayName>Personal Xbox port experiment</PublisherDisplayName>
              <Logo>Assets\StoreLogo.png</Logo>
            </Properties>
            <Dependencies><TargetDeviceFamily Name="Windows.Universal" MinVersion="10.0.17763.0" MaxVersionTested="10.0.19041.0" /></Dependencies>
            <Resources><Resource Language="en-us" /></Resources>
            <Applications>
