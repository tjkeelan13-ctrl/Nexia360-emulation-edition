                      il.Emit(OpCodes.Ldarg_0);
                      for(int i=0;i<6;i++) {
                          if(i<arity) il.Emit(OpCodes.Ldarg,forward.Parameters[i]);
                          else if(i==0) il.Emit(OpCodes.Ldc_I4_0); // SpriteSortMode.Deferred
                          else il.Emit(OpCodes.Ldnull);
                      }
                      il.Emit(OpCodes.Ldloc,nullableMatrix);il.Emit(OpCodes.Call,begin);il.Emit(OpCodes.Ret);
                  }
                  var wave=module.GetType("Microsoft.Xna.Framework.Audio.WaveBank")??throw new InvalidOperationException("WaveBank missing.");
                  var nonstream=wave.Methods.Single(m=>m.IsConstructor && !m.IsStatic && m.IsPublic && m.Parameters.Count==2 &&
                      m.Parameters[0].ParameterType.FullName=="Microsoft.Xna.Framework.Audio.AudioEngine" && m.Parameters[1].ParameterType.FullName=="System.String");
                  var streaming=wave.Methods.Single(m=>m.IsConstructor && !m.IsStatic && m.IsPublic &&
                      m.Parameters.Select(p=>p.ParameterType.FullName).SequenceEqual(new[]{"Microsoft.Xna.Framework.Audio.AudioEngine","System.String","System.Int32","System.Int16"}));
                  if(residentGuard.ReturnType.FullName!="System.Void" || residentGuard.HasThis ||
