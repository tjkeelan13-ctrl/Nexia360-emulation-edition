name: Xbox - CMZ Original Startup

on:
  workflow_dispatch:
  push:
    branches: [Mousehook]
    paths:
      - '.github/workflows/xbox-cmz-startup.yml'

permissions:
  contents: read

concurrency:
  group: xbox-cmz-startup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Recover startup source and fix managed entrypoint selection
        shell: python
        run: |
          import hashlib
          import re
          import textwrap
          from pathlib import Path
          from urllib.request import urlopen

          # Immutable source from the previous run; no game files are downloaded.
          url = (
              "https://raw.githubusercontent.com/"
              "tjkeelan13-ctrl/Nexia360-emulation-edition/"
              "dd0c81c0ee28063449cbb12a3378ea4653a80d68/"
              ".github/workflows/xbox-cmz-startup.yml"
          )
          with urlopen(url, timeout=45) as response:
              data = response.read()
          expected = "196e6f70d981b104ee974f240d94a4a8e0fecc65b6790c3912628f988cf9239c"
          if hashlib.sha256(data).hexdigest() != expected:
              raise RuntimeError("Startup source integrity check failed")
          blocks = re.findall(
              r"(?m)^        shell: python\n        run: \|\n((?: {10}.*\n|\n)*)",
              data.decode("utf-8-sig")
          )
          if len(blocks) != 14:
              raise RuntimeError("Unexpected startup source structure")
          for block in blocks:
              exec(compile(textwrap.dedent(block), "verified-startup-source", "exec"), {})

          path = Path("xbox-cmz-services/PackagingTool/Program.cs")
          source = path.read_text(encoding="utf-8")
          before = 'using var app=AssemblyDefinition.ReadAssembly(Path.Combine(directory,"NexiaCMZLoader.exe"));'
          after = '''// Read the managed payload, not the native launcher.
          // Both EXE files stay unchanged.
          string managedPath=Path.Combine(directory,"entrypoint","NexiaCMZLoader.exe");
          if(!File.Exists(managedPath))
              throw new FileNotFoundException("Managed UWP payload missing from entrypoint",managedPath);
          using var app=AssemblyDefinition.ReadAssembly(managedPath);
          if(app.Name.Name!="NexiaCMZLoader")
              throw new InvalidDataException("Unexpected managed app identity");
          Console.WriteLine("Reading managed app payload: "+managedPath);'''
          if source.count(before) != 1:
              raise RuntimeError("Expected packaging patch location missing")
          path.write_text(source.replace(before, after, 1), encoding="utf-8")
          print("Fixed packaging tool to read entrypoint/NexiaCMZLoader.exe.")

      - name: Build, patch app-local content bridge, and sign startup update
        shell: pwsh
        env:
          PROBE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/xbox-cmz-services/build.ps1", [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          ./xbox-cmz-services/build.ps1 -BuildNumber ([int]$env:PROBE_BUILD_NUMBER)

      - name: Upload signed startup update or failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: XboxCMZStartup-x64-${{ github.run_number }}
          path: xbox-cmz-services/out/
          retention-days: 7
          if-no-files-found: warn
