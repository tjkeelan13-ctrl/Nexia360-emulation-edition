          path.parent.mkdir(parents=True, exist_ok=True)
          with path.open('w', encoding="utf-8", newline="") as output:
              output.write(r'''// Strict reader for the new little-endian, uncompressed music bank. No audio playback occurs here.
          using System;
          using System.IO;
          using System.Text;
          namespace NexiaCMZLoader {
              public static class ResidentMusicBank {
                  public static long Validate(Stream input, int expectedTracks, string expectedName) {
                      if(input==null || !input.CanRead || !input.CanSeek) throw new ArgumentException("Readable seekable bank required.");
                      if(input.Length<148 || input.Length>160L*1024*1024) throw new InvalidDataException("Invalid music bank size.");
                      input.Position=0;
                      using(var r=new BinaryReader(input,Encoding.UTF8,true)) {
                          if(r.ReadUInt32()!=0x444E4257 || r.ReadUInt32()!=46 || r.ReadUInt32()!=44)
                              throw new InvalidDataException("Expected little-endian PCM music bank v46/header44.");
                          long[] offsets=new long[5], lengths=new long[5];
                          for(int i=0;i<5;i++) {
                              offsets[i]=r.ReadUInt32();lengths[i]=r.ReadUInt32();
                              if(offsets[i]+lengths[i]>input.Length) throw new InvalidDataException("Bank segment outside file.");
                          }
                          if(offsets[0]!=52 || lengths[0]!=96 || offsets[1]!=148 ||
                              lengths[1]!=24L*expectedTracks || offsets[2]!=0 || lengths[2]!=0 ||
                              offsets[3]!=0 || lengths[3]!=0 || offsets[4]!=148+24L*expectedTracks ||
                              offsets[4]+lengths[4]!=input.Length)
                              throw new InvalidDataException("Unexpected PCM bank layout.");
                          input.Position=52;
                          if(r.ReadUInt32()!=0 || r.ReadUInt32()!=expectedTracks) throw new InvalidDataException("Unexpected flags or track count.");
                          byte[] name=r.ReadBytes(64);
                          if(name.Length!=64 || Encoding.UTF8.GetString(name,0,64).TrimEnd('\0')!=expectedName)
                              throw new InvalidDataException("Music bank name mismatch.");
                          if(r.ReadUInt32()!=24 || r.ReadUInt32()!=0 || r.ReadUInt32()!=4 || r.ReadUInt32()!=0)
                              throw new InvalidDataException("Unexpected entry metadata or alignment.");
                          r.ReadUInt64();
                          long lastEnd=0,pcmBytes=0;
                          for(int i=0;i<expectedTracks;i++) {
                              input.Position=148+24L*i;
                              uint duration=r.ReadUInt32(),fmt=r.ReadUInt32(),offset=r.ReadUInt32(),size=r.ReadUInt32();
                              uint loopStart=r.ReadUInt32(),loopLength=r.ReadUInt32();
                              int channels=(int)((fmt>>2)&7),rate=(int)((fmt>>5)&0x3ffff),alignment=(int)((fmt>>23)&255);
                              long samples=duration>>4;
                              if((fmt&3)!=0 || fmt>>31!=1 || (channels!=1 && channels!=2) || rate!=44100 ||
                                  alignment!=2*channels || samples<=0 || size!=samples*channels*2 || (duration&15)!=0 ||
                                  offset%4!=0 || offset<lastEnd || offset+(long)size>lengths[4] || loopStart!=0 || loopLength!=0)
                                  throw new InvalidDataException("Invalid PCM track " + i);
                              lastEnd=offset+(long)size;pcmBytes+=size;
                          }
                          if(lastEnd!=lengths[4]) throw new InvalidDataException("Trailing or incomplete PCM bank data.");
                          return pcmBytes;
                      }
                  }
              }
          }
          ''')
