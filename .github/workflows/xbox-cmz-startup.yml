      - name: Write PackagingTool/Program.cs
        shell: python
        run: |
          from pathlib import Path
          path=Path('xbox-cmz-services') / 'PackagingTool/Program.cs'
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(r'''// Patch only the app-local unsigned MonoGame copy, then validate it before packaging.
          using Mono.Cecil;
          using Mono.Cecil.Cil;
          if(args.Length!=1) throw new ArgumentException("Expected unpacked package directory");
          string directory=Path.GetFullPath(args[0]);
          string target=Path.Combine(directory,"MonoGame.Framework.dll");
          string managedPath=Path.Combine(directory,"entrypoint","NexiaCMZLoader.exe");
          if(!File.Exists(managedPath)) throw new FileNotFoundException("Managed UWP payload is missing",managedPath);
          using var app=AssemblyDefinition.ReadAssembly(managedPath);
          if(app.Name.Name!="NexiaCMZLoader") throw new InvalidDataException("Unexpected app identity");
          var terrainResource=app.MainModule.Resources.SingleOrDefault(r=>r.Name=="NexiaCMZLoader.Effects10.BlockEffect.mgfxo") as EmbeddedResource;
          if(terrainResource==null)throw new InvalidDataException("Compiled terrain effect missing from managed entrypoint resources.");
          var terrainBytes=terrainResource.GetResourceData();
          if(terrainBytes.Length<16 || terrainBytes.Length>8*1024*1024 ||
             terrainBytes[0]!=77 || terrainBytes[1]!=71 || terrainBytes[2]!=70 || terrainBytes[3]!=88 || terrainBytes[4]!=10 || terrainBytes[5]!=1)
              throw new InvalidDataException("Packaged terrain effect is not MGFX v10 DirectX.");
          Console.WriteLine("Verified embedded experimental terrain shader: "+terrainBytes.Length+" bytes; not original Xbox microcode.");
          var waterResource=app.MainModule.Resources.SingleOrDefault(r=>r.Name=="NexiaCMZLoader.Effects11.WaterEffect.mgfxo") as EmbeddedResource;
          if(waterResource==null)throw new InvalidDataException("Compiled water effect missing from managed app resources.");
          var waterBytes=waterResource.GetResourceData();
          if(waterBytes.Length<16 || waterBytes.Length>8*1024*1024 ||
             waterBytes[0]!=77 || waterBytes[1]!=71 || waterBytes[2]!=70 || waterBytes[3]!=88 || waterBytes[4]!=10 || waterBytes[5]!=1)
              throw new InvalidDataException("Water effect is not MGFX-v10 DirectX.");
          Console.WriteLine("Verified embedded experimental water shader: "+waterBytes.Length+" bytes; not original Xbox microcode.");
          var queue=app.MainModule.GetType("NexiaCMZLoader.FrameGpuWork")??throw new Exception("Draw-thread queue missing");
          if(!queue.IsPublic)throw new Exception("Draw-thread queue must be public for retargeted game calls");
          foreach(var item in new[]{("Enter","EnterDraw"),("Returned","ExitDraw"),("Stop","ExitDraw"),("Stop","Abort")}) {
              var h=app.MainModule.GetType("NexiaCMZLoader.StartupHooks").Methods.Single(m=>m.Name==item.Item1);
              if(!h.Body.Instructions.Any(i=>i.Operand is MethodReference mr && mr.DeclaringType.FullName==queue.FullName && mr.Name==item.Item2))
                  throw new Exception("Missing compiled Draw ownership hook: "+item);
          }
          foreach(var effectName in new[]{"TerrainEffectBridge","WaterEffectBridge"}) {
              var e=app.MainModule.GetType("NexiaCMZLoader."+effectName)??throw new Exception("Effect bridge missing");
              var create=e.Methods.Single(m=>m.Name=="Create");
              if(!create.Body.Instructions.Any(i=>i.Operand is MethodReference mr && mr.DeclaringType.FullName==queue.FullName && mr.Name=="Invoke"))
                  throw new Exception("Effect not routed through Draw-thread queue: "+effectName);
              if(e.Methods.Where(m=>m.HasBody).SelectMany(m=>m.Body.Instructions).Any(i=>i.Operand is MethodReference mr && mr.DeclaringType.FullName.Contains("CoreDispatcher")))
                  throw new Exception("Unsafe UI-dispatch path remains in "+effectName);
          }
          Console.WriteLine("Verified compiled Draw ownership/cancellation hooks and queued terrain/water effects. Present is NOT bypassed.");
          var menu=app.MainModule.GetType("NexiaCMZLoader.MenuStage13")??throw new Exception("Menu-stage bundle missing");
          if(!menu.IsPublic)throw new Exception("Menu hooks must be public for original game calls");
          foreach(var name in new[]{"Boot","Start","MainSelected","OptionsSelected","Save","BeforeUpdate","AfterUpdate","DrawReturned"})
              if(!menu.Methods.Any(m=>m.Name==name&&m.IsPublic&&m.IsStatic&&m.HasBody))throw new Exception("Compiled menu hook missing: "+name);
          var menuBoot=menu.Methods.Single(m=>m.Name=="Boot");
          if(!menuBoot.Body.Instructions.Any(i=>i.Operand is MethodReference mr&&mr.DeclaringType.FullName==queue.FullName&&mr.Name=="Invoke"))
              throw new Exception("Original menu boot is not queued on Draw thread");
          foreach(var name in new[]{"MenuPatch13","MenuPreferences13","MenuSprites13","MenuBatch13","MenuPolicy13"})
              if(app.MainModule.GetType("NexiaCMZLoader."+name)==null)throw new Exception("Menu helper missing: "+name);
          var patcher=app.MainModule.GetType("NexiaCMZLoader.RuntimePatches");
          if(!patcher.Methods.Single(m=>m.Name=="Apply").Body.Instructions.Any(i=>i.Operand is MethodReference mr&&mr.DeclaringType.FullName=="NexiaCMZLoader.MenuPatch13"&&mr.Name=="Apply"))
              throw new Exception("Original game retargeting lacks the menu policy hook");
          Console.WriteLine("Verified menu-only hooks, Draw-queued boot, private preferences, sprite importer and batch inventory. This is NOT an Xbox menu test.");
          var bridge=app.MainModule.GetType("NexiaCMZLoader.StartupFiles")??throw new Exception("Host stream bridge missing");
          var hostMethod=bridge.Methods.Single(m=>m.Name=="OpenTitleStream" && m.IsPublic && m.IsStatic && m.Parameters.Count==1);
          var readerType=app.MainModule.GetType("NexiaCMZLoader.XactEndianReader")??throw new Exception("XACT reader missing");
          if(!readerType.IsPublic || readerType.BaseType.FullName!="System.IO.BinaryReader") throw new Exception("Unexpected XACT reader base");
          readerType.Methods.Single(m=>m.IsConstructor && m.IsPublic && !m.IsStatic && m.Parameters.Count==1 && m.Parameters[0].ParameterType.FullName=="System.IO.Stream");
          var hooksType=app.MainModule.GetType("NexiaCMZLoader.StartupHooks")??throw new Exception("Startup hooks missing");
          hooksType.Methods.Single(m=>m.Name=="Once" && m.IsPublic && m.IsStatic && m.Parameters.Count==1);
          string[] audioTypes={"AudioEngine","SoundBank","WaveBank"};
          using(var assembly=AssemblyDefinition.ReadAssembly(target)) {
              var module=assembly.MainModule;
              var reference=new AssemblyNameReference(app.Name.Name,app.Name.Version);
              module.AssemblyReferences.Add(reference);
              var type=module.GetType("Microsoft.Xna.Framework.TitleContainer")??throw new Exception("MonoGame TitleContainer missing");
              var method=type.Methods.Single(m=>m.Name=="OpenStream" && m.IsPublic && m.IsStatic && m.Parameters.Count==1 && m.Parameters[0].ParameterType.FullName=="System.String");
              if(method.ReturnType.FullName!="System.IO.Stream") throw new Exception("Unexpected stream signature");
              var declaring=new TypeReference("NexiaCMZLoader","StartupFiles",module,reference);
              var call=new MethodReference(hostMethod.Name,method.ReturnType,declaring){HasThis=false};
              call.Parameters.Add(new ParameterDefinition(module.TypeSystem.String));
              method.Body=new MethodBody(method);
              var il=method.Body.GetILProcessor();il.Emit(OpCodes.Ldarg_0);il.Emit(OpCodes.Call,call);il.Emit(OpCodes.Ret);
              var hook=new MethodReference("Once",module.TypeSystem.Void,new TypeReference("NexiaCMZLoader","StartupHooks",module,reference)){HasThis=false};
              hook.Parameters.Add(new ParameterDefinition(module.TypeSystem.String));
              foreach(string name in audioTypes) {
                  var audio=module.GetType("Microsoft.Xna.Framework.Audio."+name)??throw new Exception("Missing XACT type "+name);
                  int patches=0;
                  foreach(var constructor in audio.Methods.Where(m=>m.IsConstructor && !m.IsStatic && m.HasBody)) {
                      bool changed=false;
                      foreach(var instruction in constructor.Body.Instructions) {
                          if(instruction.OpCode!=OpCodes.Newobj || instruction.Operand is not MethodReference ctor ||
                              ctor.DeclaringType.FullName!="System.IO.BinaryReader") continue;
                          if(ctor.Parameters.Count!=1 || ctor.Parameters[0].ParameterType.FullName!="System.IO.Stream")
                              throw new Exception("Unexpected BinaryReader constructor in "+name);
                          var adapted=new MethodReference(".ctor",module.TypeSystem.Void,
                              new TypeReference("NexiaCMZLoader","XactEndianReader",module,reference)){HasThis=true};
                          adapted.Parameters.Add(new ParameterDefinition(ctor.Parameters[0].ParameterType));
                          instruction.Operand=adapted;patches++;changed=true;
                      }
                      if(changed) {
                          var editor=constructor.Body.GetILProcessor();
                          foreach(var ret in constructor.Body.Instructions.Where(i=>i.OpCode==OpCodes.Ret).ToArray()) {
                              // Existing branches still land on the original instruction, now the log message.
                              ret.OpCode=OpCodes.Ldstr;ret.Operand="XACT "+name+" constructor returned (not playback verification).";
                              var invoke=Instruction.Create(OpCodes.Call,hook);editor.InsertAfter(ret,invoke);
                              editor.InsertAfter(invoke,Instruction.Create(OpCodes.Ret));
                          }
                      }
                  }
                  if(patches!=1) throw new Exception("Expected one reader construction in "+name+", found "+patches);
                  Console.WriteLine("Patched "+name+": numeric reader now recognizes both Xbox and Windows bank byte order.");
              }
              var musicPolicy=app.MainModule.GetType("NexiaCMZLoader.ResidentMusicPolicy")??throw new Exception("Resident music policy missing");
              var policy=musicPolicy.Methods.Single(m=>m.Name=="ValidateRequest" && m.IsStatic && m.IsPublic);
              var guard=new MethodReference(policy.Name,module.TypeSystem.Void,
                  new TypeReference("NexiaCMZLoader","ResidentMusicPolicy",module,reference)){HasThis=false};
              guard.Parameters.Add(new ParameterDefinition(module.TypeSystem.String));
              guard.Parameters.Add(new ParameterDefinition(module.TypeSystem.Int32));
              guard.Parameters.Add(new ParameterDefinition(module.TypeSystem.Int16));
              Startup09Patcher.Apply(module,guard);
              assembly.Write(target+".patched");
          }
          using(var check=AssemblyDefinition.ReadAssembly(target+".patched")) {
              Startup09Patcher.Verify(check.MainModule);
              foreach(var name in audioTypes) {
                  int count=check.MainModule.GetType("Microsoft.Xna.Framework.Audio."+name).Methods.Where(m=>m.HasBody)
                      .SelectMany(m=>m.Body.Instructions).Count(i=>i.OpCode==OpCodes.Newobj &&
                          i.Operand is MethodReference mr && mr.DeclaringType.FullName=="NexiaCMZLoader.XactEndianReader");
                  if(count!=1) throw new Exception("Patched reader verification failed for "+name);
              }
          }
          File.Move(target+".patched",target,true);
          Console.WriteLine("Verified app-local content bridge and three XACT reader call sites; original audio/game files remain outside this package.");
          ''',encoding='utf-8')
      - name: Write README.txt
        shell: python
        run: |
          from pathlib import Path
          path=Path('xbox-cmz-services') / 'README.txt'
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(r'''CMZ ORIGINAL FRONT-END BUNDLE 0.13 — EXPLICIT MENU-ONLY DEVELOPMENT MODE

          WHAT THE 0.12 XBOX TEST ESTABLISHES
          The latest supplied log has 17 MODEL READY results, including PickAxe, tools and guns
          through Colt. It next stops in TracerManager.Initialize at Effects/Tracer. Imported
          models are constructed and checked, not yet visually tested in a game world.

          WHY THIS IS A DIFFERENT, LARGER STEP
          The original SecondaryLoad creates terrain, inventory, tracers, enemies and avatar
          animations BEFORE FrontEndScreen. Its original main-selection handler also blocks
          Options when world/avatar state is absent. Rather than pretend those systems work,
          this bundle explicitly offers MENU ONLY as the default development mode. It is NOT
          a Tracer implementation and does NOT complete the full original startup sequence.

          MENU IMPLEMENTATION
          - Preserves the original full SecondaryLoad method. A separate helper copies verified
            straight-line original audio/UI-content/FrontEnd instructions, without gameplay
            initialization, terrain generation or loading-screen waits. Original files stay intact.
          - Executes the helper on the existing original Draw-thread queue. Uses the original
            FrontEndScreen, SinglePlayerStartScreen, MainMenu, OptionsMenu, Controls and Settings;
            original SpriteBatch drawing and original controller navigation remain in use.
          - Converts SpriteSheet's embedded 812x1404 DXT5 texture, retaining all 17 original sprite
            names/rectangles including Logo. No replacement logo/title artwork is fabricated.
          - Runs a batch of independent font, texture, sprite and reflection-contract checks.
            Failures are all logged before boot is rejected. No null assets or swallowed exceptions
            are used to push through a failed constructor. Other game assets get a whole-pack
            header/route inventory grouped by reader family; this is NOT runtime support proof.
          - Original Start/A chooses the actual connected controller. The menu route joins an
            offline local guest for that slot rather than invoking unimplemented Xbox sign-in.
            It does NOT claim an authenticated Xbox account, avatar renderer or online privileges.
          - Original selection events route Options/Controls/Settings and Back/return. Play,
            awards, purchases, codes and destructive world-storage actions show an unavailable
            dialog instead of entering unfinished code. Labels indicate those limitations.
          - Uses the original engine's DNAGame Update and AfterLoad in menu mode, not incomplete
            world-specific Update or InventoryItem.FinishInitialization. Original Draw is retained.
          - Stores ONLY brightness, sensitivity, music volume and invert-Y preferences under
            LocalState/MenuPreferences13 by controller slot, with checksums and backup recovery.
            It never reads/writes original stats.sav, worlds, inventory, awards or entitlements.
          - A small bottom banner identifies MENU ONLY. Click the right stick to expand/collapse
            diagnostics. Original menu selection changes and input events are recorded in the
            existing log. A Draw-return message is not proof the menu is visible or controllable.

          FULL STARTUP STILL AVAILABLE
          The default, when cmz-start-mode.txt is absent, is menu. For development only, a file
          LocalState/cmz-start-mode.txt containing exactly full selects the existing full path.
          That path still has unsupported Effects/Tracer and later game-content/services work.
          It is NOT repaired merely by switching this option. The original handlers and lifecycle
          are retained in full mode. Do not create this file for the normal menu test.

          WHAT REMAINS UNIMPLEMENTED
          Playable worlds, enemies/custom effects/animations, avatar rendering, full-version
          license integration, online services and couch co-op. Trial-only policy is unchanged.
          The terrain/water shaders remain experimental approximations. The menu-only mode is
          an explicitly bounded milestone, NOT a finished game or a new standalone imitation menu.

          BUILD/TEST LIMITS
          MenuTests13 compiles the exact mode/selection policy, preference storage, atlas importer,
          header check and IL-slice/handler patch helpers. It exercises synthetic fixtures and
          executes patched fixture methods; it never downloads/runs original game content or a GPU.
          All previous XACT/model/frame-queue/SpriteBatch tests and both shader checks also run.
          The packager verifies menu hooks, queued boot and helper presence in the managed payload.
          At preparation time no new C# build, UWP execution or controller/menu rendering test has
          run. Local checks cover original IL stack balance, metadata names, shader-independent
          SpriteBatch API signatures, sprite byte roundtrip and deterministic archive reproduction.

          USER ACTION NOW
          Replace ONLY the contents of .github/workflows/xbox-cmz-startup.yml on Mousehook using
          the supplied complete workflow. Do not rename it or create another app/workflow.
          There is no installer until the cloud build succeeds and its output is inspected.

          INSTALLATION AFTER AN INSPECTED SUCCESSFUL BUILD
          Update the same NexiaCMZLoader application to 0.13.<run>.0 WITHOUT uninstalling. Keep Game
          mode. Existing Microsoft framework dependencies should be inspected, not blindly replaced.
          Keep all five current LocalState ZIPs and extracted folders:
            CastleMinerZ-assemblies.zip
            CastleMinerZ-startup-content.zip
            CastleMinerZ-music-pcm.zip
            CastleMinerZ-terrain-textures.zip
            CastleMinerZ-models-basic.zip
          Add the one new CastleMinerZ-menu-sprites.zip INTACT alongside them. It is 316913 bytes,
          about 317 KB. The app creates MenuContent13 itself. No other input needs replacing.
          Do not put game/art/music ZIPs on GitHub or in the installer's dependency box.

          XBOX ACCEPTANCE TEST (AFTER INSTALLATION)
          Original title visible with original art/music -> Start/A -> D-pad selects Options ->
          A opens Options -> Controls/Settings open -> B returns. Settings changes should affect
          music/brightness and survive a relaunch for the same controller slot. No second controller
          is required. Play must explicitly report unavailable, not pretend to start a world.
          Return cmz-startup-log.txt and cmz-loader-log.txt before relaunch resets them. If the app
          exits, saved logs are sufficient; repeated folder photographs are unnecessary.

          SOURCE AND DATA
          No original game executable, music, textures, font files or model binaries are included
          in this source/workflow. The separate sprite ZIP is transformed user-supplied art only.
          Prior notices/licenses are retained. The new menu helpers and tests are original port-
          development code. No publisher endorsement or verified full-game compatibility is claimed.
          ''',encoding='utf-8')
      - name: Write RuntimePatches.cs
        shell: python
        run: |
          from pathlib import Path
          path=Path('xbox-cmz-services') / 'RuntimePatches.cs'
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(r'''// Changes only app-local copies of the user's verified original game assemblies.
          using System;
          using System.Collections;
          using System.Collections.Generic;
          using System.Linq;
          using Mono.Cecil;
          using Mono.Cecil.Cil;
          using Microsoft.Xna.Framework;
          using Microsoft.Xna.Framework.Graphics;

          namespace NexiaCMZLoader {
              public struct MeshPartEnumerator : IEnumerator<ModelMeshPart> {
                  private readonly ModelMeshPartCollection parts;
                  private int index;
                  public MeshPartEnumerator(ModelMeshPartCollection collection) {
                      if(collection==null) throw new ArgumentNullException("collection");
                      parts=collection; index=-1;
                  }
                  public ModelMeshPart Current { get { if(parts==null || index<0 || index>=parts.Count) throw new InvalidOperationException(); return parts[index]; } }
                  object IEnumerator.Current { get { return Current; } }
                  public bool MoveNext() { if(parts==null) return false; if(index<parts.Count) index++; return index<parts.Count; }
                  public void Reset() { index=-1; }
                  public void Dispose() { }
              }
              public static class MeshPartCompatibility {
                  public static MeshPartEnumerator GetEnumerator(ModelMeshPartCollection parts) { return new MeshPartEnumerator(parts); }
              }
              internal static class RuntimePatches {
                  private const string MeshParts="Microsoft.Xna.Framework.Graphics.ModelMeshPartCollection";
                  internal static bool RemapType(TypeReference reference,ModuleDefinition module,Action<string> log) {
                      if(reference.FullName!=MeshParts+"/Enumerator") return false;
                      var imported=module.ImportReference(typeof(MeshPartEnumerator));
                      reference.DeclaringType=null;
                      reference.Namespace=imported.Namespace;
                      reference.Name=imported.Name;
                      reference.Scope=imported.Scope;
                      reference.IsValueType=true;
                      log("PORT PATCH: real mesh-part enumerator adapter replaces the missing nested type.");
                      return true;
                  }
                  private static IEnumerable<TypeDefinition> Walk(TypeDefinition type) {
                      yield return type;
                      foreach(var inner in type.NestedTypes) foreach(var item in Walk(inner)) yield return item;
                  }
                  internal static void Apply(ModuleDefinition module,Action<string> log) {
                      var getEnumerator=module.ImportReference(typeof(MeshPartCompatibility).GetMethod("GetEnumerator"));
                      var affinity=module.ImportReference(typeof(StartupHooks).GetMethod("ConsoleAffinity"));
                      int enumerators=0,hints=0;
                      foreach(var type in module.Types.SelectMany(Walk).ToArray()) {
                          foreach(var method in type.Methods.Where(m=>m.HasBody).ToArray()) {
                              foreach(var instruction in method.Body.Instructions) {
                                  var called=instruction.Operand as MethodReference;
                                  if(called==null) continue;
                                  if(called.DeclaringType.FullName==MeshParts && called.Name=="GetEnumerator" && called.Parameters.Count==0) {
                                      if(instruction.OpCode!=OpCodes.Call && instruction.OpCode!=OpCodes.Callvirt)
                                          throw new NotSupportedException("Unexpected mesh enumeration instruction in "+method.FullName);
                                      instruction.OpCode=OpCodes.Call; instruction.Operand=getEnumerator; enumerators++;
                                  }
                                  if(called.DeclaringType.FullName=="System.Threading.Thread" && called.Name=="SetProcessorAffinity") {
                                      if(!called.HasThis || called.Parameters.Count!=1 || called.Parameters[0].ParameterType.FullName!="System.Int32[]")
                                          throw new NotSupportedException("Unexpected console affinity signature");
                                      instruction.OpCode=OpCodes.Call; instruction.Operand=affinity; hints++;
                                  }
                              }
                          }
                      }
                      log("PORT PATCH calls: mesh enumerators="+enumerators+" affinity hints="+hints);
                      if(module.Assembly.Name.Name=="CastleMinerZ") { MenuPatch13.Apply(module,log); AddStartupSubclass(module,log); }
                  }
                  private static void AddStartupSubclass(ModuleDefinition module,Action<string> log) {
                      var original=module.GetType("DNA.CastleMinerZ.CastleMinerZGame");
                      if(original==null || original.IsSealed) throw new NotSupportedException("Unexpected original game base type");
                      var derived=new TypeDefinition("NexiaStartup","OriginalGame",TypeAttributes.Public|TypeAttributes.Class,original);
                      module.Types.Add(derived);
                      var ctor=new MethodDefinition(".ctor",MethodAttributes.Public|MethodAttributes.HideBySig|
                          MethodAttributes.SpecialName|MethodAttributes.RTSpecialName,module.TypeSystem.Void);
                      derived.Methods.Add(ctor);
                      var baseCtor=original.Methods.Single(m=>m.IsConstructor && !m.IsStatic && m.Parameters.Count==0);
                      var il=ctor.Body.GetILProcessor();
                      il.Emit(OpCodes.Ldarg_0); il.Emit(OpCodes.Call,baseCtor); il.Emit(OpCodes.Ret);
                      foreach(var name in new[]{"Initialize","LoadContent","SecondaryLoad","AfterLoad","Update","Draw","UnloadContent"}) {
                          bool timed=name=="Update" || name=="Draw";
                          AddGuardedOverride(module,derived,original,name,timed);
                      }
                      log("PORT PATCH: generated derived game invokes original lifecycle methods with explicit exception reporting.");
                  }
                  private static void AddGuardedOverride(ModuleDefinition module,TypeDefinition derived,TypeDefinition original,string name,bool timed) {
                      var method=new MethodDefinition(name,MethodAttributes.Family|MethodAttributes.Virtual|MethodAttributes.HideBySig,module.TypeSystem.Void);
                      TypeReference lifecycleOwner=(MenuStage13.Enabled && (name=="Update" || name=="AfterLoad"))?original.BaseType:original;
                      var target=new MethodReference(name,module.TypeSystem.Void,lifecycleOwner){HasThis=true};
                      if(timed) {
                          var gameTime=module.ImportReference(typeof(GameTime));
                          method.Parameters.Add(new ParameterDefinition("time",ParameterAttributes.None,gameTime));
                          target.Parameters.Add(new ParameterDefinition(gameTime));
                      }
                      derived.Methods.Add(method);
                      var il=method.Body.GetILProcessor();
                      method.Body.InitLocals=true;
                      var ex=new VariableDefinition(module.ImportReference(typeof(Exception)));method.Body.Variables.Add(ex);
                      var done=Instruction.Create(OpCodes.Ret);
                      var begin=Instruction.Create(OpCodes.Ldstr,name);
                      var caught=Instruction.Create(OpCodes.Stloc,ex);
                      il.Emit(OpCodes.Call,module.ImportReference(typeof(StartupHooks).GetProperty("Failed").GetGetMethod()));
                      il.Emit(OpCodes.Brtrue,done);
                      il.Append(begin);
                      il.Emit(OpCodes.Call,module.ImportReference(typeof(StartupHooks).GetMethod("Enter")));
                      if(MenuStage13.Enabled && name=="Update") {
                          il.Emit(OpCodes.Ldarg_0);il.Emit(OpCodes.Call,module.ImportReference(typeof(MenuStage13).GetMethod("BeforeUpdate")));
                      }
                      il.Emit(OpCodes.Ldarg_0);
                      if(timed) il.Emit(OpCodes.Ldarg_1);
                      if(MenuStage13.Enabled && name=="SecondaryLoad")
                          il.Emit(OpCodes.Call,module.ImportReference(typeof(MenuStage13).GetMethod("Boot")));
                      else il.Emit(OpCodes.Call,target); // non-virtual; menu Update/AfterLoad use DNAGame, not incomplete world logic
                      if(MenuStage13.Enabled && name=="Update") {
                          il.Emit(OpCodes.Ldarg_0);il.Emit(OpCodes.Ldarg_1);il.Emit(OpCodes.Call,module.ImportReference(typeof(MenuStage13).GetMethod("AfterUpdate")));
                      }
                      if(MenuStage13.Enabled && name=="Draw")il.Emit(OpCodes.Call,module.ImportReference(typeof(MenuStage13).GetMethod("DrawReturned")));
                      il.Emit(OpCodes.Ldstr,name);
                      il.Emit(OpCodes.Call,module.ImportReference(typeof(StartupHooks).GetMethod("Returned")));
                      il.Emit(OpCodes.Leave,done);
                      il.Append(caught);
                      il.Emit(OpCodes.Ldloc,ex);il.Emit(OpCodes.Ldstr,name);
                      il.Emit(OpCodes.Call,module.ImportReference(typeof(StartupHooks).GetMethod("Stop")));
                      il.Emit(OpCodes.Leave,done);
                      il.Append(done);
                      method.Body.ExceptionHandlers.Add(new ExceptionHandler(ExceptionHandlerType.Catch){
                          CatchType=module.ImportReference(typeof(Exception)),TryStart=begin,TryEnd=caught,HandlerStart=caught,HandlerEnd=done
                      });
                  }
              }
          }
          ''',encoding='utf-8')
