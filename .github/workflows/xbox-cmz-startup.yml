            ],
            "project_xml_compile_includes_checked": [
              "ManagedProbe.csproj",
              "XactTests/XactTests.csproj",
              "PackagingTool/PackagingTool.csproj",
              "Startup09Tests/Startup09Tests.csproj"
            ],
            "manifest_xaml_and_nuget_xml_parsed": true,
            "unchanged_prior_implementations": [
              "XactCompatibility.cs",
              "XactSoundBank.cs",
              "ResidentMusic.cs",
              "ResidentMusicBank.cs",
              "ResidentMusicPolicy.cs",
              "LocalServices.cs",
