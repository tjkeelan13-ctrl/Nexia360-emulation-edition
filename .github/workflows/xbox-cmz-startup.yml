                  private static void CheckPixels(GraphicsDevice device) {
                      FrameGpuWork.AssertInsideDraw();
                      StartupHooks.Once("TERRAIN GPU CHECK: executing synchronously inside original Draw, not on the XAML dispatcher.");
                      var targets=device.GetRenderTargets();var viewport=device.Viewport;
                      var blend=device.BlendState;var depth=device.DepthStencilState;var raster=device.RasterizerState;
                      var indices=device.Indices;
                      var textures=new Texture[6];var samplers=new SamplerState[6];
                      for(int i=0;i<6;i++){textures[i]=device.Textures[i];samplers[i]=device.SamplerStates[i];}
                      using(var e=new Effect(device,bytecode))
                      using(var red=Solid(device,new Color(255,0,0,255)))
                      using(var normal=Solid(device,new Color(128,128,255,0)))
                      using(var black=Solid(device,new Color(0,0,0,0)))
                      using(var volume=new Texture3D(device,1,1,1,false,SurfaceFormat.Color))
                      using(var target=new RenderTarget2D(device,16,16,false,SurfaceFormat.Color,DepthFormat.None)) {
                          try {
                              volume.SetData(new[]{Color.Black});
                              e.Parameters["World"].SetValue(Matrix.CreateScale(1.5f,1.5f,1f)*Matrix.CreateTranslation(-0.75f,-0.75f,0.5f));
                              e.Parameters["View"].SetValue(Matrix.Identity);e.Parameters["Projection"].SetValue(Matrix.Identity);e.Parameters["InverseWorld"].SetValue(Matrix.Identity);
                              var faces=new Matrix[6];for(int i=0;i<6;i++)faces[i]=Matrix.Identity;e.Parameters["FaceMatrices"].SetValue(faces);
                              e.Parameters["VertexUVs"].SetValue(new[]{Vector4.Zero,new Vector4(0.125f,0,0.0625f,0),new Vector4(0,0.125f,0,0.0625f),new Vector4(0.125f,0.125f,0.0625f,0.0625f)});
                              e.Parameters["CubeTx"].SetValue(new int[6]);
                              foreach(var name in VectorNames)e.Parameters[name].SetValue(Vector3.Zero);
                              e.Parameters["AmbientSun"].SetValue(Vector3.One);e.Parameters["LightDirection"].SetValue(Vector3.Backward);
                              e.Parameters["DiffuseAlphaTexture"].SetValue(red);e.Parameters["NormalSpecTexture"].SetValue(normal);e.Parameters["MetalLightTexture"].SetValue(black);
                              e.Parameters["MipMapDiffuseTexture"].SetValue(red);e.Parameters["MipMapSpecularTexture"].SetValue(normal);e.Parameters["EnvMapTexture"].SetValue(volume);
                              e.Parameters["WaterDepth"].SetValue(10);e.Parameters["WaterLevel"].SetValue(-10000f);
                              device.SetRenderTarget(target);device.Viewport=new Viewport(0,0,16,16);
                              device.Clear(Color.Black);device.BlendState=BlendState.Opaque;device.DepthStencilState=DepthStencilState.None;device.RasterizerState=RasterizerState.CullNone;
                              e.CurrentTechnique=e.Techniques[2];e.CurrentTechnique.Passes[0].Apply();
                              var quad=new[]{new PackedVertex(0,0,0,2),new PackedVertex(1,0,0,3),new PackedVertex(0,1,0,0),new PackedVertex(0,1,0,0),new PackedVertex(1,0,0,3),new PackedVertex(1,1,0,1)};
                              device.DrawUserPrimitives(PrimitiveType.TriangleList,quad,0,2);
                              device.SetRenderTargets(targets);
                              var pixels=new Color[256];target.GetData(pixels);Color center=pixels[8*16+8];
                              if(center.R<200 || center.G>10 || center.B>10)throw new InvalidDataException("Terrain packed-vertex shader readback failed: "+center);
                              StartupHooks.Once("TERRAIN GPU CHECK: packed Byte4 input, compiled shader and red material texture rendered to 16x16 target; center pixel PASS. This is a synthetic integration test, NOT a rendered game world.");
                          } finally {
                              device.SetRenderTargets(targets);device.Viewport=viewport;
                              device.BlendState=blend;device.DepthStencilState=depth;device.RasterizerState=raster;
                              device.Indices=indices;
