# Replace code only in .github/workflows/xbox-cmz-startup.yml; keep its path unchanged.
name: Xbox - CMZ Original Startup

on:
  workflow_dispatch:
  push:
    branches: [Mousehook]
    paths:
      - '.github/workflows/xbox-cmz-startup.yml'

permissions:
  contents: read
concurrency:
  group: xbox-cmz-startup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Recover verified startup source
        shell: python
        run: |
          import hashlib, re, textwrap
          from urllib.request import urlopen
          url = "https://raw.githubusercontent.com/tjkeelan13-ctrl/Nexia360-emulation-edition/dd0c81c0ee28063449cbb12a3378ea4653a80d68/.github/workflows/xbox-cmz-startup.yml"
          with urlopen(url, timeout=45) as response:
              data = response.read()
          if hashlib.sha256(data).hexdigest() != "196e6f70d981b104ee974f240d94a4a8e0fecc65b6790c3912628f988cf9239c":
              raise RuntimeError("Base startup source integrity mismatch")
          blocks = re.findall(r"(?m)^        shell: python\n        run: \|\n((?: {10}.*\n|\n)*)", data.decode("utf-8-sig"))
          if len(blocks) != 14:
              raise RuntimeError("Unexpected base source structure")
          for block in blocks:
              exec(compile(textwrap.dedent(block), "verified-startup-source", "exec"), {})
          print("Recovered source. The following steps include the managed-entrypoint fix.")
      - name: Apply targeted startup and trial-only test policy changes
        shell: python
        run: |
          from pathlib import Path
          root = Path("xbox-cmz-services")
          for name in ["App.xaml.cs", "CmzLoader.cs", "Package.appxmanifest", "build.ps1", "StartupHooks.cs"]:
              path = root / name
              path.write_text(path.read_text(encoding="utf-8").replace("0.7", "0.8"), encoding="utf-8")
          def patch(name, before, after):
              path = root / name
              source = path.read_text(encoding="utf-8")
              if source.count(before) != 1:
                  raise RuntimeError("Expected patch location missing or ambiguous in " + name)
              path.write_text(source.replace(before, after, 1), encoding="utf-8")
          patch('ManagedProbe.csproj', '<Compile Include="StartupFiles.cs" />', '<Compile Include="StartupFiles.cs" />\n    <Compile Include="XactCompatibility.cs" />\n    <Compile Include="XactSoundBank.cs" />')
          patch('StartupFiles.cs', 'return File.OpenRead(full);', '// Normalize only PCM samples; compressed bank payloads remain unchanged.\n                if(Path.GetExtension(full).Equals(".xsb",StringComparison.OrdinalIgnoreCase)) return XactSoundBank.Open(full);\n                if(Path.GetExtension(full).Equals(".xwb",StringComparison.OrdinalIgnoreCase)) return XactWaveBank.Open(full);\n                return File.OpenRead(full);')
          patch('LocalServices.cs', 'public static bool IsTrialMode { get { throw NexiaCMZLoader.CompatUnavailable.Create("Guide.IsTrialMode license integration"); } }', 'public static bool IsTrialMode { get {\n            // Conservative test-host policy, NOT a verified entitlement or full-version unlock.\n            NexiaCMZLoader.StartupHooks.Once("LICENSE POLICY: trial-only development host; original trial restrictions retained. No Xbox entitlement check is claimed.");\n            return true;\n        } }')
          patch('build.ps1', '    & $msbuild "$root\\ManagedProbe.csproj" /restore', '    # Test the exact new reader/converter source using synthetic inputs, not game data.\n    & dotnet run --project "$root\\XactTests\\XactTests.csproj" --configuration Release 2>&1 | Tee-Object -FilePath "$out\\xact-unit-tests.log"\n    if ($LASTEXITCODE -ne 0) { throw \'XACT reader/converter unit tests failed. No package will be published.\' }\n    & $msbuild "$root\\ManagedProbe.csproj" /restore')
          patch('StartupHooks.cs', 'Note("Starting original game code is experimental. No playable build or split-screen is claimed.");', 'Note("Original startup 0.8: Xbox XACT number reader + PCM16 sample conversion + trial-only development policy.");\n            Note("Streaming/compressed audio playback, avatars and split-screen are not implemented by this update.");')
          path = root / "THIRD-PARTY-NOTICES.txt"
          with path.open("a", encoding="utf-8") as output:
              output.write("\n0.8 original code: endian-aware XACT reader, validated in-memory PCM conversion, trial-only development policy and synthetic tests. No FAudio binary or code is included. See SOURCE-PROVENANCE.json.\n")
      - name: Write XactSoundBank.cs
        shell: python
        run: |
          from pathlib import Path
          path = Path("xbox-cmz-services") / 'XactSoundBank.cs'
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(r'''// Original adapter for the packed XSB fields read as smaller fields by MonoGame 3.8.1.
          // Keeps offsets/file length stable and modifies an in-memory copy, never the original file.
          using System;
          using System.Collections.Generic;
          using System.IO;
          using System.Text;

          namespace NexiaCMZLoader {
              public static class XactSoundBank {
                  private static void Range(byte[] data, int offset, int size) {
                      if(offset<0 || size<0 || (long)offset+size>data.Length) throw new InvalidDataException("XSB field outside file.");
                  }
                  private static ushort U16(byte[] data,int p) {
                      Range(data,p,2);return (ushort)((data[p]<<8)|data[p+1]);
                  }
                  private static uint U32(byte[] data,int p) {
                      Range(data,p,4);return ((uint)data[p]<<24)|((uint)data[p+1]<<16)|((uint)data[p+2]<<8)|data[p+3];
                  }
                  private static int Offset(byte[] data,int field) {
                      uint value=U32(data,field);if(value>(uint)data.Length) throw new InvalidDataException("XSB invalid offset.");return (int)value;
                  }
                  private static void SwapHalves(byte[] data,int p) {
                      byte a=data[p],b=data[p+1];data[p]=data[p+2];data[p+1]=data[p+3];data[p+2]=a;data[p+3]=b;
                  }
                  public static Stream Open(string path) {
                      if(new FileInfo(path).Length>16*1024*1024) throw new InvalidDataException("XSB size limit exceeded.");
                      return new MemoryStream(Normalize(File.ReadAllBytes(path),StartupHooks.Once),false);
                  }
                  public static byte[] Normalize(byte[] source,Action<string> report) {
                      if(source==null) throw new ArgumentNullException("source");
                      Range(source,0,74);
                      string magic=Encoding.ASCII.GetString(source,0,4);
                      if(magic=="SDBK") return source;
                      if(magic!="KBDS" || U16(source,4)!=46 || U16(source,6)!=43)
                          throw new NotSupportedException("Expected Xbox XSB content 46/tool 43.");
                      int simple=U16(source,19),complex=U16(source,21),total=U16(source,25);
                      if(simple+complex!=total) throw new InvalidDataException("XSB cue-count mismatch.");
                      int simpleOffset=Offset(source,34),complexOffset=Offset(source,38),nameOffset=Offset(source,42);
                      uint nameBytes=U32(source,30);
                      // MonoGame reads this 32-bit length as ushort + ignored ushort. Adapt that layout.
                      if(nameBytes>ushort.MaxValue) throw new NotSupportedException("XSB cue-name table exceeds this MonoGame reader's limit.");
                      Range(source,nameOffset,(int)nameBytes);Range(source,simpleOffset,simple*5);Range(source,complexOffset,complex*15);
                      int names=0;for(int p=nameOffset;p<nameOffset+(int)nameBytes;p++) if(source[p]==0) names++;
                      if(names<total) throw new InvalidDataException("Truncated XSB cue-name table.");
                      byte[] result=(byte[])source.Clone();SwapHalves(result,30);
                      var soundOffsets=new HashSet<int>();var variations=new HashSet<int>();
                      for(int i=0;i<simple;i++) soundOffsets.Add(Offset(source,simpleOffset+5*i+1));
                      for(int i=0;i<complex;i++) {
                          int cue=complexOffset+15*i;int off=Offset(source,cue+1);
                          if((source[cue]&4)!=0) { soundOffsets.Add(off);continue; }
                          if(!variations.Add(off)) continue;
                          Range(source,off,8);
                          // The original packs entryCount in the LOW 16 bits of a uint32.
                          // MonoGame reads count first and flags second, which needs half-word reordering on Xbox.
                          uint packed=U32(source,off);int count=(int)(packed&65535),kind=(int)((packed>>19)&7);
                          int stride;
                          switch(kind) { case 0:stride=5;break;case 1:stride=6;break;case 3:stride=16;break;case 4:stride=3;break;
                              default:throw new NotSupportedException("XSB variation table type "+kind+" is unsupported."); }
                          if(count==0 || count>4096) throw new InvalidDataException("Invalid XSB variation count.");
                          Range(source,off+8,count*stride);
                          SwapHalves(result,off);
                          if(kind==1 || kind==3) for(int j=0;j<count;j++) soundOffsets.Add(Offset(source,off+8+j*stride));
                      }
                      // Avoid silently misreading other packed event variants. The supplied original bank
                      // uses simple sounds and seven basic PlayWave clips; additional event layouts need adapters.
                      var clips=new HashSet<int>();
                      foreach(int off in soundOffsets) {
                          Range(source,off,12);int flags=source[off],p=off+9;
                          int n=0;if((flags&1)!=0) { n=source[p++]; } else p+=3;
                          if((flags&14)!=0) { int size=U16(source,p);if(size<3) throw new InvalidDataException("Invalid XSB RPC block.");Range(source,p,size);p+=size; }
                          if((flags&16)!=0) {Range(source,p,7);p+=7;}
                          Range(source,p,n*9);
                          for(int j=0;j<n;j++) clips.Add(Offset(source,p+9*j+1));
                      }
                      int events=0;
                      foreach(int off in clips) {
                          Range(source,off,1);int count=source[off],p=off+1;
                          for(int i=0;i<count;i++) {
                              Range(source,p,16);int id=(int)(U32(source,p)&31);
                              if(id!=1) throw new NotSupportedException("XSB clip event "+id+" needs an endian-layout adapter; no substitute sound is used.");
                              if(source[p+6]!=255) throw new InvalidDataException("Invalid XSB event separator.");
                              p+=16;events++;
                          }
                      }
                      if(report!=null) report("XACT XSB layout: "+total+" cue names; "+variations.Count+
                          " packed variation headers adapted; "+soundOffsets.Count+" referenced sounds and "+events+" basic wave events checked.");
                      return result;
                  }
              }
          }
          ''', encoding="utf-8")
      - name: Write XactCompatibility.cs
        shell: python
        run: |
          from pathlib import Path
          path = Path("xbox-cmz-services") / 'XactCompatibility.cs'
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(r'''// Original interoperability code. Only this application's MonoGame copy uses this reader.
          // Does not decrypt content, change operating-system files or alter original input archives.
          using System;
          using System.Collections.Generic;
          using System.IO;
          using System.Text;

          namespace NexiaCMZLoader {
              /// <summary>Reads the numeric fields of supported Xbox and Windows XACT banks.</summary>
              public sealed class XactEndianReader : BinaryReader {
                  public bool BigEndian { get; private set; }
                  public XactEndianReader(Stream stream) : base(stream, Encoding.UTF8) {
                      if (!stream.CanSeek) throw new NotSupportedException("XACT input must be seekable.");
                      long start = stream.Position;
                      byte[] magic = base.ReadBytes(4);
                      stream.Position = start;
                      if (magic.Length != 4) throw new EndOfStreamException("Truncated XACT header.");
                      string tag = Encoding.ASCII.GetString(magic, 0, 4);
                      switch (tag) {
                          case "FSGX": case "KBDS": case "DNBW": BigEndian = true; break;
                          case "XGSF": case "SDBK": case "WBND": BigEndian = false; break;
                          default: throw new InvalidDataException("Unrecognized XACT header: " + tag);
                      }
                      StartupHooks.Once("XACT number reader: " + tag + "; " + (BigEndian ? "big-endian" : "little-endian"));
                  }
                  private byte[] NumberBytes(int size) {
                      byte[] data = base.ReadBytes(size);
                      if (data.Length != size) throw new EndOfStreamException("Truncated XACT numeric field.");
                      // BitConverter uses the host byte order, while raw strings and audio remain untouched.
                      if (BigEndian == BitConverter.IsLittleEndian) Array.Reverse(data);
                      return data;
                  }
                  public override short ReadInt16() { return BitConverter.ToInt16(NumberBytes(2), 0); }
                  public override ushort ReadUInt16() { return BitConverter.ToUInt16(NumberBytes(2), 0); }
                  public override int ReadInt32() { return BitConverter.ToInt32(NumberBytes(4), 0); }
                  public override uint ReadUInt32() { return BitConverter.ToUInt32(NumberBytes(4), 0); }
                  public override long ReadInt64() { return BitConverter.ToInt64(NumberBytes(8), 0); }
                  public override ulong ReadUInt64() { return BitConverter.ToUInt64(NumberBytes(8), 0); }
                  public override float ReadSingle() { return BitConverter.ToSingle(NumberBytes(4), 0); }
                  public override double ReadDouble() { return BitConverter.ToDouble(NumberBytes(8), 0); }
                  public override decimal ReadDecimal() {
                      if (BigEndian) throw new NotSupportedException("XACT decimal fields are not implemented.");
                      return base.ReadDecimal();
                  }
              }

              /// <summary>
              /// Converts big-endian PCM16 samples in memory while leaving the XWB metadata big-endian.
              /// Compressed wave data is retained unchanged; this is NOT a compressed-stream decoder.
              /// </summary>
              public static class XactWaveBank {
                  private const int MaximumBytes = 128 * 1024 * 1024;
                  public static Stream Open(string path) {
                      long length = new FileInfo(path).Length;
                      if (length < 52 || length > MaximumBytes) throw new InvalidDataException("Invalid wave-bank size.");
                      byte[] source = File.ReadAllBytes(path);
                      byte[] prepared = Normalize(source, Path.GetFileName(path), StartupHooks.Once);
                      return new MemoryStream(prepared, false);
                  }
                  private static uint U32(byte[] data, int offset) {
                      if (offset < 0 || offset > data.Length - 4) throw new InvalidDataException("XWB field outside file.");
                      return ((uint)data[offset] << 24) | ((uint)data[offset + 1] << 16) |
                             ((uint)data[offset + 2] << 8) | data[offset + 3];
                  }
                  private static int Bounded(uint value, int limit, string what) {
                      if (value > (uint)limit) throw new InvalidDataException("Invalid XWB " + what);
                      return (int)value;
                  }
                  private static void Region(int offset, int length, int total, string what) {
                      if (offset < 0 || length < 0 || (long)offset + length > total)
                          throw new InvalidDataException("XWB " + what + " is outside its containing region.");
                  }
                  public static byte[] Normalize(byte[] source, string label, Action<string> report) {
                      if (source == null) throw new ArgumentNullException("source");
                      if (source.Length < 52 || source.Length > MaximumBytes) throw new InvalidDataException("Invalid XWB size.");
                      string magic = Encoding.ASCII.GetString(source, 0, 4);
                      if (magic == "WBND") {
                          if (report != null) report("XACT " + label + ": Windows wave bank left unchanged.");
                          return source;
                      }
                      if (magic != "DNBW" || U32(source, 4) != 46 || U32(source, 8) != 44)
                          throw new NotSupportedException("Expected Xbox XACT wave bank version 46/header 44.");
                      int[] offsets = new int[5], lengths = new int[5];
                      for (int i = 0; i < 5; i++) {
                          offsets[i] = Bounded(U32(source, 12 + i * 8), source.Length, "segment offset");
                          lengths[i] = Bounded(U32(source, 16 + i * 8), source.Length, "segment length");
                          Region(offsets[i], lengths[i], source.Length, "segment");
                      }
                      if (lengths[0] < 96 || offsets[0] < 52) throw new InvalidDataException("Truncated XWB bank metadata.");
                      uint flags = U32(source, offsets[0]);
                      if ((flags & 0x20000) != 0) throw new NotSupportedException("Compact XWB data is not handled by this converter.");
                      int count = Bounded(U32(source, offsets[0] + 4), 10000, "entry count");
                      int stride = Bounded(U32(source, offsets[0] + 72), 4096, "entry stride");
                      if (count < 1 || stride < 24 || (long)stride * count > lengths[1])
                          throw new InvalidDataException("Invalid XWB entry table.");
                      int metadataEnd = Math.Max(52, Math.Max(offsets[0] + lengths[0], offsets[1] + lengths[1]));
                      for (int i = 2; i < 4; i++) if (lengths[i] != 0) metadataEnd = Math.Max(metadataEnd, offsets[i] + lengths[i]);
                      if (offsets[4] < metadataEnd) throw new InvalidDataException("Wave samples overlap XWB metadata.");
                      var ranges = new List<Tuple<int, int>>();
                      var swapRanges = new List<Tuple<int, int>>();
                      int pcm8 = 0, compressed = 0;
                      for (int i = 0; i < count; i++) {
                          int entry = offsets[1] + i * stride;
                          uint durationAndFlags = U32(source, entry);
                          uint format = U32(source, entry + 4);
                          int relative = Bounded(U32(source, entry + 8), lengths[4], "play offset");
                          int size = Bounded(U32(source, entry + 12), lengths[4], "play length");
                          Region(relative, size, lengths[4], "wave payload");
                          int start = offsets[4] + relative;
                          if (size > 0) ranges.Add(Tuple.Create(start, size));
                          int codec = (int)(format & 3), channels = (int)((format >> 2) & 7);
                          int rate = (int)((format >> 5) & 0x3ffff);
                          if (channels == 0 || rate == 0) throw new InvalidDataException("Invalid wave sample format.");
                          if (codec != 0) { compressed++; continue; }
                          int bits = (format & 0x80000000) == 0 ? 8 : 16;
                          int frameBytes = channels * (bits / 8);
                          if (size % frameBytes != 0) throw new InvalidDataException("Misaligned PCM samples.");
                          uint samples = (uint)(size / frameBytes);
                          uint duration = durationAndFlags >> 4;
                          if (duration != 0 && duration != samples) throw new InvalidDataException("PCM sample-count mismatch.");
                          uint loopStart = U32(source, entry + 16), loopLength = U32(source, entry + 20);
                          if ((ulong)loopStart + loopLength > samples) throw new InvalidDataException("PCM loop outside sample data.");
                          if (bits == 16) swapRanges.Add(Tuple.Create(start, size)); else pcm8++;
                      }
                      ranges.Sort((a, b) => a.Item1.CompareTo(b.Item1));
                      for (int i = 1; i < ranges.Count; i++)
                          if ((long)ranges[i - 1].Item1 + ranges[i - 1].Item2 > ranges[i].Item1)
                              throw new InvalidDataException("Overlapping wave payloads are not supported.");
                      byte[] result = swapRanges.Count == 0 ? source : (byte[])source.Clone();
                      foreach (var range in swapRanges) {
                          int end = range.Item1 + range.Item2;
                          for (int pos = range.Item1; pos < end; pos += 2) {
                              byte first = result[pos]; result[pos] = result[pos + 1]; result[pos + 1] = first;
                          }
                      }
                      if (report != null) report("XACT " + label + ": PCM16 tracks byte-swapped=" + swapRanges.Count +
                          "; PCM8 unchanged=" + pcm8 + "; compressed tracks unchanged=" + compressed +
                          ". Conversion is app-memory only; compressed-stream playback remains unimplemented.");
                      return result;
                  }
              }
          }
          ''', encoding="utf-8")
      - name: Write PackagingTool/Program.cs
        shell: python
        run: |
          from pathlib import Path
          path = Path("xbox-cmz-services") / 'PackagingTool/Program.cs'
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(r'''// Patch only the app-local unsigned MonoGame copy, then validate it before packaging.
          using Mono.Cecil;
          using Mono.Cecil.Cil;
          if(args.Length!=1) throw new ArgumentException("Expected unpacked package directory");
          string directory=Path.GetFullPath(args[0]);
          string target=Path.Combine(directory,"MonoGame.Framework.dll");
          string managedPath=Path.Combine(directory,"entrypoint","NexiaCMZLoader.exe");
          if(!File.Exists(managedPath)) throw new FileNotFoundException("Managed UWP payload is missing",managedPath);
          using var app=AssemblyDefinition.ReadAssembly(managedPath);
          if(app.Name.Name!="NexiaCMZLoader") throw new InvalidDataException("Unexpected app identity");
          var bridge=app.MainModule.GetType("NexiaCMZLoader.StartupFiles")??throw new Exception("Host stream bridge missing");
          var hostMethod=bridge.Methods.Single(m=>m.Name=="OpenTitleStream" && m.IsPublic && m.IsStatic && m.Parameters.Count==1);
          var readerType=app.MainModule.GetType("NexiaCMZLoader.XactEndianReader")??throw new Exception("XACT reader missing");
          if(!readerType.IsPublic || readerType.BaseType.FullName!="System.IO.BinaryReader") throw new Exception("Unexpected XACT reader base");
          readerType.Methods.Single(m=>m.IsConstructor && m.IsPublic && !m.IsStatic && m.Parameters.Count==1 && m.Parameters[0].ParameterType.FullName=="System.IO.Stream");
          var hooksType=app.MainModule.GetType("NexiaCMZLoader.StartupHooks")??throw new Exception("Startup hooks missing");
          hooksType.Methods.Single(m=>m.Name=="Once" && m.IsPublic && m.IsStatic && m.Parameters.Count==1);
          string[] audioTypes={"AudioEngine","SoundBank","WaveBank"};
          using(var assembly=AssemblyDefinition.ReadAssembly(target)) {
              var module=assembly.MainModule;
              var reference=new AssemblyNameReference(app.Name.Name,app.Name.Version);
              module.AssemblyReferences.Add(reference);
              var type=module.GetType("Microsoft.Xna.Framework.TitleContainer")??throw new Exception("MonoGame TitleContainer missing");
              var method=type.Methods.Single(m=>m.Name=="OpenStream" && m.IsPublic && m.IsStatic && m.Parameters.Count==1 && m.Parameters[0].ParameterType.FullName=="System.String");
              if(method.ReturnType.FullName!="System.IO.Stream") throw new Exception("Unexpected stream signature");
              var declaring=new TypeReference("NexiaCMZLoader","StartupFiles",module,reference);
              var call=new MethodReference(hostMethod.Name,method.ReturnType,declaring){HasThis=false};
              call.Parameters.Add(new ParameterDefinition(module.TypeSystem.String));
              method.Body=new MethodBody(method);
              var il=method.Body.GetILProcessor();il.Emit(OpCodes.Ldarg_0);il.Emit(OpCodes.Call,call);il.Emit(OpCodes.Ret);
              var hook=new MethodReference("Once",module.TypeSystem.Void,new TypeReference("NexiaCMZLoader","StartupHooks",module,reference)){HasThis=false};
              hook.Parameters.Add(new ParameterDefinition(module.TypeSystem.String));
              foreach(string name in audioTypes) {
                  var audio=module.GetType("Microsoft.Xna.Framework.Audio."+name)??throw new Exception("Missing XACT type "+name);
                  int patches=0;
                  foreach(var constructor in audio.Methods.Where(m=>m.IsConstructor && !m.IsStatic && m.HasBody)) {
                      bool changed=false;
                      foreach(var instruction in constructor.Body.Instructions) {
                          if(instruction.OpCode!=OpCodes.Newobj || instruction.Operand is not MethodReference ctor ||
                              ctor.DeclaringType.FullName!="System.IO.BinaryReader") continue;
                          if(ctor.Parameters.Count!=1 || ctor.Parameters[0].ParameterType.FullName!="System.IO.Stream")
                              throw new Exception("Unexpected BinaryReader constructor in "+name);
                          var adapted=new MethodReference(".ctor",module.TypeSystem.Void,
                              new TypeReference("NexiaCMZLoader","XactEndianReader",module,reference)){HasThis=true};
                          adapted.Parameters.Add(new ParameterDefinition(ctor.Parameters[0].ParameterType));
                          instruction.Operand=adapted;patches++;changed=true;
                      }
                      if(changed) {
                          var editor=constructor.Body.GetILProcessor();
                          foreach(var ret in constructor.Body.Instructions.Where(i=>i.OpCode==OpCodes.Ret).ToArray()) {
                              // Existing branches still land on the original instruction, now the log message.
                              ret.OpCode=OpCodes.Ldstr;ret.Operand="XACT "+name+" constructor returned (not playback verification).";
                              var invoke=Instruction.Create(OpCodes.Call,hook);editor.InsertAfter(ret,invoke);
                              editor.InsertAfter(invoke,Instruction.Create(OpCodes.Ret));
                          }
                      }
                  }
                  if(patches!=1) throw new Exception("Expected one reader construction in "+name+", found "+patches);
                  Console.WriteLine("Patched "+name+": numeric reader now recognizes both Xbox and Windows bank byte order.");
              }
              assembly.Write(target+".patched");
          }
          using(var check=AssemblyDefinition.ReadAssembly(target+".patched")) {
              foreach(var name in audioTypes) {
                  int count=check.MainModule.GetType("Microsoft.Xna.Framework.Audio."+name).Methods.Where(m=>m.HasBody)
                      .SelectMany(m=>m.Body.Instructions).Count(i=>i.OpCode==OpCodes.Newobj &&
                          i.Operand is MethodReference mr && mr.DeclaringType.FullName=="NexiaCMZLoader.XactEndianReader");
                  if(count!=1) throw new Exception("Patched reader verification failed for "+name);
              }
          }
          File.Move(target+".patched",target,true);
          Console.WriteLine("Verified app-local content bridge and three XACT reader call sites; original audio/game files remain outside this package.");
          ''', encoding="utf-8")
      - name: Write XactTests/XactTests.csproj
        shell: python
        run: |
          from pathlib import Path
          path = Path("xbox-cmz-services") / 'XactTests/XactTests.csproj'
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(r'''<Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net8.0</TargetFramework><OutputType>Exe</OutputType><ImplicitUsings>enable</ImplicitUsings><Nullable>disable</Nullable><EnableDefaultCompileItems>false</EnableDefaultCompileItems></PropertyGroup>
            <ItemGroup><Compile Include="Program.cs"/><Compile Include="../XactCompatibility.cs" Link="XactCompatibility.cs"/><Compile Include="../XactSoundBank.cs" Link="XactSoundBank.cs"/></ItemGroup>
          </Project>
          ''', encoding="utf-8")
      - name: Write XactTests/Program.cs
        shell: python
        run: |
          from pathlib import Path
          path = Path("xbox-cmz-services") / 'XactTests/Program.cs'
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(r'''// Cloud-side unit tests for the same reader and PCM converter compiled into the UWP app.
          // Inputs here are synthetic. No game file is downloaded, uploaded or executed by these tests.
          using System;
          using System.IO;
          using System.Linq;
          using System.Text;
          using NexiaCMZLoader;
          static void Require(bool ok,string why) { if(!ok) throw new Exception("FAIL: "+why); }
          static void Number(MemoryStream m,byte[] bytes,bool big) {
              if(big==BitConverter.IsLittleEndian) Array.Reverse(bytes); m.Write(bytes,0,bytes.Length);
          }
          foreach(bool big in new[]{false,true}) {
              using var stream=new MemoryStream();
              byte[] tag=Encoding.ASCII.GetBytes(big?"FSGX":"XGSF");stream.Write(tag,0,tag.Length);
              Number(stream,BitConverter.GetBytes((ushort)46),big);
              Number(stream,BitConverter.GetBytes((short)-1234),big);
              Number(stream,BitConverter.GetBytes(0x12345678u),big);
              Number(stream,BitConverter.GetBytes(-7654321),big);
              Number(stream,BitConverter.GetBytes(0x0102030405060708ul),big);
              Number(stream,BitConverter.GetBytes(-9223372036854770000L),big);
              Number(stream,BitConverter.GetBytes(0.625f),big);
              Number(stream,BitConverter.GetBytes(-17.125),big);
              stream.Write(new byte[]{3,65,66,67,0xff,0x00},0,6);stream.Position=0;
              using BinaryReader reader=new XactEndianReader(stream);
              Require(reader.ReadUInt32()==0x46534758,"XGS magic");
              Require(reader.ReadUInt16()==46 && reader.ReadInt16()==-1234,"16-bit values");
              Require(reader.ReadUInt32()==0x12345678u && reader.ReadInt32()==-7654321,"32-bit values");
              Require(reader.ReadUInt64()==0x0102030405060708ul && reader.ReadInt64()==-9223372036854770000L,"64-bit values");
              Require(reader.ReadSingle()==0.625f && reader.ReadDouble()==-17.125,"floating point");
              Require(reader.ReadString()=="ABC" && reader.ReadByte()==0xff && reader.ReadByte()==0,"strings and raw bytes are not reversed");
              bool truncated=false;try{reader.ReadInt32();}catch(EndOfStreamException){truncated=true;}
              Require(truncated,"truncated fields must fail");
              Console.WriteLine("PASS reader virtual dispatch, all number widths, string/raw bytes, truncation: "+(big?"BE":"LE"));
          }
          foreach(var pair in new[]{("KBDS",0x4b424453u),("SDBK",0x4b424453u),("DNBW",0x444e4257u),("WBND",0x444e4257u)}) {
              using var reader=new XactEndianReader(new MemoryStream(Encoding.ASCII.GetBytes(pair.Item1)));
              Require(reader.ReadUInt32()==pair.Item2,"bank magic "+pair.Item1);
          }
          static void Be(byte[] d,int p,uint n) { d[p]=(byte)(n>>24);d[p+1]=(byte)(n>>16);d[p+2]=(byte)(n>>8);d[p+3]=(byte)n; }
          static byte[] Bank() {
              var d=new byte[180]; Encoding.ASCII.GetBytes("DNBW").CopyTo(d,0);Be(d,4,46);Be(d,8,44);
              Be(d,12,52);Be(d,16,96);Be(d,20,148);Be(d,24,24);Be(d,44,172);Be(d,48,8);
              Be(d,56,1);Be(d,124,24);Be(d,132,4);
              Be(d,148,4u<<4);Be(d,152,0x80000000u|(2u<<23)|(44100u<<5)|(1u<<2));
              Be(d,156,0);Be(d,160,8);
              new byte[]{0x12,0x34,0x7f,0xff,0x80,0x00,0xab,0xcd}.CopyTo(d,172);return d;
          }
          var original=Bank();var backup=(byte[])original.Clone();
          var result=XactWaveBank.Normalize(original,"synthetic",null);
          Require(original.SequenceEqual(backup),"input changed");
          Require(result.Take(172).SequenceEqual(original.Take(172)),"metadata was altered");
          Require(result.Skip(172).SequenceEqual(new byte[]{0x34,0x12,0xff,0x7f,0x00,0x80,0xcd,0xab}),"PCM16 sample swapping");
          Console.WriteLine("PASS PCM16 conversion; original input and metadata preserved");
          var compressed=Bank();Be(compressed,152,3u|(99u<<23)|(44100u<<5)|(1u<<2));
          Require(XactWaveBank.Normalize(compressed,"compressed",null).SequenceEqual(compressed),"compressed data must not be interpreted as PCM");
          var pcm8=Bank();Be(pcm8,152,(1u<<23)|(44100u<<5)|(1u<<2));Be(pcm8,148,8u<<4);
          Require(XactWaveBank.Normalize(pcm8,"pcm8",null).SequenceEqual(pcm8),"PCM8 changed");
          foreach(Action<byte[]> damage in new Action<byte[]>[]{d=>Be(d,160,9),d=>Be(d,148,5u<<4),d=>Be(d,168,5),d=>Be(d,52,0x20000)}) {
              var bad=Bank();damage(bad);bool rejected=false;
              try{XactWaveBank.Normalize(bad,"invalid",null);}catch(InvalidDataException){rejected=true;}catch(NotSupportedException){rejected=true;}
              Require(rejected,"malformed XWB was accepted");
          }
          bool badMagic=false;try{using var r=new XactEndianReader(new MemoryStream(new byte[]{1,2,3,4}));}catch(InvalidDataException){badMagic=true;}
          Require(badMagic,"unknown header accepted");
          Console.WriteLine("PASS compression/PCM8 preservation, boundaries, durations, loops, compact-bank and bad-magic guards");
          // Test packed XSB name length and variation count/flags independently of ordinary numbers.
          var sb=new byte[192];Encoding.ASCII.GetBytes("KBDS").CopyTo(sb,0);
          sb[5]=46;sb[7]=43;sb[22]=1;sb[26]=1;sb[27]=1;sb[29]=1;
          Be(sb,30,5);Be(sb,38,138);Be(sb,42,153);Be(sb,50,160);Be(sb,58,74);Be(sb,70,180);
          sb[74]=83;sb[138]=1;Be(sb,139,160);Encoding.ASCII.GetBytes("test\0").CopyTo(sb,153);
          Be(sb,160,(11u<<16)|1);Be(sb,168,180);sb[173]=255;
          var sbOriginal=(byte[])sb.Clone();var adapted=XactSoundBank.Normalize(sb,null);
          Require(sb.SequenceEqual(sbOriginal),"XSB original changed");
          Require(adapted[30]==0 && adapted[31]==5 && adapted[32]==0 && adapted[33]==0,"XSB name length");
          Require(adapted[160]==0 && adapted[161]==1 && adapted[162]==0 && adapted[163]==11,"XSB variation packed halves");
          for(int i=0;i<sb.Length;i++) if(!(i>=30 && i<34) && !(i>=160 && i<164)) Require(sb[i]==adapted[i],"XSB unrelated data changed");
          using(var r=new XactEndianReader(new MemoryStream(adapted))) {
              r.BaseStream.Position=30;Require(r.ReadUInt16()==5 && r.ReadUInt16()==0,"XSB paired name-length reads");
              r.BaseStream.Position=160;Require(r.ReadUInt16()==1 && r.ReadUInt16()==11,"XSB paired variation reads");
          }
          var invalidSb=(byte[])sb.Clone();Be(invalidSb,30,65536);bool sbRejected=false;
          try { XactSoundBank.Normalize(invalidSb,null); } catch(NotSupportedException) { sbRejected=true; }
          Require(sbRejected,"XSB oversized name table accepted");
          Console.WriteLine("PASS packed XSB field layout, virtual paired reads, source preservation and bounds");
          Console.WriteLine("XACT UNIT TESTS PASSED (synthetic data on build machine, not Xbox playback)");
          namespace NexiaCMZLoader { public static class StartupHooks { public static void Once(string text) {} } }
          ''', encoding="utf-8")
      - name: Write README.txt
        shell: python
        run: |
          from pathlib import Path
          path = Path("xbox-cmz-services") / 'README.txt'
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(r'''CMZ ORIGINAL STARTUP 0.8 - XACT / TRIAL QUERY UPDATE

          User action now: replace the contents of .github/workflows/xbox-cmz-startup.yml.
          Do not rename the file or create another workflow. Install nothing until its build passes
          and the signed package and dependencies have been inspected.

          Observed baseline on the user's Xbox
          - Original constructor, Debug font LoadContent, and Initialize completed in 0.7.2.
          - SecondaryLoad stopped on XGS format not recognized while opening Sounds.xgs.
          - Update also stopped at this prototype's unimplemented Guide.IsTrialMode getter.

          This update
          - Adapts the XSB packed cue-name length and variation count/flags to the pinned reader.
            Its clip-event guard accepts the basic wave events present in this specific original bank.
          - Recognizes Xbox big-endian and Windows little-endian XGS/XSB/XWB numeric fields.
          - Patches the private copy of MonoGame's three XACT readers, not shared Microsoft runtimes.
          - Normalizes 16-bit PCM audio samples in app-memory copies with bounds/loop/overlap checks.
            Original input archives and extracted audio files remain unchanged.
          - Reads compressed bank metadata, but DOES NOT implement WMA/XMA decoding or streaming playback.
            MonoGame UWP's streaming implementation still throws when playback of such a track is requested.
          - Makes Guide.IsTrialMode explicitly true for a trial-only development host. This is a test
            policy, not Xbox license verification, and does not unlock the full game. Other unimplemented
            guide/avatar/online APIs remain guarded. No license or trial check is patched out of the game.
          - Logs successful XACT constructor returns separately from actual playback.

          Build/test scope
          The build first runs XactTests (net8.0), using the same reader and converter source with
          synthetic little-/big-endian fields and tiny wave banks. The test tool is not included in the
          Xbox package. Packaging verifies the three edited reader call sites. The UWP build and Xbox
          startup still need to run; local Python checks do not establish C# execution or playback.

          Installation after a successful build
          This remains Name=NexiaCMZLoader, Publisher=CN=NexiaCMZLoader, with version 0.8.<run>.0.
          Keep the current loader installed. Close it and use Device Portal to install the update.
          Retain Game mode. Do not uninstall the app or replace shared runtime dependencies on an error.
          Keep the SAME two files in its LocalState:
            CastleMinerZ-assemblies.zip
            CastleMinerZ-startup-content.zip
          There is no new game ZIP to download or upload for 0.8. Do not publish these ZIPs on GitHub.

          Launch once, then return the screen, cmz-startup-log.txt and cmz-loader-log.txt from LocalState.
          Logs reset on launch. A new exception is a compatibility result, not an instruction to reinstall.
          Original shaders/models/avatars, physical local-player integration and split-screen remain
          separate work. Two-controller shared-world couch co-op is still a project target, not implemented.
          ''', encoding="utf-8")
