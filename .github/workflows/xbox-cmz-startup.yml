          were decompressed locally with libarchive's LZX decoder, via a generated in-memory CAB.
          98 standalone Texture2D and SpriteFont embedded texture payloads were byte-swapped and
          rewrapped uncompressed for the Windows reader. Numeric XNB data remains little-endian.
          Other XNBs keep their original encoding and will throw an explicit conversion-required
          error if requested. Original XACT files are also not converted; audio bank decoding is
