      - name: Write EffectChecks11/verify_water.py (1/1)
        shell: python
        run: |
          from pathlib import Path
          path = Path('xbox-cmz-services') / 'EffectChecks11/verify_water.py'
          path.parent.mkdir(parents=True, exist_ok=True)
          with path.open('w', encoding='utf-8', newline='') as output:
              output.write(r'''"""Water-specific contract using the validated MGFX-v10 reader from 0.10. No GPU execution."""
          import json,sys
          from pathlib import Path
          sys.path.insert(0,str(Path(__file__).resolve().parents[1]/'EffectChecks10'))
          from verify_effect import inspect
          
          def verify(data, contract):
              result=inspect(data); ps={p['name']:p for p in result['parameters']}
              if len(ps)!=len(result['parameters']):raise ValueError('Duplicate effect parameters')
              for name,wants in contract['parameters'].items():
                  if name not in ps:raise ValueError('Missing/optimized-out water parameter: '+name)
                  p=ps[name]
                  for key,want in wants.items():
                      got=len(p['elements']) if key=='elements' else p[key]
                      if got!=want:raise ValueError(f'Water parameter {name}: {key} {got} != {want}')
              if result['techniques']!=contract['techniques']:raise ValueError('Water technique/pass indexing changed')
              for s in result['shaders']:
                  if s['vertex']:
                      sig={(v['name'],v['index']):v for v in s['inputs']}
                      if set(sig)!={('POSITION',0)}:raise ValueError('Water requires POSITION0 only')
                      if sig[('POSITION',0)]['component']!=3 or sig[('POSITION',0)]['mask']!=7:
                          raise ValueError('Water input must be float3, matching original PositionVX')
              return result
          if __name__=='__main__':
              result=verify(Path(sys.argv[1]).read_bytes(),json.loads(Path(sys.argv[2]).read_text()))
              print('PASS: Water MGFX-v10 DirectX; 12 typed parameters; two techniques with surface/well passes; float3 POSITION0.')
              print('This validates bytecode metadata, NOT original visual equivalence, Xbox drawing, or a playable world.')
          ''')
      - name: Write Effects11/WaterEffect.fx (1/1)
        shell: python
        run: |
          from pathlib import Path
          path = Path('xbox-cmz-services') / 'Effects11/WaterEffect.fx'
          path.parent.mkdir(parents=True, exist_ok=True)
          with path.open('w', encoding='utf-8', newline='') as output:
              output.write(r'''// Original experimental water-shader reimplementation for the observed WaterPlane CPU interface.
          // NOT a translation of Xbox GPU microcode. Waves, lighting, depth tint, reflection distortion and
          // opacity are provisional. Original code still chooses above/below-water techniques and draws geometry.
          float4x4 World;
          float4x4 View;
          float4x4 Projection;
          float4x4 Reflection;
          float Time;
          float3 LightDirection;
          float3 SunLightColor;
          float3 TorchLightColor;
          float3 EyePos;
          float3 WaterColor;
          texture2D NormalTexture;
          texture2D ReflectionTexture;
          sampler2D NormalSampler = sampler_state { Texture=<NormalTexture>; MinFilter=Linear; MagFilter=Linear; MipFilter=Linear; AddressU=Wrap; AddressV=Wrap; };
          sampler2D ReflectionSampler = sampler_state { Texture=<ReflectionTexture>; MinFilter=Linear; MagFilter=Linear; MipFilter=Linear; AddressU=Clamp; AddressV=Clamp; };
          struct Input { float3 Position : POSITION0; };
          struct Output {
              float4 Position : SV_Position;
              float3 WorldPos : TEXCOORD0;
              float4 ReflectionPos : TEXCOORD1;
              float Depth : TEXCOORD2;
          };
          Output WaterVS(Input v) {
              Output o;
              float4 world = mul(float4(v.Position,1),World);
              o.WorldPos=world.xyz;
              o.Position=mul(mul(world,View),Projection);
              o.ReflectionPos=mul(mul(world,Reflection),Projection);
              o.Depth=max(0,-v.Position.y);
              return o;
          }
          float3 NormalAt(float3 world) {
              float2 uv=world.xz*0.025;
              float3 a=tex2D(NormalSampler,uv+Time*float2(0.016,0.011)).xyz*2-1;
              float3 b=tex2D(NormalSampler,uv*0.73+Time*float2(-0.009,0.014)).xyz*2-1;
              return normalize(float3(a.x+b.x,max(0.15,a.z+b.z),a.y+b.y));
          }
          float3 Lighting(float3 normal, float3 eyeDirection) {
              float3 light=normalize(LightDirection+float3(0,0.0001,0));
              float diffuse=saturate(dot(normal,light));
              float specular=pow(saturate(dot(reflect(-light,normal),eyeDirection)),48);
              return WaterColor*(0.48+0.52*diffuse)+TorchLightColor*0.12+SunLightColor*specular*0.65;
          }
          float4 SurfaceAbove(Output i) : SV_Target0 {
              float3 normal=NormalAt(i.WorldPos);
              float3 viewDirection=normalize(EyePos-i.WorldPos+float3(0,0.0001,0));
              float fresnel=0.04+0.76*pow(1-saturate(abs(dot(normal,viewDirection))),5);
              float w=max(abs(i.ReflectionPos.w),0.0001);
              float2 uv=i.ReflectionPos.xy/w*float2(0.5,-0.5)+0.5+normal.xz*0.018;
              float3 reflected=tex2D(ReflectionSampler,saturate(uv)).rgb;
              float3 color=lerp(Lighting(normal,viewDirection),reflected,fresnel);
              float alpha=lerp(0.60,0.96,fresnel);
              return float4(saturate(color)*alpha,alpha); // game's AlphaBlend expects premultiplied color
          }
          float4 SurfaceBelow(Output i) : SV_Target0 {
              float3 normal=-NormalAt(i.WorldPos);
              float3 viewDirection=normalize(EyePos-i.WorldPos+float3(0,0.0001,0));
              return float4(saturate(Lighting(normal,viewDirection)),1);
          }
          float4 WellAbove(Output i) : SV_Target0 {
              float depth=saturate(i.Depth/64);
              float alpha=lerp(0.58,0.95,depth);
              float3 color=WaterColor*lerp(0.70,0.16,depth)+TorchLightColor*0.06;
              return float4(saturate(color)*alpha,alpha);
          }
          float4 WellBelow(Output i) : SV_Target0 {
              float depth=saturate(i.Depth/64);
              return float4(saturate(WaterColor*lerp(0.70,0.16,depth)+TorchLightColor*0.06),1);
          }
          // Observed indexing: technique 0 above water, technique 1 below water; pass 0 surface, pass 1 well.
          // Names are ours: the original WaterPlane indexes these entries, it does not request their names.
          technique Water {
              pass Surface { VertexShader=compile vs_4_0 WaterVS(); PixelShader=compile ps_4_0 SurfaceAbove(); }
              pass Well { VertexShader=compile vs_4_0 WaterVS(); PixelShader=compile ps_4_0 WellAbove(); }
          }
          technique Underwater {
              pass Surface { VertexShader=compile vs_4_0 WaterVS(); PixelShader=compile ps_4_0 SurfaceBelow(); }
              pass Well { VertexShader=compile vs_4_0 WaterVS(); PixelShader=compile ps_4_0 WellBelow(); }
          }
          ''')
      - name: Write FrameGpuWork.cs (1/1)
        shell: python
        run: |
          from pathlib import Path
          path = Path('xbox-cmz-services') / 'FrameGpuWork.cs'
          path.parent.mkdir(parents=True, exist_ok=True)
          with path.open('w', encoding='utf-8', newline='') as output:
              output.write(r'''// Original 0.11 code. GPU work is drained by the ORIGINAL game Draw thread, never a UI dispatcher.
          // The callback must restore graphics state before returning. No Present checks are disabled.
          using System;
          using System.Collections.Generic;
          using System.Threading;
          using System.Threading.Tasks;
          
          namespace NexiaCMZLoader {
              public static class FrameGpuWork {
                  private static readonly object Gate = new object();
                  private static readonly Queue<Request> Pending = new Queue<Request>();
                  private static readonly HashSet<Request> Outstanding = new HashSet<Request>();
                  private static Exception aborted;
                  private static int drawOwner;
                  [ThreadStatic] private static bool insideDraw;
                  public static bool IsInsideDraw { get { return insideDraw; } }
                  public static int PendingCount { get { lock(Gate) return Outstanding.Count; } }
          
                  private abstract class Request {
                      // 0 queued, 1 executing, 2 completed, 3 cancelled. Cancellation cannot revive work.
                      protected int state;
                      public abstract void Execute();
                      public abstract void Cancel(Exception reason);
                  }
                  private sealed class Request<T> : Request {
                      private readonly Func<T> callback;
                      private readonly Action<T> cleanup;
                      internal readonly TaskCompletionSource<T> Completion = new TaskCompletionSource<T>(TaskCreationOptions.RunContinuationsAsynchronously);
                      public Request(Func<T> callback, Action<T> cleanup) { this.callback=callback; this.cleanup=cleanup; }
                      public override void Execute() {
                          if(Interlocked.CompareExchange(ref state,1,0)!=0) return;
                          try {
                              T value=callback();
                              if(Interlocked.CompareExchange(ref state,2,1)==1) Completion.TrySetResult(value);
                              else if(cleanup!=null) cleanup(value); // result abandoned; dispose on the SAME Draw thread
                          } catch(Exception error) {
                              if(Interlocked.CompareExchange(ref state,2,1)==1) Completion.TrySetException(error);
                              else throw; // do not hide cleanup failure or failure after a cancelled running operation
                          }
                      }
                      public override void Cancel(Exception reason) {
                          while(true) {
                              int previous=Interlocked.CompareExchange(ref state,0,0);
                              if(previous==2 || previous==3) return;
                              if(Interlocked.CompareExchange(ref state,3,previous)==previous) {
                                  Completion.TrySetException(reason);return;
                              }
                          }
                      }
                  }
                  public static T Invoke<T>(string label, Func<T> callback, Action<T> cleanup = null, int timeoutMilliseconds = 30000) {
                      if(callback==null) throw new ArgumentNullException("callback");
                      if(timeoutMilliseconds<=0 || timeoutMilliseconds>120000) throw new ArgumentOutOfRangeException("timeoutMilliseconds");
                      Request<T> work;
                      lock(Gate) {
                          if(aborted!=null) throw new InvalidOperationException("Graphics work stopped: "+label,aborted);
                          if(insideDraw) work=null;
                          else {
                              if(Outstanding.Count>=64 || Pending.Count>=256) throw new InvalidOperationException("Graphics work queue limit reached.");
                              work=new Request<T>(callback,cleanup);Outstanding.Add(work);Pending.Enqueue(work);
                          }
                      }
                      if(work==null) return callback(); // nested content request already on the Draw thread
                      var finished=Task.WhenAny(work.Completion.Task,Task.Delay(timeoutMilliseconds)).GetAwaiter().GetResult();
                      if(finished!=work.Completion.Task) {
                          work.Cancel(new TimeoutException("Timed out waiting for original Draw: "+label));
                          lock(Gate) Outstanding.Remove(work);
                      }
                      return work.Completion.Task.GetAwaiter().GetResult();
                  }
                  public static void EnterDraw() {
                      int id=Thread.CurrentThread.ManagedThreadId;
                      if(insideDraw || Interlocked.CompareExchange(ref drawOwner,id,0)!=0)
                          throw new InvalidOperationException("Overlapping/reentrant original Draw is not supported.");
                      insideDraw=true;
                      Request[] batch;
                      lock(Gate) { batch=Pending.ToArray();Pending.Clear(); }
                      // One bounded snapshot; a request enqueued during this frame waits for the next frame.
                      // All work is SYNCHRONOUS here, before original Draw/EndDraw/Present.
                      foreach(var request in batch) {
                          try { request.Execute(); }
                          finally { lock(Gate) Outstanding.Remove(request); }
                      }
                  }
                  public static void ExitDraw() {
                      if(!insideDraw) return; // catch may run before EnterDraw acquired ownership
                      insideDraw=false;
                      Interlocked.Exchange(ref drawOwner,0);
                  }
                  public static void AssertInsideDraw() {
                      if(!insideDraw || Interlocked.CompareExchange(ref drawOwner,0,0)!=Thread.CurrentThread.ManagedThreadId)
                          throw new InvalidOperationException("GPU operation attempted outside original Draw ownership.");
                  }
                  public static void Abort(Exception reason) {
                      Request[] requests;
                      lock(Gate) {
                          if(aborted==null) aborted=reason??new InvalidOperationException("Startup stopped.");
                          requests=new Request[Outstanding.Count];Outstanding.CopyTo(requests);
                          Outstanding.Clear();Pending.Clear();reason=aborted;
                      }
                      foreach(var request in requests) request.Cancel(reason);
                  }
              }
          }
          ''')
