                  }
                  [StructLayout(LayoutKind.Sequential,Pack=1)]
                  private struct PackedVertex:IVertexType {
                      public uint LocationTile, AoSunLampFace;
                      public PackedVertex(byte x,byte y,byte z,int corner){LocationTile=(uint)(x|(y<<8)|(z<<16));AoSunLampFace=(uint)((255<<8)|((1|(corner<<4))<<24));}
                      public VertexDeclaration VertexDeclaration {get{return Declaration;}}
                      internal static readonly VertexDeclaration Declaration=new VertexDeclaration(new VertexElement(0,VertexElementFormat.Byte4,VertexElementUsage.Color,0),new VertexElement(4,VertexElementFormat.Byte4,VertexElementUsage.Color,1));
