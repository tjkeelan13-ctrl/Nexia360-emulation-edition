                      var calls=method.Body.Instructions.Where(i=>i.OpCode==OpCodes.Call).Select(i=>(MethodReference)i.Operand).ToArray();
                      if(calls.Length!=1 || calls[0].Name!="Begin" || calls[0].DeclaringType.FullName!=G+"SpriteBatch" || calls[0].Parameters.Count!=7)
                          throw new InvalidOperationException("SpriteBatch forwarding verification failed.");
                  }
                  var wave=module.GetType("Microsoft.Xna.Framework.Audio.WaveBank");
                  var constructor=wave.Methods.Single(m=>m.IsConstructor && !m.IsStatic && m.Parameters.Count==4);
                  var invoke=constructor.Body.Instructions.Where(i=>i.OpCode==OpCodes.Call).Select(i=>(MethodReference)i.Operand).ToArray();
