# Generator size gate: <=450000 bytes; whole-source compression preserves every file.
# CMZ 1.6.3 native torch materials, normal Draw state recovery and first-error diagnostics; Windows/Xbox verification pending.
# Existing location: .github/workflows/xbox-cmz-startup.yml, branch Mousehook.
# Hash-pinned public source only. Keep CastleMinerZ-1.6.3-input.zip private.
name: Xbox - CastleMiner Z 1.6.3

on:
  workflow_dispatch:
  push:
    branches: [Mousehook]
    paths:
      - '.github/workflows/xbox-cmz-startup.yml'
permissions:
  contents: read
concurrency:
  group: xbox-cmz-startup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Materialize the CMZ 1.6.3 compatibility source
        shell: python
        run: |
          import base64, hashlib, io, lzma, zipfile
          from pathlib import Path, PurePosixPath
          encoded = """
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          HNocrQhjL3/tsT0ioKP/uyIqBk/NI11FIpSNHZ/PNELCwSKq4JIaGNieDUYJjsnhIw9H1HMAyTsvFyrMwKpFSIR5FKGWCBqID9TzDhdfe/gCe8RiMz763/WOU2eUYADjonogru4AWZqifZ50WscAAaSvE82NYnKU5UWxxGf7AgAAAAAEWVo="""
          packed = base64.b64decode(encoded, validate=False)
          if hashlib.sha256(packed).hexdigest() != "7c29a6812eb7d1ed9f965e5d8e576b5070f4f6f77b630c4abb9a69141460cf1d":
              raise RuntimeError("CMZ 1.6.3 compressed source digest mismatch")
          raw = lzma.decompress(packed, format=lzma.FORMAT_XZ, memlimit=64*1024*1024)
          if len(raw) != 1607373 or hashlib.sha256(raw).hexdigest() != "ef562814d867fddfcb04a47497890328f6fee526a4ee01efb4d0961de757d6cb":
              raise RuntimeError("CMZ 1.6.3 extracted source digest mismatch")
          root = Path("xbox-cmz-services")
          root.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              entries = archive.infolist()
              if len(entries) != 188 or sum(e.file_size for e in entries) > 8*1024*1024:
                  raise RuntimeError("Unexpected saved source inventory")
              seen = set()
              for entry in entries:
                  name = PurePosixPath(entry.filename)
                  if name.is_absolute() or not name.parts or ".." in name.parts or "\\" in entry.filename or ":" in entry.filename or entry.filename in seen:
                      raise RuntimeError("Unsafe or duplicate source path")
                  seen.add(entry.filename)
                  output = root.joinpath(*name.parts)
                  output.parent.mkdir(parents=True, exist_ok=True)
                  output.write_bytes(archive.read(entry))
          print("Materialized CMZ 1.6.3 compatibility source: 188 public files. Private original game content is imported only on the console.")

      - name: Run regression suites, compile effects and app, sign only after success
        shell: pwsh
        env:
          PROBE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/xbox-cmz-services/build.ps1", [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          ./xbox-cmz-services/build.ps1 -BuildNumber ([int]$env:PROBE_BUILD_NUMBER)

      - name: Upload checked installer or failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: XboxCMZ163-x64-${{ github.run_number }}
          path: xbox-cmz-services/out/
          retention-days: 7
          if-no-files-found: warn
