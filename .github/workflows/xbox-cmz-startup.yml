          from pathlib import Path
          path = Path('xbox-cmz-services') / 'VALIDATION10.json'
          path.parent.mkdir(parents=True, exist_ok=True)
          with path.open('w', encoding='utf-8', newline='') as output:
              output.write(r'''{
            "version": "0.10 prepared source (not compiled)",
            "baseline_workflow_sha256": "53fee2172804887ee8d95c889b93b50e32bd90de20ec486fbc78c8a9fd16834c",
            "baseline_source_blocks_verified": 19,
            "python_effect_parser_real_resources": [
