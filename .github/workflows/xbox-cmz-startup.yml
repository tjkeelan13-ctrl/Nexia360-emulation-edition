          with path.open('w', encoding='utf-8', newline='') as output:
              output.write(r'''// Patch only the app-local unsigned MonoGame copy, then validate it before packaging.
          using Mono.Cecil;
          using Mono.Cecil.Cil;
          if(args.Length!=1) throw new ArgumentException("Expected unpacked package directory");
          string directory=Path.GetFullPath(args[0]);
          string target=Path.Combine(directory,"MonoGame.Framework.dll");
          string managedPath=Path.Combine(directory,"entrypoint","NexiaCMZLoader.exe");
          if(!File.Exists(managedPath)) throw new FileNotFoundException("Managed UWP payload is missing",managedPath);
          using var app=AssemblyDefinition.ReadAssembly(managedPath);
          if(app.Name.Name!="NexiaCMZLoader") throw new InvalidDataException("Unexpected app identity");
          var terrainResource=app.MainModule.Resources.SingleOrDefault(r=>r.Name=="NexiaCMZLoader.Effects10.BlockEffect.mgfxo") as EmbeddedResource;
          if(terrainResource==null)throw new InvalidDataException("Compiled terrain effect missing from managed entrypoint resources.");
          var terrainBytes=terrainResource.GetResourceData();
          if(terrainBytes.Length<16 || terrainBytes.Length>8*1024*1024 ||
             terrainBytes[0]!=77 || terrainBytes[1]!=71 || terrainBytes[2]!=70 || terrainBytes[3]!=88 || terrainBytes[4]!=10 || terrainBytes[5]!=1)
              throw new InvalidDataException("Packaged terrain effect is not MGFX v10 DirectX.");
          Console.WriteLine("Verified embedded experimental terrain shader: "+terrainBytes.Length+" bytes; not original Xbox microcode.");
          var waterResource=app.MainModule.Resources.SingleOrDefault(r=>r.Name=="NexiaCMZLoader.Effects11.WaterEffect.mgfxo") as EmbeddedResource;
          if(waterResource==null)throw new InvalidDataException("Compiled water effect missing from managed app resources.");
          var waterBytes=waterResource.GetResourceData();
          if(waterBytes.Length<16 || waterBytes.Length>8*1024*1024 ||
             waterBytes[0]!=77 || waterBytes[1]!=71 || waterBytes[2]!=70 || waterBytes[3]!=88 || waterBytes[4]!=10 || waterBytes[5]!=1)
              throw new InvalidDataException("Water effect is not MGFX-v10 DirectX.");
          Console.WriteLine("Verified embedded experimental water shader: "+waterBytes.Length+" bytes; not original Xbox microcode.");
          var queue=app.MainModule.GetType("NexiaCMZLoader.FrameGpuWork")??throw new Exception("Draw-thread queue missing");
          if(!queue.IsPublic)throw new Exception("Draw-thread queue must be public for retargeted game calls");
          foreach(var item in new[]{("Enter","EnterDraw"),("Returned","ExitDraw"),("Stop","ExitDraw"),("Stop","Abort")}) {
              var h=app.MainModule.GetType("NexiaCMZLoader.StartupHooks").Methods.Single(m=>m.Name==item.Item1);
              if(!h.Body.Instructions.Any(i=>i.Operand is MethodReference mr && mr.DeclaringType.FullName==queue.FullName && mr.Name==item.Item2))
                  throw new Exception("Missing compiled Draw ownership hook: "+item);
          }
          foreach(var effectName in new[]{"TerrainEffectBridge","WaterEffectBridge"}) {
              var e=app.MainModule.GetType("NexiaCMZLoader."+effectName)??throw new Exception("Effect bridge missing");
              var create=e.Methods.Single(m=>m.Name=="Create");
              if(!create.Body.Instructions.Any(i=>i.Operand is MethodReference mr && mr.DeclaringType.FullName==queue.FullName && mr.Name=="Invoke"))
                  throw new Exception("Effect not routed through Draw-thread queue: "+effectName);
              if(e.Methods.Where(m=>m.HasBody).SelectMany(m=>m.Body.Instructions).Any(i=>i.Operand is MethodReference mr && mr.DeclaringType.FullName.Contains("CoreDispatcher")))
                  throw new Exception("Unsafe UI-dispatch path remains in "+effectName);
          }
          Console.WriteLine("Verified compiled Draw ownership/cancellation hooks and queued terrain/water effects. Present is NOT bypassed.");
          var bridge=app.MainModule.GetType("NexiaCMZLoader.StartupFiles")??throw new Exception("Host stream bridge missing");
          var hostMethod=bridge.Methods.Single(m=>m.Name=="OpenTitleStream" && m.IsPublic && m.IsStatic && m.Parameters.Count==1);
          var readerType=app.MainModule.GetType("NexiaCMZLoader.XactEndianReader")??throw new Exception("XACT reader missing");
          if(!readerType.IsPublic || readerType.BaseType.FullName!="System.IO.BinaryReader") throw new Exception("Unexpected XACT reader base");
          readerType.Methods.Single(m=>m.IsConstructor && m.IsPublic && !m.IsStatic && m.Parameters.Count==1 && m.Parameters[0].ParameterType.FullName=="System.IO.Stream");
          var hooksType=app.MainModule.GetType("NexiaCMZLoader.StartupHooks")??throw new Exception("Startup hooks missing");
          hooksType.Methods.Single(m=>m.Name=="Once" && m.IsPublic && m.IsStatic && m.Parameters.Count==1);
          string[] audioTypes={"AudioEngine","SoundBank","WaveBank"};
          using(var assembly=AssemblyDefinition.ReadAssembly(target)) {
              var module=assembly.MainModule;
              var reference=new AssemblyNameReference(app.Name.Name,app.Name.Version);
              module.AssemblyReferences.Add(reference);
              var type=module.GetType("Microsoft.Xna.Framework.TitleContainer")??throw new Exception("MonoGame TitleContainer missing");
              var method=type.Methods.Single(m=>m.Name=="OpenStream" && m.IsPublic && m.IsStatic && m.Parameters.Count==1 && m.Parameters[0].ParameterType.FullName=="System.String");
              if(method.ReturnType.FullName!="System.IO.Stream") throw new Exception("Unexpected stream signature");
              var declaring=new TypeReference("NexiaCMZLoader","StartupFiles",module,reference);
              var call=new MethodReference(hostMethod.Name,method.ReturnType,declaring){HasThis=false};
              call.Parameters.Add(new ParameterDefinition(module.TypeSystem.String));
              method.Body=new MethodBody(method);
              var il=method.Body.GetILProcessor();il.Emit(OpCodes.Ldarg_0);il.Emit(OpCodes.Call,call);il.Emit(OpCodes.Ret);
              var hook=new MethodReference("Once",module.TypeSystem.Void,new TypeReference("NexiaCMZLoader","StartupHooks",module,reference)){HasThis=false};
              hook.Parameters.Add(new ParameterDefinition(module.TypeSystem.String));
              foreach(string name in audioTypes) {
                  var audio=module.GetType("Microsoft.Xna.Framework.Audio."+name)??throw new Exception("Missing XACT type "+name);
                  int patches=0;
                  foreach(var constructor in audio.Methods.Where(m=>m.IsConstructor && !m.IsStatic && m.HasBody)) {
                      bool changed=false;
                      foreach(var instruction in constructor.Body.Instructions) {
                          if(instruction.OpCode!=OpCodes.Newobj || instruction.Operand is not MethodReference ctor ||
                              ctor.DeclaringType.FullName!="System.IO.BinaryReader") continue;
                          if(ctor.Parameters.Count!=1 || ctor.Parameters[0].ParameterType.FullName!="System.IO.Stream")
                              throw new Exception("Unexpected BinaryReader constructor in "+name);
                          var adapted=new MethodReference(".ctor",module.TypeSystem.Void,
                              new TypeReference("NexiaCMZLoader","XactEndianReader",module,reference)){HasThis=true};
                          adapted.Parameters.Add(new ParameterDefinition(ctor.Parameters[0].ParameterType));
                          instruction.Operand=adapted;patches++;changed=true;
                      }
                      if(changed) {
                          var editor=constructor.Body.GetILProcessor();
                          foreach(var ret in constructor.Body.Instructions.Where(i=>i.OpCode==OpCodes.Ret).ToArray()) {
                              // Existing branches still land on the original instruction, now the log message.
                              ret.OpCode=OpCodes.Ldstr;ret.Operand="XACT "+name+" constructor returned (not playback verification).";
                              var invoke=Instruction.Create(OpCodes.Call,hook);editor.InsertAfter(ret,invoke);
                              editor.InsertAfter(invoke,Instruction.Create(OpCodes.Ret));
                          }
                      }
                  }
                  if(patches!=1) throw new Exception("Expected one reader construction in "+name+", found "+patches);
                  Console.WriteLine("Patched "+name+": numeric reader now recognizes both Xbox and Windows bank byte order.");
              }
              var musicPolicy=app.MainModule.GetType("NexiaCMZLoader.ResidentMusicPolicy")??throw new Exception("Resident music policy missing");
              var policy=musicPolicy.Methods.Single(m=>m.Name=="ValidateRequest" && m.IsStatic && m.IsPublic);
              var guard=new MethodReference(policy.Name,module.TypeSystem.Void,
                  new TypeReference("NexiaCMZLoader","ResidentMusicPolicy",module,reference)){HasThis=false};
              guard.Parameters.Add(new ParameterDefinition(module.TypeSystem.String));
              guard.Parameters.Add(new ParameterDefinition(module.TypeSystem.Int32));
              guard.Parameters.Add(new ParameterDefinition(module.TypeSystem.Int16));
              Startup09Patcher.Apply(module,guard);
              assembly.Write(target+".patched");
          }
          using(var check=AssemblyDefinition.ReadAssembly(target+".patched")) {
              Startup09Patcher.Verify(check.MainModule);
              foreach(var name in audioTypes) {
                  int count=check.MainModule.GetType("Microsoft.Xna.Framework.Audio."+name).Methods.Where(m=>m.HasBody)
                      .SelectMany(m=>m.Body.Instructions).Count(i=>i.OpCode==OpCodes.Newobj &&
                          i.Operand is MethodReference mr && mr.DeclaringType.FullName=="NexiaCMZLoader.XactEndianReader");
                  if(count!=1) throw new Exception("Patched reader verification failed for "+name);
              }
          }
          File.Move(target+".patched",target,true);
          Console.WriteLine("Verified app-local content bridge and three XACT reader call sites; original audio/game files remain outside this package.");
          ''')
