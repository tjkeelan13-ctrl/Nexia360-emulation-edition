          using Microsoft.Xna.Framework;
          using Microsoft.Xna.Framework.Graphics;
          namespace NexiaCMZLoader {
              public static class TerrainEffectBridge {
                  private static bool gpuChecked;
                  private static byte[] bytecode;
                  private static readonly string[] VectorNames={"WorldBase","SunLight","TorchLight","FogColor","AmbientSun","SunSpecular","LightDirection","EyePosition","EyeWaterConstants","BelowWaterColor","CubeScaleSunTorch"};
                  private static readonly string[] MatrixNames={"World","View","Projection","InverseWorld"};
                  private static readonly string[] TextureNames={"DiffuseAlphaTexture","NormalSpecTexture","MetalLightTexture","MipMapSpecularTexture","MipMapDiffuseTexture"};
                  private static readonly string[] TechniqueNames={"BlockAboveWaterTechnique","BlockBelowWaterTechnique","BlockNoWaterTechnique","EntityAboveWaterTechnique","EntityBelowWaterTechnique","EntityNoWaterTechnique"};
                  private static readonly string[][] PassNames={new[]{"SpecularMaterials","MetalMaterials","Reflections"},new[]{"SpecularMaterials","MetalMaterials"},new[]{"SpecularMaterials","MetalMaterials"},new[]{"SpecularMaterials","MetalMaterials","Reflections"},new[]{"SpecularMaterials","MetalMaterials"},new[]{"SpecularMaterials","MetalMaterials","SpecularUI","MetalUI"}};
                  public static bool IsBlockEffect(string name) {return name!=null && string.Equals(name.Replace('\\','/'),"Effects/BlockEffect",StringComparison.OrdinalIgnoreCase);}
                  public static Effect Create(IServiceProvider services) {
                      var graphics=services.GetService(typeof(IGraphicsDeviceService)) as IGraphicsDeviceService;
                      if(graphics==null || graphics.GraphicsDevice==null)throw new InvalidOperationException("No graphics device for terrain effect.");
                      return FrameGpuWork.Invoke("terrain effect creation/readback",()=>CreateOnGraphicsThread(graphics.GraphicsDevice),effect=>effect.Dispose());
                  }
                  private static Effect CreateOnGraphicsThread(GraphicsDevice device) {
                      FrameGpuWork.AssertInsideDraw();
                      if(bytecode==null) {
                          using(var stream=typeof(TerrainEffectBridge).GetTypeInfo().Assembly.GetManifestResourceStream("NexiaCMZLoader.Effects10.BlockEffect.mgfxo")) {
                              if(stream==null || stream.Length<16 || stream.Length>8*1024*1024)throw new InvalidDataException("Packaged compiled BlockEffect missing/invalid.");
                              using(var output=new MemoryStream()){stream.CopyTo(output);bytecode=output.ToArray();}
                          }
                      }
                      var effect=new Effect(device,bytecode);
                      try {
                          Validate(effect);
                          if(!gpuChecked){CheckPixels(device);gpuChecked=true;}
                          StartupHooks.Once("TERRAIN EFFECT: experimental HLSL reimplementation loaded; packed Byte4 geometry, texture bindings and six technique layouts retained. Original shader lighting/reflection/fog equivalence is NOT established.");
                          return effect;
                      } catch {effect.Dispose();throw;}
                  }
                  private static void Require(Effect effect,string name,EffectParameterClass kind,EffectParameterType type,int rows,int columns,int elements=0) {
                      var parameter=effect.Parameters[name];
                      if(parameter==null || parameter.ParameterClass!=kind || parameter.ParameterType!=type || (rows>=0 && parameter.RowCount!=rows) || (columns>=0 && parameter.ColumnCount!=columns) || parameter.Elements.Count!=elements)
                          throw new InvalidDataException("Compiled terrain effect parameter mismatch: "+name);
                  }
                  private static void Validate(Effect effect) {
                      foreach(var n in MatrixNames)Require(effect,n,EffectParameterClass.Matrix,EffectParameterType.Single,4,4);
                      foreach(var n in VectorNames)Require(effect,n,EffectParameterClass.Vector,EffectParameterType.Single,1,3);
                      foreach(var n in TextureNames)Require(effect,n,EffectParameterClass.Object,EffectParameterType.Texture2D,-1,-1);
                      Require(effect,"EnvMapTexture",EffectParameterClass.Object,EffectParameterType.Texture3D,-1,-1);
                      Require(effect,"WaterLevel",EffectParameterClass.Scalar,EffectParameterType.Single,1,1);
                      Require(effect,"WaterDepth",EffectParameterClass.Scalar,EffectParameterType.Int32,1,1);
                      Require(effect,"CubeTx",EffectParameterClass.Scalar,EffectParameterType.Int32,1,1,6);
                      Require(effect,"VertexUVs",EffectParameterClass.Vector,EffectParameterType.Single,1,4,4);
                      Require(effect,"FaceMatrices",EffectParameterClass.Matrix,EffectParameterType.Single,4,4,6);
                      if(effect.Techniques.Count!=6)throw new InvalidDataException("Terrain technique count changed.");
                      for(int i=0;i<6;i++) {
                          var tech=effect.Techniques[i];
                          if(tech.Name!=TechniqueNames[i] || tech.Passes.Count!=PassNames[i].Length)throw new InvalidDataException("Terrain technique/pass layout mismatch: "+i);
                          for(int j=0;j<PassNames[i].Length;j++)if(tech.Passes[j].Name!=PassNames[i][j])throw new InvalidDataException("Terrain pass order mismatch.");
                      }
                      StartupHooks.Once("TERRAIN EFFECT CONTRACT: required parameter types/arrays and six ordered technique/pass layouts verified on the installed graphics framework.");
                  }
                  [StructLayout(LayoutKind.Sequential,Pack=1)]
                  private struct PackedVertex:IVertexType {
                      public uint LocationTile, AoSunLampFace;
                      public PackedVertex(byte x,byte y,byte z,int corner){LocationTile=(uint)(x|(y<<8)|(z<<16));AoSunLampFace=(uint)((255<<8)|((1|(corner<<4))<<24));}
                      public VertexDeclaration VertexDeclaration {get{return Declaration;}}
                      internal static readonly VertexDeclaration Declaration=new VertexDeclaration(new VertexElement(0,VertexElementFormat.Byte4,VertexElementUsage.Color,0),new VertexElement(4,VertexElementFormat.Byte4,VertexElementUsage.Color,1));
