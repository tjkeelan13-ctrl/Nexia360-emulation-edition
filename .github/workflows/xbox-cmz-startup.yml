# Replace CODE ONLY in .github/workflows/xbox-cmz-startup.yml. Keep the filename unchanged.
# Original game/model/music/texture data belongs only in the Xbox app's private storage.
name: Xbox - CMZ Original Startup

on:
  workflow_dispatch:
  push:
    branches: [Mousehook]
    paths:
      - '.github/workflows/xbox-cmz-startup.yml'
permissions:
  contents: read
concurrency:
  group: xbox-cmz-startup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Recover pinned 0.11 sources
        shell: python
        run: |
          import hashlib, re, textwrap
          from urllib.request import urlopen
          url = ('https://raw.githubusercontent.com/tjkeelan13-ctrl/'
                 'Nexia360-emulation-edition/6fe65b8c36d9d906a6d12a395542f1c85bff3419/'
                 '.github/workflows/xbox-cmz-startup.yml')
          with urlopen(url, timeout=45) as response:
              data = response.read()
          if hashlib.sha256(data).hexdigest() != 'efc319f4aa1a925208f19f67e9b35e9b156d59e2b2c227a0022bd4b12cdbb4f0':
              raise RuntimeError('Pinned 0.11 source integrity mismatch')
          blocks = re.findall(r'(?m)^        shell: python\n        run: \|\n((?: {10}.*\n|\n)*)', data.decode('utf-8-sig'))
          if len(blocks) != 23:
              raise RuntimeError('Unexpected pinned 0.11 source-generation structure')
          for block in blocks:
              exec(compile(textwrap.dedent(block), 'verified-startup11-source', 'exec'), {})
          print('Recovered pinned 0.11 source; no original game/model data was downloaded.')
      - name: Apply original-model routing and visible failure summary
        shell: python
        run: |
          from pathlib import Path
          root=Path('xbox-cmz-services')
          def patch(name,before,after):
              p=root/name;s=p.read_text(encoding='utf8')
              if s.count(before)!=1:raise RuntimeError('Missing or ambiguous patch location: '+name+' / '+before[:90])
              p.write_text(s.replace(before,after,1),encoding='utf8')
          patch('ManagedProbe.csproj','<Compile Include="StartupFiles.cs" />','''<Compile Include="StartupFiles.cs" />
              <Compile Include="ModelArchive12.cs" />
              <Compile Include="ModelManifest12.cs" />
              <Compile Include="ModelContent12.cs" />''')
          patch('App.xaml.cs','TerrainMaterialFiles.Import(folder);','TerrainMaterialFiles.Import(folder); ModelContent12.Import(folder);')
          patch('StartupFiles.cs','''            return base.Load<T>(name);
                  }
                  protected override Stream OpenStream(string assetName) {''','''            ModelFileSpec12 modelSpec;
                      if(typeof(T)==typeof(Model) && ModelContent12.TrySpec(name,out modelSpec)) {
                          var model=FrameGpuWork.Invoke<Model>("Load original model "+name,()=>LoadModelOnDraw(name,modelSpec));
                          return (T)(object)model;
                      }
                      return base.Load<T>(name);
                  }
                  private Model LoadModelOnDraw(string name,ModelFileSpec12 spec) {
                      FrameGpuWork.AssertInsideDraw();
                      // Preserve the framework's shared-resource fixups and ContentManager-owned lifetime.
                      // Nested external texture reads happen on this same Draw thread.
                      var model=base.Load<Model>(name);
                      ModelContent12.ValidateLoaded(model,spec);
                      return model;
                  }
                  protected override Stream OpenStream(string assetName) {''')
          patch('StartupFiles.cs','''            var stream=File.OpenRead(converted??StartupFiles.ContentPath(assetName));''','''            var modelPath=ModelContent12.OverridePath(assetName);
                      if(modelPath!=null)StartupHooks.Once("LOAD converted original model: "+assetName+"; using original ModelReader and preserved external textures.");
                      var stream=File.OpenRead(modelPath??converted??StartupFiles.ContentPath(assetName));''')
          patch('build.ps1','''    & $msbuild "$root\\ManagedProbe.csproj" /restore''','''    & dotnet run --project "$root\\ModelTests12\\ModelTests12.csproj" --configuration Release 2>&1 | Tee-Object -FilePath "$out\\model-tests12.log"
              if ($LASTEXITCODE -ne 0) { throw '0.12 model importer/graph guard tests failed. No package will be published.' }
              & $msbuild "$root\\ManagedProbe.csproj" /restore''')
          patch('build.ps1','"0.11.$BuildNumber.0"','"0.12.$BuildNumber.0"')
          patch('build.ps1','NexiaCMZLoader_0.11.','NexiaCMZLoader_0.12.')
          patch('build.ps1',"CMZ 0.11 UPDATE BUILT. New Draw-thread scheduling and water-shader integration remain untested on Xbox.","CMZ 0.12 UPDATE BUILT. Converted-model loading and graphics behavior still need Xbox testing.")
          patch('Package.appxmanifest','Version="0.11.1.0"','Version="0.12.1.0"')
          patch('CmzLoader.cs','PREPARATION 0.11','PREPARATION 0.12')
          patch('StartupHooks.cs','private static string logPath;','private static string logPath;\n        private static string failureSummary;')
          patch('StartupHooks.cs','CMZ ORIGINAL STARTUP ATTEMPT 0.11 ','CMZ ORIGINAL STARTUP ATTEMPT 0.12 ')
          patch('StartupHooks.cs','Original startup 0.11: Draw-thread GPU work queue + experimental water effect; previous terrain/sprite/music fixes retained.','Original startup 0.12: 26 standard original models converted; model GPU resources load on Draw thread. Existing frame scheduling, music and terrain/water fixes retained.')
          patch('StartupHooks.cs','Original-model/other effects, avatars and couch co-op remain separate work.','Custom-effect/skinned models, other effects, avatars and couch co-op remain separate work.')
          patch('StartupHooks.cs','''            Note("STOPPED at "+stage+": "+error);''','''            lock(Gate) {
                          // Keep the first actual failure visible above the scrollable recent log lines.
                          // Its complete exception/call stack is still appended to the disk log below.
                          if(failureSummary==null)failureSummary="STOPPED at "+stage+": "+error.GetType().Name+": "+error.Message;
                      }
                      Note("STOPPED at "+stage+": "+error);''')
          patch('StartupHooks.cs','''                return "CMZ ORIGINAL STARTUP 0.11 - EXPERIMENTAL\\n" +
                              string.Join''','''                return "CMZ ORIGINAL STARTUP 0.12 - EXPERIMENTAL\\n" +
                              (failureSummary==null?"":failureSummary+"\\n\\n")+
                              string.Join''')
          # Additive provenance only; no shared framework or user's game code is changed by this generation step.
          p=root/'THIRD-PARTY-NOTICES.txt'
          with p.open('a',encoding='utf8') as f:f.write('\n0.12: original bounded model import, original-XNB GPU word conversion, model graph checks and diagnostic banner. Binary-layout facts checked against MonoGame v3.8.1 ModelReader/VertexBufferReader/IndexBufferReader/BasicEffectReader. No original model/texture files are contained in this public workflow.\n')
          print('Prepared 0.12 model route without changing existing frame queue, shaders, audio adapters, license policy or game inputs.')
      - name: Write ModelArchive12.cs
        shell: python
        run: |
          from pathlib import Path
          path=Path('xbox-cmz-services') / 'ModelArchive12.cs'
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(r'''// Original 0.12 importer. This code has no graphics/WinRT dependencies; shared with CI tests.
          // Only hash-pinned, exact entries are imported into this version's private cache directory.
          using System;
          using System.Collections.Generic;
          using System.IO;
          using System.IO.Compression;
          using System.Security.Cryptography;

          namespace NexiaCMZLoader {
              public sealed class ModelFileSpec12 {
                  public readonly string Path, Hash;
                  public readonly long Length;
                  public readonly int Bones, Meshes, Parts, PartVertices, Triangles;
                  public ModelFileSpec12(string path,long length,string hash,int bones,int meshes,int parts,int vertices,int triangles) {
                      Path=path;Length=length;Hash=hash;Bones=bones;Meshes=meshes;Parts=parts;PartVertices=vertices;Triangles=triangles;
                  }
              }
              public static class ModelArchive12 {
                  private const long MaximumArchive=16L*1024*1024, MaximumTotal=32L*1024*1024, MaximumEntry=8L*1024*1024;
                  public static string Hash(Stream input) {
                      using(var sha=SHA256.Create())return BitConverter.ToString(sha.ComputeHash(input)).Replace("-","").ToLowerInvariant();
                  }
                  private static bool IsHash(string value) {
                      if(value==null || value.Length!=64)return false;
                      for(int i=0;i<value.Length;i++)if(!((value[i]>='0'&&value[i]<='9')||(value[i]>='a'&&value[i]<='f')))return false;
                      return true;
                  }
                  private static string Clean(string name) {
                      if(string.IsNullOrWhiteSpace(name)||name.Length>240||name.Contains("\\")||name.StartsWith("/",StringComparison.Ordinal)||name.Contains(":"))
                          throw new InvalidDataException("Unsafe model entry path.");
                      var parts=name.Split('/');
                      foreach(string part in parts) {
                          if(part.Length==0||part=="."||part==".."||part.EndsWith(".",StringComparison.Ordinal)||part.EndsWith(" ",StringComparison.Ordinal))
                              throw new InvalidDataException("Unsafe model path component.");
                          foreach(char c in part)if(c<32||"<>:\"\\|?*".IndexOf(c)>=0)throw new InvalidDataException("Unsafe model path character.");
                      }
                      if(!name.EndsWith(".xnb",StringComparison.Ordinal))throw new InvalidDataException("Expected a model XNB entry.");
                      return name;
                  }
                  private static string Below(string directory,string name) {
                      Clean(name);
                      string prefix=System.IO.Path.GetFullPath(directory).TrimEnd(System.IO.Path.DirectorySeparatorChar,System.IO.Path.AltDirectorySeparatorChar)+System.IO.Path.DirectorySeparatorChar;
                      string full=System.IO.Path.GetFullPath(System.IO.Path.Combine(prefix,name.Replace('/',System.IO.Path.DirectorySeparatorChar)));
                      if(!full.StartsWith(prefix,StringComparison.OrdinalIgnoreCase))throw new InvalidDataException("Model entry escaped cache directory.");
                      return full;
                  }
                  private static bool ValidFile(string path,ModelFileSpec12 spec) {
                      if(!File.Exists(path)||new FileInfo(path).Length!=spec.Length)return false;
                      using(var input=File.OpenRead(path))return Hash(input)==spec.Hash;
                  }
                  public static Dictionary<string,string> Import(string archivePath,string directory,long expectedLength,string expectedHash,ModelFileSpec12[] specs) {
                      if(expectedLength<=0||expectedLength>MaximumArchive||!IsHash(expectedHash)||specs==null||specs.Length<1||specs.Length>128)
                          throw new InvalidDataException("Invalid pinned model manifest.");
                      var expected=new Dictionary<string,ModelFileSpec12>(StringComparer.Ordinal);
                      var aliases=new HashSet<string>(StringComparer.OrdinalIgnoreCase);long total=0;
                      foreach(var s in specs) {
                          if(s==null)throw new InvalidDataException("Null model manifest entry.");
                          string name=Clean(s.Path);
                          if(!aliases.Add(name)||s.Length<=0||s.Length>MaximumEntry||!IsHash(s.Hash))throw new InvalidDataException("Invalid/duplicate model manifest entry.");
                          total=checked(total+s.Length);if(total>MaximumTotal)throw new InvalidDataException("Model manifest exceeds size limit.");
                          expected.Add(name,s);
                      }
                      if(!File.Exists(archivePath))throw new FileNotFoundException("Upload CastleMinerZ-models-basic.zip intact beside the four existing ZIPs in LocalState.",archivePath);
                      if(new FileInfo(archivePath).Length!=expectedLength)throw new InvalidDataException("Model ZIP size mismatch.");
                      var paths=new Dictionary<string,string>(StringComparer.OrdinalIgnoreCase);
                      using(var input=File.OpenRead(archivePath)) {
                          if(Hash(input)!=expectedHash)throw new InvalidDataException("Model ZIP hash mismatch. Keep the downloaded ZIP intact.");
                          input.Position=0;
                          using(var archive=new ZipArchive(input,ZipArchiveMode.Read)) {
                              if(archive.Entries.Count!=specs.Length)throw new InvalidDataException("Model ZIP entry count mismatch.");
                              var seen=new HashSet<string>(StringComparer.OrdinalIgnoreCase);
                              // Validate the entire directory before changing any cached files.
                              foreach(var entry in archive.Entries) {
                                  string name=Clean(entry.FullName);ModelFileSpec12 spec;
                                  if(!seen.Add(name)||!expected.TryGetValue(name,out spec)||entry.Length!=spec.Length)
                                      throw new InvalidDataException("Unexpected/duplicate model ZIP entry: "+name);
                              }
                              foreach(var entry in archive.Entries) {
                                  var spec=expected[entry.FullName];string destination=Below(directory,spec.Path);
                                  if(!ValidFile(destination,spec)) {
                                      Directory.CreateDirectory(System.IO.Path.GetDirectoryName(destination));
                                      string temporary=destination+".new";
                                      try {
                                          using(var source=entry.Open())using(var output=File.Create(temporary)) {
                                              var buffer=new byte[65536];long count=0;int n;
                                              while((n=source.Read(buffer,0,buffer.Length))>0) {
                                                  count=checked(count+n);if(count>spec.Length)throw new InvalidDataException("Model entry expanded beyond its manifest length.");
                                                  output.Write(buffer,0,n);
                                              }
                                              if(count!=spec.Length)throw new EndOfStreamException("Incomplete model entry.");
                                          }
                                          if(!ValidFile(temporary,spec))throw new InvalidDataException("Converted model hash mismatch: "+spec.Path);
                                          if(File.Exists(destination))File.Delete(destination);
                                          File.Move(temporary,destination);
                                      } finally {if(File.Exists(temporary))File.Delete(temporary);}
                                  }
                                  paths.Add(spec.Path.Substring(0,spec.Path.Length-4),destination);
                              }
                          }
                      }
                      return paths;
                  }
              }
          }
          ''',encoding='utf-8')
      - name: Write ModelManifest12.cs
        shell: python
        run: |
          from pathlib import Path
          path=Path('xbox-cmz-services') / 'ModelManifest12.cs'
