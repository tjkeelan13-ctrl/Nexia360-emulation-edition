      - name: Write MenuPatch13.cs
        shell: python
        run: |
          from pathlib import Path
          path=Path('xbox-cmz-services') / 'MenuPatch13.cs'
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(r'''// Selective menu boot from verified original IL. The complete original SecondaryLoad remains intact.
          using System;
          using System.Collections.Generic;
          using System.Linq;
          using Mono.Cecil;
          using Mono.Cecil.Cil;
          namespace NexiaCMZLoader {
              public static class MenuPatch13 {
                  public static MethodDefinition CopyStraightLineSlices(TypeDefinition owner,MethodDefinition source,string name,int[][] ranges) {
                      if(source.IsStatic||source.Parameters.Count!=0||source.ReturnType.FullName!="System.Void"||!source.HasBody||source.Body.ExceptionHandlers.Count!=0)
                          throw new NotSupportedException("Unexpected menu startup method shape.");
                      var result=new MethodDefinition(name,MethodAttributes.Family|MethodAttributes.HideBySig,source.ReturnType);
                      result.Body.InitLocals=true;result.Body.MaxStackSize=Math.Max(16,source.Body.MaxStackSize);
                      var vars=new Dictionary<VariableDefinition,VariableDefinition>();
                      foreach(var v in source.Body.Variables){var clone=new VariableDefinition(v.VariableType);result.Body.Variables.Add(clone);vars[v]=clone;}
                      int previousEnd=-1;var all=source.Body.Instructions;
                      foreach(var range in ranges) {
                          if(range.Length!=2||range[0]<previousEnd||range[1]<=range[0])throw new ArgumentException("Overlapping/invalid menu IL slices.");
                          if(!all.Any(i=>i.Offset==range[0]) || (range[1]!=source.Body.CodeSize&&!all.Any(i=>i.Offset==range[1])))throw new InvalidOperationException("Menu IL boundary missing.");
                          previousEnd=range[1];
                          foreach(var instruction in all.Where(i=>i.Offset>=range[0]&&i.Offset<range[1])) {
                              if(instruction.Operand is Instruction || instruction.Operand is Instruction[] || instruction.OpCode.FlowControl==FlowControl.Branch || instruction.OpCode.FlowControl==FlowControl.Cond_Branch)
                                  throw new NotSupportedException("Menu slice has unexpected control flow.");
                              var copy=Instruction.Create(OpCodes.Nop);copy.OpCode=instruction.OpCode;
                              var variable=instruction.Operand as VariableDefinition;copy.Operand=variable==null?instruction.Operand:vars[variable];result.Body.Instructions.Add(copy);
                          }
                      }
                      if(result.Body.Instructions.Count==0||result.Body.Instructions.Last().OpCode!=OpCodes.Ret)throw new InvalidOperationException("Menu method does not end with ret.");
                      owner.Methods.Add(result);return result;
