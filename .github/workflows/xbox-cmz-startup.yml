                  public static void Audit() {
                      var pending=new SortedDictionary<string,List<string>>(StringComparer.Ordinal);
                      var failed=new List<Exception>();int prepared=0,replacement=0,total=0;
                      foreach(var line in Catalog.Split(new[]{'\n'},StringSplitOptions.RemoveEmptyEntries)) {
                          var fields=line.TrimEnd('\r').Split('|');string name=fields[0],family=fields[1];total++;
                          try {
                              // Always inspect the imported original, then the actual redirected input.
                              string original=StartupFiles.ContentPath(name);
                              CheckHeader(original,false);
                              if(TerrainEffectBridge.IsBlockEffect(name)||WaterEffectBridge.IsWaterEffect(name)) {
                                  replacement++;continue; // Authored effects, not converted original microcode.
                              }
                              string path=MenuSprites13.OverridePath(name)??ModelContent12.OverridePath(name)??TerrainMaterialFiles.OverridePath(name);
                              bool supported=path!=null||fields[2]=="1";
                              if(supported){CheckHeader(path??original,true);prepared++;}
                              else {List<string> names;if(!pending.TryGetValue(family,out names)){names=new List<string>();pending.Add(family,names);}names.Add(name);}
                          } catch(Exception ex) {failed.Add(new InvalidDataException(name,ex));StartupHooks.Note("CONTENT BATCH INPUT FAIL: "+name+" -> "+ex.Message);}
                      }
                      StartupHooks.Note("CONTENT BATCH INVENTORY: "+total+" XNB entries; "+prepared+" prepared input routes, "+replacement+" authored effect replacements; "+pending.Count+" deferred format families. Header/route counts are NOT runtime content or gameplay success.");
                      foreach(var pair in pending)StartupHooks.Note("CONTENT BATCH DEFERRED: "+pair.Key+" ["+pair.Value.Count+"]: "+string.Join(", ",pair.Value));
                      if(failed.Count!=0)throw new AggregateException("Content input inventory found independent failures.",failed);
                  }
                  public static void CheckHeader(string path,bool prepared) {
                      using(var s=File.OpenRead(path))using(var r=new BinaryReader(s)) {
                          if(s.Length<10 || r.ReadByte()!=88 || r.ReadByte()!=78 || r.ReadByte()!=66)throw new InvalidDataException("Not an XNB input.");
                          byte platform=r.ReadByte(),version=r.ReadByte(),flags=r.ReadByte();int size=r.ReadInt32();
                          if(version!=5||size!=s.Length||(platform!=120&&platform!=119))throw new InvalidDataException("XNB header mismatch.");
                          if(prepared&&(platform!=119||(flags&0xc0)!=0))throw new InvalidDataException("Prepared route still has Xbox/compressed data.");
                      }
                  }
              }
          }
