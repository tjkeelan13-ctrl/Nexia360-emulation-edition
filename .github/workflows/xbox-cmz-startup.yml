                      Require(effect,"WaterLevel",EffectParameterClass.Scalar,EffectParameterType.Single,1,1);
                      Require(effect,"WaterDepth",EffectParameterClass.Scalar,EffectParameterType.Int32,1,1);
                      Require(effect,"CubeTx",EffectParameterClass.Scalar,EffectParameterType.Int32,1,1,6);
                      Require(effect,"VertexUVs",EffectParameterClass.Vector,EffectParameterType.Single,1,4,4);
