                              // The following original SpriteBatch/terrain draw sets its own vertex buffer.
                              device.SetVertexBuffer(null);
                              for(int i=0;i<6;i++){device.Textures[i]=textures[i];device.SamplerStates[i]=samplers[i];}
                          }
                      }
                  }
              }
          }
