          The .NET 8 PackagingTool runs only on the Windows GitHub runner; it is not shipped as an Xbox runtime.
          ''')
      - name: Write RuntimePatches.cs (1 of 1)
        shell: python
        run: |
          from pathlib import Path
          path = Path("xbox-cmz-services") / 'RuntimePatches.cs'
          path.parent.mkdir(parents=True, exist_ok=True)
          with path.open('w', encoding="utf-8", newline="") as output:
              output.write(r'''// Changes only app-local copies of the user's verified original game assemblies.
          using System;
          using System.Collections;
          using System.Collections.Generic;
          using System.Linq;
          using Mono.Cecil;
          using Mono.Cecil.Cil;
          using Microsoft.Xna.Framework;
          using Microsoft.Xna.Framework.Graphics;

          namespace NexiaCMZLoader {
              public struct MeshPartEnumerator : IEnumerator<ModelMeshPart> {
                  private readonly ModelMeshPartCollection parts;
                  private int index;
                  public MeshPartEnumerator(ModelMeshPartCollection collection) {
                      if(collection==null) throw new ArgumentNullException("collection");
                      parts=collection; index=-1;
                  }
                  public ModelMeshPart Current { get { if(parts==null || index<0 || index>=parts.Count) throw new InvalidOperationException(); return parts[index]; } }
                  object IEnumerator.Current { get { return Current; } }
                  public bool MoveNext() { if(parts==null) return false; if(index<parts.Count) index++; return index<parts.Count; }
                  public void Reset() { index=-1; }
                  public void Dispose() { }
              }
              public static class MeshPartCompatibility {
                  public static MeshPartEnumerator GetEnumerator(ModelMeshPartCollection parts) { return new MeshPartEnumerator(parts); }
              }
              internal static class RuntimePatches {
                  private const string MeshParts="Microsoft.Xna.Framework.Graphics.ModelMeshPartCollection";
                  internal static bool RemapType(TypeReference reference,ModuleDefinition module,Action<string> log) {
                      if(reference.FullName!=MeshParts+"/Enumerator") return false;
                      var imported=module.ImportReference(typeof(MeshPartEnumerator));
                      reference.DeclaringType=null;
                      reference.Namespace=imported.Namespace;
                      reference.Name=imported.Name;
                      reference.Scope=imported.Scope;
                      reference.IsValueType=true;
                      log("PORT PATCH: real mesh-part enumerator adapter replaces the missing nested type.");
                      return true;
                  }
                  private static IEnumerable<TypeDefinition> Walk(TypeDefinition type) {
                      yield return type;
                      foreach(var inner in type.NestedTypes) foreach(var item in Walk(inner)) yield return item;
                  }
                  internal static void Apply(ModuleDefinition module,Action<string> log) {
                      var getEnumerator=module.ImportReference(typeof(MeshPartCompatibility).GetMethod("GetEnumerator"));
                      var affinity=module.ImportReference(typeof(StartupHooks).GetMethod("ConsoleAffinity"));
                      int enumerators=0,hints=0;
                      foreach(var type in module.Types.SelectMany(Walk).ToArray()) {
                          foreach(var method in type.Methods.Where(m=>m.HasBody).ToArray()) {
                              foreach(var instruction in method.Body.Instructions) {
                                  var called=instruction.Operand as MethodReference;
                                  if(called==null) continue;
                                  if(called.DeclaringType.FullName==MeshParts && called.Name=="GetEnumerator" && called.Parameters.Count==0) {
                                      if(instruction.OpCode!=OpCodes.Call && instruction.OpCode!=OpCodes.Callvirt)
                                          throw new NotSupportedException("Unexpected mesh enumeration instruction in "+method.FullName);
                                      instruction.OpCode=OpCodes.Call; instruction.Operand=getEnumerator; enumerators++;
                                  }
                                  if(called.DeclaringType.FullName=="System.Threading.Thread" && called.Name=="SetProcessorAffinity") {
                                      if(!called.HasThis || called.Parameters.Count!=1 || called.Parameters[0].ParameterType.FullName!="System.Int32[]")
                                          throw new NotSupportedException("Unexpected console affinity signature");
                                      instruction.OpCode=OpCodes.Call; instruction.Operand=affinity; hints++;
                                  }
                              }
                          }
                      }
                      log("PORT PATCH calls: mesh enumerators="+enumerators+" affinity hints="+hints);
                      if(module.Assembly.Name.Name=="CastleMinerZ") AddStartupSubclass(module,log);
                  }
                  private static void AddStartupSubclass(ModuleDefinition module,Action<string> log) {
                      var original=module.GetType("DNA.CastleMinerZ.CastleMinerZGame");
                      if(original==null || original.IsSealed) throw new NotSupportedException("Unexpected original game base type");
                      var derived=new TypeDefinition("NexiaStartup","OriginalGame",TypeAttributes.Public|TypeAttributes.Class,original);
                      module.Types.Add(derived);
                      var ctor=new MethodDefinition(".ctor",MethodAttributes.Public|MethodAttributes.HideBySig|
                          MethodAttributes.SpecialName|MethodAttributes.RTSpecialName,module.TypeSystem.Void);
                      derived.Methods.Add(ctor);
                      var baseCtor=original.Methods.Single(m=>m.IsConstructor && !m.IsStatic && m.Parameters.Count==0);
                      var il=ctor.Body.GetILProcessor();
                      il.Emit(OpCodes.Ldarg_0); il.Emit(OpCodes.Call,baseCtor); il.Emit(OpCodes.Ret);
                      foreach(var name in new[]{"Initialize","LoadContent","SecondaryLoad","AfterLoad","Update","Draw","UnloadContent"}) {
                          bool timed=name=="Update" || name=="Draw";
                          AddGuardedOverride(module,derived,original,name,timed);
                      }
                      log("PORT PATCH: generated derived game invokes original lifecycle methods with explicit exception reporting.");
                  }
                  private static void AddGuardedOverride(ModuleDefinition module,TypeDefinition derived,TypeDefinition original,string name,bool timed) {
                      var method=new MethodDefinition(name,MethodAttributes.Family|MethodAttributes.Virtual|MethodAttributes.HideBySig,module.TypeSystem.Void);
                      var target=new MethodReference(name,module.TypeSystem.Void,original){HasThis=true};
                      if(timed) {
                          var gameTime=module.ImportReference(typeof(GameTime));
                          method.Parameters.Add(new ParameterDefinition("time",ParameterAttributes.None,gameTime));
                          target.Parameters.Add(new ParameterDefinition(gameTime));
                      }
                      derived.Methods.Add(method);
                      var il=method.Body.GetILProcessor();
                      method.Body.InitLocals=true;
                      var ex=new VariableDefinition(module.ImportReference(typeof(Exception)));method.Body.Variables.Add(ex);
                      var done=Instruction.Create(OpCodes.Ret);
                      var begin=Instruction.Create(OpCodes.Ldstr,name);
                      var caught=Instruction.Create(OpCodes.Stloc,ex);
                      il.Emit(OpCodes.Call,module.ImportReference(typeof(StartupHooks).GetProperty("Failed").GetGetMethod()));
                      il.Emit(OpCodes.Brtrue,done);
                      il.Append(begin);
                      il.Emit(OpCodes.Call,module.ImportReference(typeof(StartupHooks).GetMethod("Enter")));
                      il.Emit(OpCodes.Ldarg_0);
                      if(timed) il.Emit(OpCodes.Ldarg_1);
                      il.Emit(OpCodes.Call,target); // non-virtual base call, never recursive
                      il.Emit(OpCodes.Ldstr,name);
                      il.Emit(OpCodes.Call,module.ImportReference(typeof(StartupHooks).GetMethod("Returned")));
                      il.Emit(OpCodes.Leave,done);
                      il.Append(caught);
                      il.Emit(OpCodes.Ldloc,ex);il.Emit(OpCodes.Ldstr,name);
                      il.Emit(OpCodes.Call,module.ImportReference(typeof(StartupHooks).GetMethod("Stop")));
                      il.Emit(OpCodes.Leave,done);
                      il.Append(done);
                      method.Body.ExceptionHandlers.Add(new ExceptionHandler(ExceptionHandlerType.Catch){
                          CatchType=module.ImportReference(typeof(Exception)),TryStart=begin,TryEnd=caught,HandlerStart=caught,HandlerEnd=done
                      });
                  }
              }
          }
          ''')
