          public static class Startup09Patcher {
              private const string G="Microsoft.Xna.Framework.Graphics.";
              public static void Apply(ModuleDefinition module, MethodReference residentGuard) {
                  var sprite=module.GetType(G+"SpriteBatch")??throw new InvalidOperationException("SpriteBatch is missing.");
                  string[] signature={G+"SpriteSortMode",G+"BlendState",G+"SamplerState",G+"DepthStencilState",G+"RasterizerState",G+"Effect", "System.Nullable`1<Microsoft.Xna.Framework.Matrix>"};
                  var begin=sprite.Methods.Single(m=>m.Name=="Begin" && m.IsPublic && !m.IsStatic &&
                      m.ReturnType.FullName=="System.Void" && m.Parameters.Select(p=>p.ParameterType.FullName).SequenceEqual(signature));
                  // These exact arities occur in the two original CMZ assemblies: 0, 2 and 5.
                  foreach(int arity in new[]{0,2,5}) {
                      if(sprite.Methods.Any(m=>m.Name=="Begin" && m.Parameters.Count==arity))
                          throw new InvalidOperationException("Unexpected existing SpriteBatch.Begin overload: "+arity);
                      var forward=new MethodDefinition("Begin",MethodAttributes.Public|MethodAttributes.HideBySig,module.TypeSystem.Void);
                      foreach(var parameter in begin.Parameters.Take(arity))
                          forward.Parameters.Add(new ParameterDefinition(parameter.Name,ParameterAttributes.None,parameter.ParameterType));
                      sprite.Methods.Add(forward);
                      forward.Body.InitLocals=true;
                      var nullableMatrix=new VariableDefinition(begin.Parameters[6].ParameterType);forward.Body.Variables.Add(nullableMatrix);
