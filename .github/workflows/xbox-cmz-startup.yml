          float4 EntityNoWaterTechnique_MetalMaterials(VOut v):SV_Target { return MaterialPS(v,true,0,false,false); }
          float4 EntityNoWaterTechnique_SpecularUI(VOut v):SV_Target { return MaterialPS(v,false,0,true,false); }
          float4 EntityNoWaterTechnique_MetalUI(VOut v):SV_Target { return MaterialPS(v,true,0,true,false); }
          technique EntityNoWaterTechnique
