# Self-contained managed-runtime experiment. NOT the full Nexia emulator.
# Add as .github/workflows/xbox-managed-probe.yml on Mousehook.
# Keep the already-working native xbox-probe.yml unchanged.
name: Xbox - Managed Runtime Probe (not emulator)

on:
  workflow_dispatch:
  push:
    branches: [Mousehook]
    paths:
      - '.github/workflows/xbox-managed-probe.yml'

permissions:
  contents: read

concurrency:
  group: xbox-managed-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Write managed tests and inspected Nexia component
        shell: python
        run: |
          from pathlib import Path
          root = Path("xbox-managed-probe")
          root.mkdir(exist_ok=True)
          (root / 'App.xaml').write_text(r'''<Application
              x:Class="NexiaXboxManagedProbe.App"
              xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"
              xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml"
              RequestedTheme="Dark">
              <Application.Resources />
          </Application>
          ''', encoding='utf-8')
          (root / 'App.xaml.cs').write_text(r'''// Experimental managed-runtime diagnostic. This is NOT an emulator.
          using System;
          using System.IO;
          using System.Reflection;
          using System.Runtime.InteropServices;
          using System.Text;
          using System.Threading.Tasks;
          using Windows.ApplicationModel.Activation;
          using Windows.Gaming.Input;
          using Windows.Storage;
          using Windows.System.Profile;
          using Windows.UI.Xaml;
          using Windows.UI.Xaml.Controls;
          using Windows.UI.Xaml.Media;

          namespace NexiaXboxManagedProbe
          {
              sealed partial class App : Application
              {
                  private readonly StringBuilder report = new StringBuilder();
                  private TextBlock output;
                  private string logPath;
                  private int passed, failed, skipped;
                  private bool launched;

                  public App()
                  {
                      InitializeComponent();
                      UnhandledException += (sender, args) => WriteLog("UNHANDLED: " + args.Exception);
                  }

                  protected override async void OnLaunched(LaunchActivatedEventArgs args)
                  {
                      if (launched) { Window.Current.Activate(); return; }
                      launched = true;
                      output = new TextBlock {
                          FontFamily = new FontFamily("Consolas"), FontSize = 22,
                          TextWrapping = TextWrapping.Wrap, Margin = new Thickness(56, 36, 56, 36)
                      };
                      Window.Current.Content = new ScrollViewer {
                          Content = output, VerticalScrollBarVisibility = ScrollBarVisibility.Auto
                      };
                      Window.Current.Activate();
                      Append("NEXIA MANAGED PROBE 0.2 - NOT THE EMULATOR");
                      Append("No game, graphics framework, or avatars are loaded.\n");
                      try {
                          logPath = Path.Combine(ApplicationData.Current.LocalFolder.Path, "managed-probe-log.txt");
                          File.WriteAllText(logPath, "Managed probe started " + DateTime.UtcNow.ToString("O") + "\r\n");
                          Append("Device: " + AnalyticsInfo.VersionInfo.DeviceFamily);
                          Append("Runtime: " + RuntimeInformation.FrameworkDescription);
                          WriteLog("Core library: " + typeof(object).Assembly.FullName);
                          WriteLog("App version: " + Windows.ApplicationModel.Package.Current.Id.Version.ToString());
                          WriteLog("Process architecture: " + RuntimeInformation.ProcessArchitecture);
                          var tests = new ProbeTests(ApplicationData.Current.LocalFolder.Path);
                          await Step("C# reflection", () => tests.ReflectionTest());
                          await Step("Managed controller API", () => "connected=" + Gamepad.Gamepads.Count);
                          await Step("Generate IL with Cecil", () => tests.GeneratePayload());
                          await Step("Load IL bytes + execute", () => tests.LoadMemory());
                          await Step("LocalState DLL + execute", () => tests.LoadLocalState());
                          await Step("Rewrite IL + execute", () => tests.RewriteAndRun());
                          await Step("Nexia original facade", () => tests.OriginalFacade());
                          await Step("Forwarder-flag control", () => tests.FlaggedFacade());
                          Append("\nFinished: " + passed + " PASS / " + failed + " FAIL / " + skipped + " SKIP");
                          Append("Send a photo, including any FAIL lines.");
                          Append("Log: LocalState/managed-probe-log.txt");
                          Append("These results do NOT establish CastleMiner Z support.");
                      } catch (Exception ex) {
                          Append("STARTUP FAIL: " + ex.GetType().Name + ": " + ex.Message);
                          WriteLog(ex.ToString());
                      }
                  }

                  private async Task Step(string label, Func<string> action)
                  {
                      await Task.Delay(60); // Let the previous result reach the display.
                      WriteLog("START " + label);
                      try {
                          string detail = await Task.Run(action);
                          passed++;
                          Append(label + ": PASS (" + detail + ")");
                      } catch (ProbeSkipException ex) {
                          skipped++;
                          Append(label + ": SKIP (" + ex.Message + ")");
                      } catch (Exception ex) {
                          failed++;
                          WriteLog(label + " full exception: " + ex);
                          while (ex is TargetInvocationException && ex.InnerException != null) ex = ex.InnerException;
                          Append(label + ": FAIL " + ex.GetType().Name + " 0x" + ex.HResult.ToString("X8"));
                          WriteLog(label + " message: " + ex.Message);
                      }
                  }

                  private void Append(string line)
                  {
                      report.AppendLine(line);
                      output.Text = report.ToString();
                      WriteLog(line);
                  }
                  private void WriteLog(string line)
                  {
                      try { if (logPath != null) File.AppendAllText(logPath, line + "\r\n"); }
                      catch { /* Logging must not prevent display of a failed test. */ }
                  }
              }
          }
          ''', encoding='utf-8')
          (root / 'ProbeTests.cs').write_text(r'''// Tests IL generation/loading and a small real Nexia source component.
          // All payloads are generated by this app. No arbitrary game/plugin input exists.
          using System;
          using System.IO;
          using System.Linq;
          using System.Reflection;
          using Mono.Cecil;
          using Mono.Cecil.Cil;
          using CecilTypeAttributes = Mono.Cecil.TypeAttributes;
          using CecilMethodAttributes = Mono.Cecil.MethodAttributes;

          namespace NexiaXboxManagedProbe
          {
              public sealed class ProbeSkipException : Exception
              {
                  public ProbeSkipException(string message) : base(message) { }
              }

              public static class ReflectionTarget
              {
                  public static int Add(int a, int b) { return a + b; }
              }

              public sealed class ProbeTests
              {
                  private readonly string folder;
                  private readonly string unique = Guid.NewGuid().ToString("N");
                  private byte[] payload;
                  private byte[] originalFacade;
                  public ProbeTests(string localFolder) { folder = localFolder; }

                  public string ReflectionTest()
                  {
                      object answer = typeof(ReflectionTarget).GetMethod("Add").Invoke(null, new object[] { 19, 23 });
                      Require(answer is int && (int)answer == 42, "Unexpected reflection result.");
                      return "19+23=42";
                  }
                  public string GeneratePayload()
                  {
                      payload = CreatePayload("NexiaProbeMemory_" + unique, 42);
                      using (var stream = new MemoryStream(payload))
                      using (var definition = AssemblyDefinition.ReadAssembly(stream))
                          Require(definition.MainModule.GetType("ProbePayload.Calculator") != null, "Missing generated type.");
                      return payload.Length + " bytes";
                  }
                  public string LoadMemory()
                  {
                      if (payload == null) throw new ProbeSkipException("IL generation failed");
                      Require(RunPayload(payload) == 42, "Generated method did not return 42.");
                      return "new assembly returned 42";
                  }
                  public string LoadLocalState()
                  {
                      byte[] bytes = CreatePayload("NexiaProbeDisk_" + unique, 43);
                      string path = Path.Combine(folder, "probe-payload.dll");
                      File.WriteAllBytes(path, bytes);
                      // This deliberately tests reading bytes from writable storage, then
                      // Assembly.Load(bytes). It does NOT claim LoadFrom(path) support.
                      Require(RunPayload(File.ReadAllBytes(path)) == 43, "LocalState method did not return 43.");
                      return "read DLL bytes; returned 43";
                  }
                  public string RewriteAndRun()
                  {
                      if (payload == null) throw new ProbeSkipException("IL generation failed");
                      using (var input = new MemoryStream(payload))
                      using (var definition = AssemblyDefinition.ReadAssembly(input)) {
                          definition.Name.Name = "NexiaProbeRewritten_" + unique;
                          var method = definition.MainModule.GetType("ProbePayload.Calculator").Methods.Single(m => m.Name == "Compute");
                          Require(method.Body.Instructions[0].OpCode == OpCodes.Ldc_I4, "Unexpected input IL.");
                          method.Body.Instructions[0].Operand = 73;
                          using (var output = new MemoryStream()) {
                              definition.Write(output);
                              byte[] rewritten = output.ToArray();
                              File.WriteAllBytes(Path.Combine(folder, "probe-rewritten.dll"), rewritten);
                              Require(RunPayload(rewritten) == 73, "Rewritten method did not return 73.");
                          }
                      }
                      return "changed 42 to 73 at runtime";
                  }
                  public string OriginalFacade()
                  {
                      // NexiaFacadeFactory.cs is byte-for-byte the inspected Nexia file.
                      // The only provider here is our deliberately fake test marker.
                      using (var stream = Nexia.Xna.FacadeFactory.Build("NexiaProbeFacade_" + unique,
                          new Assembly[] { typeof(Microsoft.Xna.Framework.XboxProbeMarker).Assembly }))
                      using (var copy = new MemoryStream()) {
                          stream.CopyTo(copy);
                          originalFacade = copy.ToArray();
                      }
                      VerifyFacade(originalFacade);
                      return "real factory; fake marker resolved";
                  }
                  public string FlaggedFacade()
                  {
                      if (originalFacade == null) throw new ProbeSkipException("original facade generation failed");
                      // Controlled alternative: explicitly mark top-level exported types
                      // as forwarders. Keep this separate from the unmodified-source test.
                      using (var input = new MemoryStream(originalFacade))
                      using (var definition = AssemblyDefinition.ReadAssembly(input)) {
                          definition.Name.Name = "NexiaProbeFlaggedFacade_" + unique;
                          foreach (var type in definition.MainModule.ExportedTypes)
                              if (type.DeclaringType == null) type.IsForwarder = true;
                          using (var output = new MemoryStream()) {
                              definition.Write(output);
                              VerifyFacade(output.ToArray());
                          }
                      }
                      return "explicit Forwarder flag resolved";
                  }

                  private static byte[] CreatePayload(string name, int value)
                  {
                      using (var definition = AssemblyDefinition.CreateAssembly(
                          new AssemblyNameDefinition(name, new Version(1, 0, 0, 0)), name, ModuleKind.Dll)) {
                          var module = definition.MainModule;
                          // Import actual runtime type identities rather than assuming
                          // desktop mscorlib or a particular CoreCLR version.
                          var type = new TypeDefinition("ProbePayload", "Calculator",
                              CecilTypeAttributes.Public | CecilTypeAttributes.Abstract | CecilTypeAttributes.Sealed,
                              module.ImportReference(typeof(object)));
                          module.Types.Add(type);
                          var method = new MethodDefinition("Compute",
                              CecilMethodAttributes.Public | CecilMethodAttributes.Static,
                              module.ImportReference(typeof(int)));
                          type.Methods.Add(method);
                          var il = method.Body.GetILProcessor();
                          il.Emit(OpCodes.Ldc_I4, value);
                          il.Emit(OpCodes.Ret);
                          using (var output = new MemoryStream()) { definition.Write(output); return output.ToArray(); }
                      }
                  }
                  private static int RunPayload(byte[] bytes)
                  {
                      Assembly loaded = Assembly.Load(bytes);
                      Type type = loaded.GetType("ProbePayload.Calculator", true);
                      object result = type.GetMethod("Compute", BindingFlags.Public | BindingFlags.Static).Invoke(null, null);
                      Require(result is int, "Payload returned a non-integer.");
                      return (int)result;
                  }
                  private static void VerifyFacade(byte[] bytes)
                  {
                      Assembly facade = Assembly.Load(bytes);
                      Type type = facade.GetType("Microsoft.Xna.Framework.XboxProbeMarker", true);
                      Require(type == typeof(Microsoft.Xna.Framework.XboxProbeMarker), "Forwarded type identity mismatch.");
                      object result = type.GetMethod("Marker", BindingFlags.Public | BindingFlags.Static).Invoke(null, null);
                      Require(result is int && (int)result == 1979, "Forwarded method mismatch.");
                  }
                  private static void Require(bool condition, string message)
                  {
                      if (!condition) throw new InvalidOperationException(message);
                  }
              }
          }

          namespace Microsoft.Xna.Framework
          {
              // MOCK TYPE ONLY: deliberately no real XNA API implementation.
              public static class XboxProbeMarker
              {
                  public static int Marker() { return 1979; }
              }
          }
          ''', encoding='utf-8')
          (root / 'NexiaFacadeFactory.cs').write_text(r'''// Fabricates the Microsoft.Xna.Framework.* assemblies at load time instead of
          // shipping them.
          //
          // A title asks for "Microsoft.Xna.Framework.Graphics"; the runtime insists the
          // assembly it gets back carries that simple name, so MonoGame cannot simply be
          // handed over. The usual answer is to build ten little facade DLLs full of
          // [TypeForwardedTo] and install them somewhere. There is no need: the same
          // assembly can be emitted into memory the moment it is asked for, from whatever
          // MonoGame and host happen to be present.
          //
          // That is strictly better than shipping them. A generated forwarder lists
          // exactly the types the loaded MonoGame exports, so it cannot drift out of step
          // with it, and there is nothing to reinstall when either side changes.
          //
          // Reflection.Emit cannot do this - it has no way to write ExportedType rows -
          // so the module is built with Cecil and handed to LoadFromStream.
          using System;
          using System.Collections.Generic;
          using System.IO;
          using System.Linq;
          using System.Reflection;
          using Mono.Cecil;

          namespace Nexia.Xna;

          internal static class FacadeFactory {
            // Every XNA assembly a 360 title can reference. A title asking for one of
            // these gets a fabricated forwarder; anything else is its own code.
            private static readonly string[] Facades = {
              "Microsoft.Xna.Framework",
              "Microsoft.Xna.Framework.Avatar",
              "Microsoft.Xna.Framework.Game",
              "Microsoft.Xna.Framework.GamerServices",
              "Microsoft.Xna.Framework.Graphics",
              "Microsoft.Xna.Framework.Input.Touch",
              "Microsoft.Xna.Framework.Net",
              "Microsoft.Xna.Framework.Storage",
              "Microsoft.Xna.Framework.Video",
              "Microsoft.Xna.Framework.Xact",
            };

            public static bool IsFacade(string simpleName) =>
                Array.IndexOf(Facades, simpleName) >= 0;

            /// <summary>
            /// Builds an assembly named <paramref name="simpleName"/> that forwards every
            /// public type in <paramref name="providers"/> living under the
            /// Microsoft.Xna.Framework namespace.
            /// </summary>
            /// <remarks>
            /// Providers are searched in order, and the first to export a type wins - so
            /// the host's own implementations (Storage, GamerServices) take precedence
            /// over MonoGame's, and MonoGame supplies everything else.
            /// </remarks>
            public static Stream Build(string simpleName, IReadOnlyList<Assembly> providers) {
              var assembly = AssemblyDefinition.CreateAssembly(
                  new AssemblyNameDefinition(simpleName, new Version(4, 0, 0, 0)),
                  simpleName, ModuleKind.Dll);
              var module = assembly.MainModule;

              // One AssemblyNameReference per provider, reused by every forward into it.
              var scopes = new Dictionary<Assembly, AssemblyNameReference>();
              foreach (var provider in providers) {
                var name = provider.GetName();
                var reference = new AssemblyNameReference(name.Name, name.Version);
                var token = name.GetPublicKeyToken();
                if (token != null && token.Length > 0) {
                  reference.PublicKeyToken = token;
                }
                module.AssemblyReferences.Add(reference);
                scopes[provider] = reference;
              }

              var claimed = new Dictionary<string, ExportedType>(StringComparer.Ordinal);
              foreach (var provider in providers) {
                foreach (var type in SafeExportedTypes(provider)) {
                  if (type.Namespace == null ||
                      !type.Namespace.StartsWith("Microsoft.Xna.Framework", StringComparison.Ordinal)) {
                    continue;
                  }
                  AddForward(module, type, scopes[provider], claimed, null);
                }
              }

              var stream = new MemoryStream();
              assembly.Write(stream);
              stream.Position = 0;
              return stream;
            }

            // A nested type forwards through its declaring type, so the outer row has to
            // exist first and be referenced as the inner one's implementation.
            private static ExportedType AddForward(ModuleDefinition module, Type type,
                                                   AssemblyNameReference scope,
                                                   Dictionary<string, ExportedType> claimed,
                                                   ExportedType declaring) {
              if (type.IsNested && declaring == null) {
                declaring = AddForward(module, type.DeclaringType, scope, claimed, null);
                if (declaring == null) {
                  return null;
                }
              }

              // Keyed on Type.FullName, which spells a nested type "Ns.Outer+Inner".
              // An ExportedType cannot answer that - a nested row carries only its own
              // name and an empty namespace - so the mapping is kept here rather than
              // rebuilt by scanning, which silently failed to match anything nested.
              if (claimed.TryGetValue(type.FullName, out var already)) {
                return already;
              }

              var exported = new ExportedType(
                  type.IsNested ? null : type.Namespace,
                  type.Name,
                  module,
                  type.IsNested ? (IMetadataScope)null : scope) {
                // Qualified: System.Reflection has a TypeAttributes too, and both are
                // in scope here.
                Attributes = Mono.Cecil.TypeAttributes.Public,
                // A nested type carries no scope of its own - it is reached through
                // its declaring type, which is why null was passed above.
                DeclaringType = declaring,
              };
              module.ExportedTypes.Add(exported);
              claimed[type.FullName] = exported;

              foreach (var nested in SafeNestedTypes(type)) {
                AddForward(module, nested, scope, claimed, exported);
              }
              return exported;
            }

            // A provider with a type it cannot load must not take the whole facade down
            // with it - the rest still forwards.
            private static IEnumerable<Type> SafeExportedTypes(Assembly assembly) {
              try {
                return assembly.GetExportedTypes();
              } catch (ReflectionTypeLoadException e) {
                return e.Types.Where(t => t != null && t.IsPublic);
              } catch (Exception) {
                return Array.Empty<Type>();
              }
            }

            private static IEnumerable<Type> SafeNestedTypes(Type type) {
              try {
                return type.GetNestedTypes(BindingFlags.Public);
              } catch (Exception) {
                return Array.Empty<Type>();
              }
            }
          }
          ''', encoding='utf-8')
      - name: Write UWP project, packaging script and notices
        shell: python
        run: |
          from pathlib import Path
          root = Path("xbox-managed-probe")
          root.mkdir(exist_ok=True)
          (root / 'ManagedProbe.csproj').write_text(r'''<?xml version="1.0" encoding="utf-8"?>
          <Project ToolsVersion="Current" DefaultTargets="Build" xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
            <Import Project="$(MSBuildExtensionsPath)\$(MSBuildToolsVersion)\Microsoft.Common.props" Condition="Exists('$(MSBuildExtensionsPath)\$(MSBuildToolsVersion)\Microsoft.Common.props')" />
            <PropertyGroup>
              <Configuration Condition="'$(Configuration)'==''">Debug</Configuration>
              <Platform Condition="'$(Platform)'==''">x64</Platform>
              <ProjectGuid>{0CF44B44-3D0A-4C82-969B-CFB64774C99E}</ProjectGuid>
              <OutputType>AppContainerExe</OutputType>
              <RootNamespace>NexiaXboxManagedProbe</RootNamespace>
              <AssemblyName>NexiaXboxManagedProbe</AssemblyName>
              <DefaultLanguage>en-US</DefaultLanguage>
              <TargetPlatformIdentifier>UAP</TargetPlatformIdentifier>
              <TargetPlatformVersion Condition="'$(TargetPlatformVersion)'==''">10.0.19041.0</TargetPlatformVersion>
              <TargetPlatformMinVersion>10.0.17763.0</TargetPlatformMinVersion>
              <MinimumVisualStudioVersion>17.0</MinimumVisualStudioVersion>
              <ProjectTypeGuids>{A5A43C5B-DE2A-4C0C-9213-0A381AF9435A};{FAE04EC0-301F-11D3-BF4B-00C04F79EFBC}</ProjectTypeGuids>
              <FileAlignment>512</FileAlignment>
              <LangVersion>10.0</LangVersion>
              <Nullable>disable</Nullable>
              <EnableDotNetNativeCompatibleProfile>true</EnableDotNetNativeCompatibleProfile>
              <UseDotNetNativeToolchain>false</UseDotNetNativeToolchain>
              <AppxPackageSigningEnabled>false</AppxPackageSigningEnabled>
              <AppxAutoIncrementPackageRevision>false</AppxAutoIncrementPackageRevision>
              <GenerateAppInstallerFile>false</GenerateAppInstallerFile>
              <AppxBundle>Never</AppxBundle>
              <AppxSymbolPackageEnabled>false</AppxSymbolPackageEnabled>
              <GenerateAppxPackageOnBuild>true</GenerateAppxPackageOnBuild>
              <RestoreProjectStyle>PackageReference</RestoreProjectStyle>
            </PropertyGroup>
            <PropertyGroup Condition="'$(Configuration)|$(Platform)'=='Debug|x64'">
              <DebugSymbols>true</DebugSymbols>
              <DebugType>full</DebugType>
              <OutputPath>bin\x64\Debug\</OutputPath>
              <DefineConstants>DEBUG;TRACE;NETFX_CORE;WINDOWS_UWP;WINDOWS_UAP</DefineConstants>
              <PlatformTarget>x64</PlatformTarget>
              <Prefer32Bit>false</Prefer32Bit>
              <UseVSHostingProcess>false</UseVSHostingProcess>
              <Optimize>false</Optimize>
            </PropertyGroup>
            <ItemGroup>
              <ApplicationDefinition Include="App.xaml"><Generator>MSBuild:Compile</Generator><SubType>Designer</SubType></ApplicationDefinition>
              <Compile Include="App.xaml.cs"><DependentUpon>App.xaml</DependentUpon></Compile>
              <Compile Include="ProbeTests.cs" />
              <Compile Include="NexiaFacadeFactory.cs" />
              <AppxManifest Include="Package.appxmanifest"><SubType>Designer</SubType></AppxManifest>
              <Content Include="Assets\*.png" />
              <Content Include="NEXIA-LICENSE.txt" />
              <Content Include="THIRD-PARTY-NOTICES.txt" />
            </ItemGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.NETCore.UniversalWindowsPlatform" Version="6.2.14" />
              <PackageReference Include="Mono.Cecil" Version="0.11.6" />
            </ItemGroup>
            <Import Project="$(MSBuildExtensionsPath)\Microsoft\WindowsXaml\v$(VisualStudioVersion)\Microsoft.Windows.UI.Xaml.CSharp.targets" />
          </Project>
          ''', encoding='utf-8')
          (root / 'Package.appxmanifest').write_text(r'''<?xml version="1.0" encoding="utf-8"?>
          <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
                   xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10" IgnorableNamespaces="uap">
            <Identity Name="NexiaXboxManagedProbe" Publisher="CN=NexiaXboxManagedProbe" Version="0.2.1.0" ProcessorArchitecture="x64" />
            <Properties>
              <DisplayName>Nexia Managed Probe</DisplayName>
              <PublisherDisplayName>Personal Xbox port experiment</PublisherDisplayName>
              <Logo>Assets\StoreLogo.png</Logo>
            </Properties>
            <Dependencies><TargetDeviceFamily Name="Windows.Universal" MinVersion="10.0.17763.0" MaxVersionTested="10.0.19041.0" /></Dependencies>
            <Resources><Resource Language="en-us" /></Resources>
            <Applications>
              <Application Id="App" Executable="$targetnametoken$.exe" EntryPoint="NexiaXboxManagedProbe.App">
                <uap:VisualElements DisplayName="Nexia Managed Probe" Description="Managed runtime experiment. Not an emulator."
                    BackgroundColor="#101820" Square150x150Logo="Assets\Square150.png" Square44x44Logo="Assets\Square44.png">
                  <uap:SplashScreen Image="Assets\Splash.png" />
                </uap:VisualElements>
              </Application>
            </Applications>
          </Package>
          ''', encoding='utf-8')
          (root / 'NuGet.Config').write_text(r'''<?xml version="1.0" encoding="utf-8"?>
          <configuration><packageSources><clear /><add key="nuget.org" value="https://api.nuget.org/v3/index.json" /></packageSources></configuration>
          ''', encoding='utf-8')
          (root / 'build.ps1').write_text(r'''param([ValidateRange(1,65535)][int]$BuildNumber = 1)
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $root = $PSScriptRoot
          $out = Join-Path $root 'out'
          $packages = Join-Path $root 'AppPackages'
          New-Item -ItemType Directory -Force $out, "$root\Assets", "$out\Dependencies", $packages | Out-Null
          Start-Transcript -Path "$out\build-transcript.txt" -Force | Out-Null
          try {
              $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
              if (!(Test-Path $vswhere)) { throw 'Visual Studio locator is missing.' }
              $vs = & $vswhere -latest -products '*' -version '[17.0,18.0)' -property installationPath
              if (!$vs) { throw 'Visual Studio 2022 is required.' }
              $msbuild = Join-Path $vs 'MSBuild\Current\Bin\MSBuild.exe'
              $kits = "${env:ProgramFiles(x86)}\Windows Kits\10"
              $versions = @(Get-ChildItem "$kits\bin" -Directory | Where-Object {
                  $_.Name -match '^10\.0\.\d+\.0$' -and
                  (Test-Path (Join-Path $_.FullName 'x64\makeappx.exe')) -and
                  (Test-Path (Join-Path $_.FullName 'x64\signtool.exe'))
              } | Sort-Object { [version]$_.Name } -Descending)
              if (!$versions.Count) { throw 'Windows SDK packaging tools are missing.' }
              $sdk = $versions[0].Name
              if (@($versions | Where-Object Name -eq '10.0.19041.0').Count) { $sdk = '10.0.19041.0' }
              Write-Host "Visual Studio: $vs"
              Write-Host "SDK: $sdk; managed UWP Debug x64; .NET Native DISABLED intentionally"

              Add-Type -AssemblyName System.Drawing
              foreach ($asset in @(@('StoreLogo.png',50,50), @('Square44.png',44,44), @('Square150.png',150,150), @('Splash.png',620,300))) {
                  $bitmap = [Drawing.Bitmap]::new([int]$asset[1], [int]$asset[2])
                  $graphics = [Drawing.Graphics]::FromImage($bitmap)
                  $brush = [Drawing.SolidBrush]::new([Drawing.Color]::FromArgb(230,180,70))
                  try {
                      $graphics.Clear([Drawing.Color]::FromArgb(16,24,32))
                      $graphics.FillRectangle($brush, [int]($asset[1]/4), [int]($asset[2]/4), [int]($asset[1]/2), [int]($asset[2]/2))
                      $bitmap.Save((Join-Path "$root\Assets" $asset[0]), [Drawing.Imaging.ImageFormat]::Png)
                  } finally { $brush.Dispose(); $graphics.Dispose(); $bitmap.Dispose() }
              }
              [xml]$manifest = Get-Content "$root\Package.appxmanifest" -Raw
              $manifest.Package.Identity.Version = "0.2.$BuildNumber.0"
              $manifest.Package.Dependencies.TargetDeviceFamily.MaxVersionTested = $sdk
              $manifest.Save("$root\Package.appxmanifest")

              & $msbuild "$root\ManagedProbe.csproj" /restore /m /t:Build /v:minimal `
                  /p:Configuration=Debug /p:Platform=x64 "/p:TargetPlatformVersion=$sdk" `
                  /p:UseDotNetNativeToolchain=false /p:AppxPackageSigningEnabled=false `
                  /p:GenerateAppxPackageOnBuild=true /p:AppxBundle=Never `
                  /p:UapAppxPackageBuildMode=SideloadOnly "/p:AppxPackageDir=$packages\" `
                  "/bl:$out\build.binlog"
              if ($LASTEXITCODE -ne 0) { throw "Managed UWP build failed ($LASTEXITCODE). See build.binlog and transcript." }

              $apps = @(Get-ChildItem $packages -Recurse -Filter '*.appx' | Where-Object {
                  $_.Name -like 'NexiaXboxManagedProbe*.appx' -and $_.FullName -notmatch '[\\/]Dependencies[\\/]'
              })
              if ($apps.Count -ne 1) { throw "Expected one main APPX; found $($apps.Count)." }
              $package = Join-Path $root "NexiaXboxManagedProbe_0.2.${BuildNumber}.0_x64.appx"
              Copy-Item $apps[0].FullName $package
              $dependencyFiles = @(Get-ChildItem $packages -Recurse -Filter '*.appx' | Where-Object {
                  $_.FullName -match '[\\/]Dependencies[\\/]' -and $_.FullName -match '[\\/]x64[\\/]'
              })
              foreach ($dependency in $dependencyFiles) {
                  Copy-Item $dependency.FullName (Join-Path "$out\Dependencies" $dependency.Name) -Force
              }

              # Fail visibly if a declared dependency is not included. Do not substitute
              # a desktop .NET runtime or assume it is already installed on the Xbox.
              Add-Type -AssemblyName System.IO.Compression.FileSystem
              function Read-AppxManifest([string]$Path) {
                  $archive = [IO.Compression.ZipFile]::OpenRead($Path)
                  try {
                      $entry = $archive.GetEntry('AppxManifest.xml')
                      if (!$entry) { throw "Missing APPX manifest: $Path" }
                      $reader = [IO.StreamReader]::new($entry.Open())
                      try { return [xml]$reader.ReadToEnd() } finally { $reader.Dispose() }
                  } finally { $archive.Dispose() }
              }
              $mainManifest = Read-AppxManifest $package
              $available = @{}
              foreach ($file in @(Get-ChildItem "$out\Dependencies" -Filter '*.appx')) {
                  $dependencyManifest = Read-AppxManifest $file.FullName
                  $identity = $dependencyManifest.Package.Identity
                  $available[[string]$identity.Name] = [version]$identity.Version
                  Write-Host "Included dependency: $($identity.Name) $($identity.Version)"
              }
              $required = @($mainManifest.SelectNodes('//*[local-name()="PackageDependency"]'))
              foreach ($dependency in $required) {
                  $name = $dependency.GetAttribute('Name')
                  $minimum = [version]$dependency.GetAttribute('MinVersion')
                  if (!$available.ContainsKey($name) -or $available[$name] -lt $minimum) {
                      throw "Missing packaged dependency: $name >= $minimum. Return the build logs; do not install random runtime files."
                  }
              }
              if (@($required | Where-Object { $_.GetAttribute('Name') -like 'Microsoft.NET.Native*' }).Count) {
                  throw 'This diagnostic unexpectedly targets .NET Native rather than the intended managed runtime.'
              }
              if (!@($required | Where-Object { $_.GetAttribute('Name') -like 'Microsoft.NET.CoreRuntime*' }).Count) {
                  throw 'Expected a UWP CoreRuntime dependency; inspect the manifest before testing.'
              }
              $mainManifest.OuterXml | Set-Content "$out\packaged-manifest.xml" -Encoding utf8

              $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=NexiaXboxManagedProbe' `
                  -KeyUsage DigitalSignature -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 `
                  -CertStoreLocation 'Cert:\CurrentUser\My' `
                  -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3') -NotAfter (Get-Date).AddMonths(6)
              try {
                  & "$kits\bin\$sdk\x64\signtool.exe" sign /fd SHA256 /s My /sha1 $cert.Thumbprint $package
                  if ($LASTEXITCODE -ne 0) { throw 'APPX signing failed.' }
                  Export-Certificate -Cert $cert -FilePath "$out\NexiaXboxManagedProbe.cer" | Out-Null
              } finally { Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -ErrorAction SilentlyContinue }
              Copy-Item $package $out
              Copy-Item "$root\README.txt", "$root\NEXIA-LICENSE.txt", "$root\THIRD-PARTY-NOTICES.txt" $out
              Get-FileHash $package -Algorithm SHA256 | Format-List | Out-File "$out\SHA256.txt"
              Write-Host 'BUILD PASSED. XBOX EXECUTION AND DYNAMIC IL SUPPORT REMAIN UNTESTED.'
          } finally { Stop-Transcript | Out-Null }
          ''', encoding='utf-8')
          (root / 'README.txt').write_text(r'''NEXIA XBOX MANAGED PROBE - SECOND EXPERIMENT, NOT AN EMULATOR

          Purpose
          This is a managed UWP Debug x64 candidate, with .NET Native disabled. It tests
          whether a sideloaded Xbox app can execute dynamically generated IL, read its
          own test DLL bytes from LocalState, rewrite simple IL, and resolve a tiny facade
          made by Nexia's real FacadeFactory.cs. The alternate forwarder-flag test is
          reported independently, not silently substituted for Nexia's original output.

          The existing native diagnostic has passed on the user's Xbox. This NEW managed
          project has not been compiled on Windows or run on Xbox at preparation time.

          Important limits
          This does not embed Nexia's .NET 9 host, MonoGame, XNA runtime, avatars, STFS
          loader, PowerPC emulation, or CastleMiner Z. The Microsoft.Xna.Framework test
          marker is deliberately fake. Its successful forwarding does not mean any real
          XNA API is implemented. Reading a DLL into a byte array then Assembly.Load is
          not the same as testing Assembly.LoadFrom(path) or .NET 9 AssemblyLoadContext.
          A passing result would support further runtime-adaptation work, not prove that
          Nexia's entire host or any game is compatible. A failure needs diagnosis; it
          does not establish that all other runtime approaches are impossible.

          Phone-only build
          1. Add ONLY .github/workflows/xbox-managed-probe.yml to the fork, on Mousehook.
             Copy the complete supplied text file into GitHub's editor. Do not replace
             xbox-probe.yml or move/edit any working emulator files.
          2. Open Actions -> Xbox - Managed Runtime Probe (not emulator).
          3. It runs when this file changes. Otherwise use Run workflow -> Mousehook.
          4. Send the run link so the result and dependencies can be checked before install.

          After a successful, inspected build
          Deploy NexiaXboxManagedProbe_0.2.<run>.0_x64.appx as a separate app through Xbox
          Device Portal. Add all x64 APPX files in the artifact's Dependencies folder.
          The earlier native probe's VCLibs dependency alone may NOT be enough. Never
          uninstall existing framework packages or working emulators to force an install.
          Set this separate test to Game and launch it. Tests run automatically once per
          launch; wait until Finished, then send a photo. No additional game file is needed.
          If installation fails, send the complete error. Do not install the public .cer
          certificate as an iPhone configuration profile. No private signing key is exported.

          Logs
          LocalState/managed-probe-log.txt contains full exceptions as well as result lines.
          The log resets each launch. The app writes only its own LocalState test files.
          No network capability, authentication data, repository secret, or game is used.
          Copy the log before relaunching if the app crashes. A FAIL is a real measured
          result; a SKIP means a prerequisite test did not provide the needed payload.

          Workflow boundaries
          The Windows runner installs/restores the stated NuGet dependencies and packages
          a UWP app. This self-contained workflow does not check out or build the full
          Nexia repository, alter existing repository files, publish a release, or connect
          to the Xbox. Artifacts (including failure logs) are retained for seven days.
          Each run uses an ephemeral development signing certificate. Future update
          issues should be handled only for this test app, after preserving its logs.

          Preparation verification
          YAML, embedded Python, project/manifest XML and source-file round-trip checks
          are performed locally. Windows compile, package installation and runtime tests
          must be assessed from actual subsequent build/console results.

          Sources informing this experiment
          https://devblogs.microsoft.com/dotnet/universal-windows-apps-in-net/
          https://www.nuget.org/packages/Microsoft.NETCore.UniversalWindowsPlatform/6.2.14
          https://www.nuget.org/packages/Mono.Cecil/0.11.6
          https://github.com/microsoft/Windows-universal-samples/blob/main/Samples/Clipboard/cs/Clipboard.csproj
          For source provenance and licenses, see THIRD-PARTY-NOTICES.txt and NEXIA-LICENSE.txt.
          ''', encoding='utf-8')
