      - name: Build and development-sign managed UWP x64
        shell: pwsh
        env:
          PROBE_BUILD_NUMBER: ${{ github.run_number }}
        run: ./xbox-managed-probe/build.ps1 -BuildNumber ([int]$env:PROBE_BUILD_NUMBER)

      - name: Upload signed test package or failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: XboxManagedProbe-x64-${{ github.run_number }}
          path: xbox-managed-probe/out/
          retention-days: 7
          if-no-files-found: warn
