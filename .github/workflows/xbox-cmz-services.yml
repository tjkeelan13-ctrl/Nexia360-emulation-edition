      - name: Write README.txt (1 of 1)
        shell: python
        run: |
          from pathlib import Path
          root = Path("xbox-cmz-services")
          root.mkdir(exist_ok=True)
          with (root / 'README.txt').open('w', encoding="utf-8", newline="") as output:
              output.write(r'''CMZ SERVICES CHECK 0.6 -- EXPERIMENTAL, NOT A PLAYABLE GAME

          Purpose
          Extend the successful assembly loader with missing XNA type declarations and
          explicit experimental offline services. This is not a completed Nexia port.

          Scope
          - Original game inputs and SHA-256 checks are unchanged.
          - The app still does NOT invoke Program.Main or any game constructor.
          - Real local service code implements synthetic local profiles, a small in-process
            session, owned packet queues, create/start/end/join events, and slot-separated
            storage. These are self-tested inside the Xbox app before assembly inspection.
          - No physical-controller integration, world simulation, split-screen camera,
            inventory, gamer picture, original avatar, online matchmaking, license service,
            achievements, or actual game content is exercised here.
          - Many extra XNA declarations come from Nexia's generated signatures. Their
            unimplemented accessors/methods explicitly throw NotSupportedException rather
            than return fake success. Linked types do NOT mean those features work.
          - Local broadcast semantics are provisional: sends target other local players;
            an explicit recipient may be the sender. Exact game protocol use needs testing.
          - Local network sessions reject non-local modes. There are no network capabilities
            and no request to connect to any online service.
          - Device free/total-space reporting and guide/license UI remain explicit blockers.
          - Type mapping now searches past non-public runtime lookalikes and preserves the
            original scopes of nested type references before rewriting them.
          - Field/parameter/return signature inspection records additional metadata errors.
            It is not a method-body/JIT validation or successful game-startup test.

          Install sequence
          1. Add the new workflow .github/workflows/xbox-cmz-services.yml FROM REPOSITORY ROOT.
          2. Wait for a successful build and inspect the output before installation.
          3. The installer retains Name=NexiaCMZLoader and Publisher=CN=NexiaCMZLoader,
             increasing the package version to 0.6.<run>.0. It is intended to update the
             installed 0.5 loader while retaining its game ZIP. Update behavior is untested.
          4. Back up the old cmz-loader-log.txt and keep CastleMinerZ-assemblies.zip on phone.
             Do not uninstall the app or framework packages to resolve an update error.
          5. Install the resulting package via Device Portal, using included dependencies
             if necessary, retain Game mode, and launch.
          6. The expected input remains LocalState/CastleMinerZ-assemblies.zip. The archive
             is not an installer or a framework dependency. Do not publish it on GitHub.
          7. Send the result and LocalState/cmz-loader-log.txt. Log resets on each launch.

          Test limits
          At preparation time only generation, XML, static dependency-name coverage and
          source delimiter checks were performed locally. The UWP C# compilation, package
          update and new runtime self-tests have NOT yet run. Do not describe these sources
          as a verified working game, networking implementation, or avatar renderer.

          Couch co-op target remains two independent local players in one original world.
          The self-test uses synthetic player slots, not two physical controllers. Passing
          it would verify its narrow internal assertions, not couch co-op gameplay.

          Source attribution
          See NEXIA-LICENSE.txt, MONOGAME-LICENSE.txt, THIRD-PARTY-NOTICES.txt and
          SOURCE-PROVENANCE.json. All original game binaries/assets are excluded from this
          source package and workflow. They remain only in the user's original input ZIP.
          ''')

      - name: Build and sign CMZ services check
        shell: pwsh
        env:
          PROBE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/xbox-cmz-services/build.ps1", [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          ./xbox-cmz-services/build.ps1 -BuildNumber ([int]$env:PROBE_BUILD_NUMBER)

      - name: Upload signed package or build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: XboxCMZServices-x64-${{ github.run_number }}
          path: xbox-cmz-services/out/
          retention-days: 7
          if-no-files-found: warn
