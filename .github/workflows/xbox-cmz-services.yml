# Create this workflow from the repository ROOT. Keep old workflow files unchanged.
# Builds an update to CMZ Assembly Loader. No original game binaries are included.
name: Xbox - CMZ Services Bridge

on:
  workflow_dispatch:
  push:
    branches: [Mousehook]
    paths:
      - '.github/workflows/xbox-cmz-services.yml'

permissions:
  contents: read

concurrency:
  group: xbox-cmz-services-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Write App.xaml (1 of 1)
        shell: python
        run: |
          from pathlib import Path
          root = Path("xbox-cmz-services")
          root.mkdir(exist_ok=True)
          with (root / 'App.xaml').open('w', encoding="utf-8", newline="") as output:
              output.write(r'''<Application
              x:Class="NexiaCMZLoader.App"
              xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"
              xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml"
              RequestedTheme="Dark">
              <Application.Resources />
          </Application>
          ''')
      - name: Write App.xaml.cs (1 of 1)
        shell: python
        run: |
          from pathlib import Path
          root = Path("xbox-cmz-services")
          root.mkdir(exist_ok=True)
          with (root / 'App.xaml.cs').open('w', encoding="utf-8", newline="") as output:
              output.write(r'''using System;
          using System.IO;
          using System.Threading.Tasks;
          using Windows.ApplicationModel.Activation;
          using Windows.Storage;
          using Windows.UI.Xaml;
          using Windows.UI.Xaml.Controls;
          using Windows.UI.Xaml.Media;

          namespace NexiaCMZLoader
          {
              sealed partial class App : Application
              {
                  private bool launched;
                  public App()
                  {
                      InitializeComponent();
                      RequiresPointerMode = ApplicationRequiresPointerMode.WhenRequested;
                  }
                  protected override async void OnLaunched(LaunchActivatedEventArgs args)
                  {
                      if (launched) { Window.Current.Activate(); return; }
                      launched = true;
                      var output = new TextBlock {
                          Text = "CASTLEMINER Z ASSEMBLY SERVICES CHECK 0.6\nChecking original game assemblies...\nThis is not playable yet.",
                          FontSize = 22, TextWrapping = TextWrapping.Wrap,
                          Foreground = new SolidColorBrush(Windows.UI.Colors.White),
                          Margin = new Thickness(48, 32, 48, 32)
                      };
                      Window.Current.Content = new ScrollViewer {
                          Content = output, VerticalScrollBarVisibility = ScrollBarVisibility.Auto
                      };
                      Window.Current.Activate();
                      string folder = ApplicationData.Current.LocalFolder.Path;
                      try {
                          output.Text = await Task.Run(() => new CmzLoader(folder).Run());
                      } catch (Exception ex) {
                          output.Text = "LOADER ERROR\n" + ex + "\nNo game was started.";
                          try { File.AppendAllText(Path.Combine(folder, "cmz-loader-log.txt"), ex.ToString()); }
                          catch { }
                      }
                  }
              }
          }
          ''')
      - name: Write CmzLoader.cs (1 of 2)
        shell: python
        run: |
          from pathlib import Path
          root = Path("xbox-cmz-services")
          root.mkdir(exist_ok=True)
          with (root / 'CmzLoader.cs').open('w', encoding="utf-8", newline="") as output:
              output.write(r'''// Read-only original inputs; retargeted copies belong to this test app only.
          // No Main, game constructor, gameplay, online service or avatar is executed.
          using System;
          using System.Collections.Generic;
          using System.IO;
          using System.IO.Compression;
          using System.Linq;
          using System.Reflection;
          using System.Security.Cryptography;
          using Mono.Cecil;
          using Windows.System.Profile;

          namespace NexiaCMZLoader
          {
              internal sealed class CmzLoader
              {
                  private readonly string folder;
                  private readonly string logPath;
                  private readonly List<string> summary = new List<string>();
                  private readonly List<Assembly> providers = new List<Assembly>();
                  private readonly Dictionary<string, Type> typeCache = new Dictionary<string, Type>();
                  private readonly HashSet<string> unresolved = new HashSet<string>();
                  private object context;
                  private MethodInfo loadStream;
                  private int mapped;

                  internal CmzLoader(string localFolder)
                  {
                      folder = localFolder;
                      logPath = Path.Combine(folder, "cmz-loader-log.txt");
                  }
                  private void Log(string text) { File.AppendAllText(logPath, text + "\r\n"); }
                  private void Show(string text) { summary.Add(text); Log(text); }
                  internal string Run()
                  {
                      File.WriteAllText(logPath, "CMZ assembly check " + DateTime.UtcNow.ToString("O") + "\r\n");
                      Show("CASTLEMINER Z ASSEMBLY SERVICES CHECK 0.6 - NOT PLAYABLE");
                      Show("Device: " + AnalyticsInfo.VersionInfo.DeviceFamily);
                      Log("Runtime: " + typeof(object).Assembly.FullName);
                      Log("Couch co-op requirement: two independent local players sharing one world. NOT implemented here.");
                      string zipPath = Path.Combine(folder, "CastleMinerZ-assemblies.zip");
                      if (!File.Exists(zipPath)) {
                          Show("WAITING FOR YOUR GAME FILES");
                          Show("Upload CastleMinerZ-assemblies.zip into this app's LocalState.");
                          Show("Keep the ZIP intact, then fully close and reopen this app.");
                          return string.Join("\n", summary);
                      }
                      try {
                          string originals = Path.Combine(folder, "OriginalAssemblies");
                          string prepared = Path.Combine(folder, "PreparedAssemblies");
                          Directory.CreateDirectory(originals);
                          Directory.CreateDirectory(prepared);
                          Import(zipPath, originals);
                          Show("Original CastleMinerZ.exe + DNA.Common.dll: verified");
                          DiscoverContext();
                          Show("Public stream loader: available");
                          try { Show("Offline services: " + LocalServiceTests.Run(folder)); }
                          catch (Exception serviceError) { Show("Offline service self-test FAILED: " + serviceError.GetType().Name); Log(serviceError.ToString()); }
                          Show("Avatar / online / guide UI APIs are guarded declarations, NOT implemented services.");
                          AddProvider(typeof(LocalServiceTests).Assembly);
                          AddProvider(typeof(object).Assembly);
                          AddProvider(typeof(Enumerable).Assembly);
                          AddProvider(typeof(File).Assembly);
                          AddProvider(typeof(Uri).Assembly);
                          AddProvider(typeof(System.Threading.Thread).Assembly);
                          AddProvider(typeof(Microsoft.Xna.Framework.Game).Assembly);
                          foreach (string name in new[] { "System.Runtime", "System.Collections", "System.Linq",
                              "System.IO", "System.Reflection", "System.Threading", "System.Threading.Tasks",
                              "System.Xml.ReaderWriter", "System.Xml.XDocument", "System.Net.Primitives",
                              "System.Net.Sockets", "System.Runtime.Extensions", "System.Globalization",
                              "System.Console", "System.Threading.Thread", "System.Text.RegularExpressions",
                              "System.Diagnostics.Tools", "System.IO.IsolatedStorage", "System.ComponentModel.Primitives" }) {
                              try { AddProvider(Assembly.Load(new AssemblyName(name))); }
                              catch (Exception ex) { Log("Optional type provider " + name + ": " + ex.Message); }
                          }
                          string[] names = { "DNA.Common.dll", "CastleMinerZ.exe" };
                          foreach (string name in names) {
                              Retarget(Path.Combine(originals, name), Path.Combine(prepared, name));
                          }
                          Show("Framework type references mapped: " + mapped + " (includes guarded declarations)");
                          Show("Unresolved framework type names: " + unresolved.Count + " (details in log)");
                          foreach (string missing in unresolved.OrderBy(x => x)) Log("UNMAPPED " + missing);
                          var loaded = new Dictionary<string, Assembly>();
                          foreach (string name in names) {
                              try {
                                  Assembly assembly;
                                  using (var stream = new MemoryStream(File.ReadAllBytes(Path.Combine(prepared, name))))
                                      assembly = (Assembly)loadStream.Invoke(context, new object[] { stream });
                                  loaded.Add(name, assembly);
                                  Show(name + ": assembly loaded");
                                  Log("Loaded identity: " + assembly.FullName);
                                  InspectTypes(name, assembly);
                                  InspectSignatures(name, assembly);
                              } catch (Exception ex) {
                                  ex = Unwrap(ex);
                                  Show(name + ": LOAD FAILED " + ex.GetType().Name);
                                  Log(ex.ToString());
                              }
                          }
                          Assembly game;
                          if (loaded.TryGetValue("CastleMinerZ.exe", out game)) {
                              try {
                                  Type type = game.GetType("DNA.CastleMinerZ.CastleMinerZGame", true);
                                  bool correctBase = typeof(Microsoft.Xna.Framework.Game).IsAssignableFrom(type);
                                  Show("Actual game class linked to MonoGame: " + correctBase);
                                  Log("Game constructors: " + string.Join("; ", type.GetConstructors().Select(c => c.ToString())));
                              } catch (Exception ex) {
                                  ex = Unwrap(ex);
                                  Show("Actual game class: BLOCKED " + ex.GetType().Name);
                                  Log(ex.ToString());
                              }
                          }
                          Show("CHECK COMPLETE - game NOT started; avatars and couch gameplay NOT implemented.");
                          Show("Send this screen and LocalState/cmz-loader-log.txt.");
                      } catch (Exception ex) {
                          ex = Unwrap(ex);
                          Show("CHECK STOPPED: " + ex.GetType().Name + ": " + ex.Message);
                          Log(ex.ToString());
                          Show("Send LocalState/cmz-loader-log.txt. Do not replace system runtime files.");
                      }
                      return string.Join("\n", summary);
                  }
                  private void Import(string zipPath, string destination)
                  {
                      var hashes = new Dictionary<string, string>(StringComparer.Ordinal) {
                          { "CastleMinerZ.exe", "e378b91ed3c088e8d89094213e5eb064737957c05164ae84a22e4fc766f903a4" },
                          { "DNA.Common.dll", "642853463e0bbdf310ee88956af41cb5c2db5814a12255674ed61e383f8b3d59" }
                      };
                      if (new FileInfo(zipPath).Length > 4 * 1024 * 1024)
                          throw new InvalidDataException("Expected the small two-assembly ZIP, not an entire game archive.");
                      using (var input = File.OpenRead(zipPath))
                      using (var archive = new ZipArchive(input, ZipArchiveMode.Read)) {
                          if (archive.Entries.Count != 2) throw new InvalidDataException("Expected exactly two original assemblies.");
                          var seen = new HashSet<string>(StringComparer.Ordinal);
                          foreach (var entry in archive.Entries) {
                              string expected;
                              if (!hashes.TryGetValue(entry.FullName, out expected) || !seen.Add(entry.FullName))
                                  throw new InvalidDataException("Unexpected or duplicate ZIP entry: " + entry.FullName);
                              long expectedLength = entry.FullName == "CastleMinerZ.exe" ? 439296 : 610304;
                              if (entry.Length != expectedLength) throw new InvalidDataException("Original assembly size mismatch.");
                              var bytes = new byte[(int)expectedLength];
                              using (var stream = entry.Open()) {
                                  int offset = 0;
                                  while (offset < bytes.Length) {
                                      int count = stream.Read(bytes, offset, bytes.Length - offset);
                                      if (count == 0) throw new EndOfStreamException("Incomplete game assembly in ZIP.");
                                      offset += count;
                                  }
                                  if (stream.ReadByte() != -1) throw new InvalidDataException("Oversized ZIP entry.");
                              }
                              string actual;
                              using (var hash = SHA256.Create())
                                  actual = BitConverter.ToString(hash.ComputeHash(bytes)).Replace("-", "").ToLowerInvariant();
                              if (actual != expected) throw new InvalidDataException("Game assembly hash mismatch: " + entry.FullName);
                              File.WriteAllBytes(Path.Combine(destination, entry.FullName), bytes);
                              Log("Original verified: " + entry.FullName + " " + actual);
                          }
                      }
                  }
                  private void DiscoverContext()
                  {
                      Type type = typeof(object).Assembly.GetType("System.Runtime.Loader.AssemblyLoadContext");
                      if (type == null || !type.IsPublic) throw new NotSupportedException("Public load context unavailable.");
                      var property = type.GetProperty("Default", BindingFlags.Public | BindingFlags.Static);
                      context = property == null ? null : property.GetValue(null);
                      loadStream = type.GetMethod("LoadFromStream", BindingFlags.Public | BindingFlags.Instance,
                          null, new Type[] { typeof(Stream) }, null);
                      if (context == null || loadStream == null) throw new NotSupportedException("Public stream loading unavailable.");
                      Log("Context: " + context.GetType().FullName);
                  }
                  private void AddProvider(Assembly assembly)
                  {
                      if (!providers.Contains(assembly)) providers.Add(assembly);
                  }
                  private static bool PublicType(Type type) { return type != null && (type.IsPublic || type.IsNestedPublic); }
                  private Type RuntimeType(string name, bool xna)
                  {
                      string key = (xna ? "XNA:" : "BCL:") + name;
                      Type cached;
                      if (typeCache.TryGetValue(key, out cached)) return cached;
                      string full = name.Replace('/', '+');
                      // A non-public CoreLib lookalike must not stop the search for a public facade type.
                      var candidates = xna
                          ? new [] { typeof(LocalServiceTests).Assembly, typeof(Microsoft.Xna.Framework.Game).Assembly }
                          : providers.ToArray();
                      foreach (var provider in candidates) {
                          Type type = null;
                          try { type = provider.GetType(full, false); }
                          catch (Exception ex) { Log("TYPE PROVIDER " + provider.GetName().Name + " " + full + ": " + ex.Message); }
                          if (!PublicType(type)) continue;
                          typeCache[key] = type;
                          Log("MAP " + key + " -> " + type.Assembly.GetName().Name);
                          return type;
                      }
                      if (!xna) {
                          Type type = Type.GetType(full, false);
                          if (PublicType(type)) { typeCache[key]=type; return type; }
                      }
                      typeCache[key]=null;
                      return null;
                  }
                  private void Retarget(string original, string output)
                  {
                      using (var definition = AssemblyDefinition.ReadAssembly(original, new ReaderParameters {
                          ReadingMode = ReadingMode.Deferred, ReadSymbols = false
                      })) {
                          var module = definition.MainModule;
                          if ((module.Attributes & ModuleAttributes.ILOnly) == 0)
                              throw new NotSupportedException("Only pure managed IL is accepted.");
                          Log("Original " + Path.GetFileName(original) + " metadata " + module.RuntimeVersion);
                          foreach (var reference in module.AssemblyReferences) Log("Assembly reference: " + reference.FullName);
                          // Rewrite copies only. Unknown APIs remain unknown rather than being replaced with no-op stubs.
                          // Capture original scopes first: rewriting a parent must not hide a nested reference.
                          var references = module.GetTypeReferences().Select(reference => {
                              TypeReference outer = reference;
          ''')
      - name: Write CmzLoader.cs (2 of 2)
        shell: python
        run: |
          from pathlib import Path
          root = Path("xbox-cmz-services")
          root.mkdir(exist_ok=True)
          with (root / 'CmzLoader.cs').open('a', encoding="utf-8", newline="") as output:
              output.write(r'''                    while (outer.DeclaringType != null) outer=outer.DeclaringType;
                              var scope = outer.Scope as AssemblyNameReference;
                              return new { Reference=reference, Outer=outer, Name=reference.FullName,
                                  Source=scope == null ? "" : scope.Name };
                          }).ToArray();
                          foreach (var item in references) {
                              bool xna=item.Source.StartsWith("Microsoft.Xna.Framework",StringComparison.Ordinal);
                              bool bcl=item.Source=="mscorlib" || item.Source=="System" || item.Source=="System.Core";
                              if (!xna && !bcl) continue;
                              Type type=RuntimeType(item.Name,xna);
                              if (type==null) { unresolved.Add(item.Source + " :: " + item.Name); continue; }
                              var imported=module.ImportReference(type);
                              item.Outer.Scope=imported.Scope;
                              item.Reference.Scope=imported.Scope;
                              mapped++;
                          }
                          // Original CF binary is IL-only; target the CLR metadata used by this experimental host.
                          module.RuntimeVersion = "v4.0.30319";
                          module.Attributes &= ~ModuleAttributes.Required32Bit;
                          module.Attributes &= ~ModuleAttributes.Preferred32Bit;
                          definition.Write(output);
                          Log("Wrote retargeted app-local copy: " + Path.GetFileName(output));
                      }
                  }
                  private void InspectTypes(string name, Assembly assembly)
                  {
                      try {
                          var types = assembly.GetTypes();
                          Show(name + ": " + types.Length + " types linked");
                      } catch (ReflectionTypeLoadException ex) {
                          int available = ex.Types.Count(t => t != null);
                          Show(name + ": " + available + "/" + ex.Types.Length + " types linked; missing APIs in log");
                          foreach (var error in ex.LoaderExceptions.Where(e => e != null)
                              .Select(e => e.ToString()).Distinct()) Log("TYPE LOAD ERROR " + error);
                      } catch (Exception ex) {
                          Show(name + ": type inspection failed " + ex.GetType().Name);
                          Log(ex.ToString());
                      }
                  }
                  private void InspectSignatures(string name, Assembly assembly) {
                      Type[] types;
                      try { types=assembly.GetTypes(); }
                      catch (ReflectionTypeLoadException ex) { types=ex.Types.Where(t=>t!=null).ToArray(); }
                      int good=0, bad=0;
                      var flags=BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance|BindingFlags.Static|BindingFlags.DeclaredOnly;
                      foreach(var type in types) {
                          try {
                              foreach(var field in type.GetFields(flags)) { var fieldType=field.FieldType; good++; }
                          } catch(Exception ex) { bad++;Log("FIELD SIGNATURE " + type.FullName + " " + Unwrap(ex)); }
                          MethodBase[] methods;
                          try { methods=type.GetMethods(flags).Cast<MethodBase>().Concat(type.GetConstructors(flags)).ToArray(); }
                          catch(Exception ex) { bad++;Log("METHOD ENUMERATION " + type.FullName + " " + Unwrap(ex));continue; }
                          foreach(var method in methods) {
                              try {
                                  foreach(var parameter in method.GetParameters()) { var parameterType=parameter.ParameterType; }
                                  var info=method as MethodInfo;
                                  if(info!=null) { var returnType=info.ReturnType; }
                                  good++;
                              } catch(Exception ex) { bad++;Log("METHOD SIGNATURE " + type.FullName + "." + method.Name + " " + Unwrap(ex)); }
                          }
                      }
                      Show(name + ": signatures inspected=" + good + "; errors=" + bad + " (no method execution)");
                  }
                  private static Exception Unwrap(Exception ex)
                  {
                      while (ex is TargetInvocationException && ex.InnerException != null) ex = ex.InnerException;
                      return ex;
                  }
              }
          }
          ''')
      - name: Write LocalServices.cs (1 of 3)
        shell: python
        run: |
          from pathlib import Path
          root = Path("xbox-cmz-services")
          root.mkdir(exist_ok=True)
          with (root / 'LocalServices.cs').open('w', encoding="utf-8", newline="") as output:
              output.write(r'''// Experimental offline-only XNA services. No Xbox Live, real avatar rendering or game startup.
          // The local-session tests use synthetic local slots, not detected physical controllers.
          using System;
          using System.Collections;
          using System.Collections.Generic;
          using System.Collections.ObjectModel;
          using System.IO;
          using System.Linq;
          using System.Threading;
          using Microsoft.Xna.Framework;
          using Microsoft.Xna.Framework.GamerServices;
          using Microsoft.Xna.Framework.Net;

          namespace NexiaCMZLoader {
              internal static class CompatUnavailable {
                  internal static Exception Create(string api) {
                      return new NotSupportedException("CMZ port: not implemented: " + api);
                  }
              }
              internal sealed class CompletedOperation<T> : IAsyncResult {
                  private static readonly ManualResetEvent Completed = new ManualResetEvent(true);
                  internal readonly T Value;
                  internal readonly string Kind;
                  public object AsyncState { get; private set; }
                  public WaitHandle AsyncWaitHandle { get { return Completed; } }
                  public bool CompletedSynchronously { get { return true; } }
                  public bool IsCompleted { get { return true; } }
                  internal CompletedOperation(string kind, T value, object state, AsyncCallback callback) {
                      Kind = kind; Value = value; AsyncState = state;
                      if (callback != null) callback(this);
                  }
                  internal static T End(string kind, IAsyncResult result) {
                      var operation = result as CompletedOperation<T>;
                      if (operation == null || operation.Kind != kind) throw new ArgumentException("Wrong asynchronous operation");
                      return operation.Value;
                  }
              }
              internal static class LocalHost {
                  internal static string Root;
                  internal static bool IsAvailable { get { return Root != null; } }
                  internal static ulong StorageFreeSpace { get { throw CompatUnavailable.Create("StorageDevice.FreeSpace"); } }
                  internal static ulong StorageTotalSpace { get { throw CompatUnavailable.Create("StorageDevice.TotalSpace"); } }
                  internal static string ResolveStorageContainer(int slot, string title) {
                      if (slot < 0 || slot > 3) throw new ArgumentOutOfRangeException("slot");
                      if (Root == null) throw new InvalidOperationException("Local storage not initialized");
                      if (string.IsNullOrWhiteSpace(title) || title == "." || title == ".." ||
                          title.IndexOfAny(new char[]{'/', '\\', ':'}) >= 0 || title.IndexOfAny(Path.GetInvalidFileNameChars()) >= 0)
                          throw new ArgumentException("Invalid container name", "title");
                      string path = Path.Combine(Root, "LocalSlots", slot.ToString(), title);
                      Directory.CreateDirectory(path);
                      return path;
                  }
              }
              internal static class LocalServiceTests {
                  private static void Require(bool value, string description) {
                      if (!value) throw new InvalidOperationException("Local service self-test: " + description);
                  }
                  internal static string Run(string folder) {
                      // Isolate test writes and synthetic profiles from future real player saves.
                      LocalHost.Root = Path.Combine(folder, "ServiceSelfTest");
                      Directory.CreateDirectory(LocalHost.Root);
                      try {
                          var one = LocalProfiles.Join(PlayerIndex.One);
                          var two = LocalProfiles.Join(PlayerIndex.Two);
                          Require(object.ReferenceEquals(one, LocalProfiles.Join(PlayerIndex.One)), "unstable profile identity");
                          Require(Gamer.SignedInGamers[PlayerIndex.Two] == two, "slot lookup");
                          one.Tag = "one"; two.Tag = "two";
                          Require(!object.Equals(one.Tag, two.Tag), "shared player Tag");
                          var props = new NetworkSessionProperties(); props[0] = 73;
                          var state = new object(); int callbacks = 0;
                          var ar = NetworkSession.BeginCreate(NetworkSessionType.Local, new[]{one,two}, 4, 0, props,
                              x => { Require(object.ReferenceEquals(x.AsyncState, state), "async state"); callbacks++; }, state);
                          using (var session = NetworkSession.EndCreate(ar)) {
                              int joined = 0, started = 0, ended = 0;
                              session.GamerJoined += (s,e) => joined++;
                              session.GameStarted += (s,e) => started++;
                              session.GameEnded += (s,e) => ended++;
                              session.Update();
                              Require(callbacks == 1 && joined == 2, "create/join events");
                              Require(session.LocalGamers.Count == 2 && session.AllGamers.Count == 2 && session.RemoteGamers.Count == 0, "membership");
                              Require(session.SessionProperties[0] == 73, "properties");
                              var a = session.LocalGamers[0]; var b = session.LocalGamers[1];
                              var bytes = new byte[]{9,8,7,6};
                              a.SendData(bytes, 1, 2, SendDataOptions.ReliableInOrder, b);
                              bytes[1] = 0;
                              Require(b.IsDataAvailable && !a.IsDataAvailable, "recipient isolation");
                              NetworkGamer sender; var received = new byte[8];
                              int n = b.ReceiveData(received, 2, out sender);
                              Require(n == 2 && received[2] == 8 && received[3] == 7 && sender == a && !b.IsDataAvailable, "copied packet data/sender");
                              a.IsReady = true; b.IsReady = true; Require(session.IsEveryoneReady, "readiness");
                              session.StartGame(); session.Update();
                              Require(session.SessionState == NetworkSessionState.Playing && started == 1, "start event");
                              session.EndGame(); session.Update();
                              Require(session.SessionState == NetworkSessionState.Lobby && ended == 1, "end event");
                          }
                          string marker0 = "slot0:" + Guid.NewGuid(); string marker1 = "slot1:" + Guid.NewGuid();
                          for (int i = 0; i < 2; i++) {
                              var device = Microsoft.Xna.Framework.Storage.StorageDevice.EndShowSelector(
                                  Microsoft.Xna.Framework.Storage.StorageDevice.BeginShowSelector((PlayerIndex)i, null, null));
                              using (var container = device.EndOpenContainer(device.BeginOpenContainer("Probe",null,null))) {
                                  using (var writer = new StreamWriter(container.CreateFile("value.txt"))) writer.Write(i == 0 ? marker0 : marker1);
                                  bool blocked = false;
                                  try { container.FileExists("../ProbeSibling/value.txt"); }
                                  catch (ArgumentException) { blocked = true; }
                                  Require(blocked, "storage directory escape was not rejected");
                              }
                          }
                          for (int i = 0; i < 2; i++) {
                              var device = Microsoft.Xna.Framework.Storage.StorageDevice.EndShowSelector(
                                  Microsoft.Xna.Framework.Storage.StorageDevice.BeginShowSelector((PlayerIndex)i, null, null));
                              using (var container = device.EndOpenContainer(device.BeginOpenContainer("Probe",null,null)))
                              using (var reader = new StreamReader(container.OpenFile("value.txt",FileMode.Open,FileAccess.Read)))
                                  Require(reader.ReadToEnd() == (i == 0 ? marker0 : marker1), "player save isolation");
                          }
                          bool unsupported = false;
                          try { NetworkSession.Create(NetworkSessionType.PlayerMatch,2,4); }
                          catch (NotSupportedException) { unsupported = true; }
                          Require(unsupported, "online mode must not pretend to work");
                          bool avatarBlocked = false;
                          try { AvatarDescription.CreateRandom(); }
                          catch (NotSupportedException) { avatarBlocked = true; }
                          Require(avatarBlocked, "unimplemented avatar API must fail explicitly");
                          return "synthetic 2-slot session, packet routing, events and separate storage PASS (not controller/gameplay test)";
                      } finally {
                          LocalProfiles.Clear();
                          LocalHost.Root = Path.Combine(folder, "FutureGameStorage");
                      }
                  }
              }
          }

          namespace Microsoft.Xna.Framework.GamerServices {
              public class GamerCollection<T> : ReadOnlyCollection<T> {
                  public GamerCollection() : base(new List<T>()) { }
                  internal GamerCollection(IList<T> items) : base(items) { }
                  // The console XNA assembly exposes this concrete nested enumerator.
                  public new GamerCollectionEnumerator GetEnumerator() { return new GamerCollectionEnumerator(this); }
                  public struct GamerCollectionEnumerator : IEnumerator<T> {
