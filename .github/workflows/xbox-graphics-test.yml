# New workflow. Create from the repository root; do not edit old probe workflows.
name: Xbox - Graphics Integration

on:
  workflow_dispatch:
  push:
    branches: [Mousehook]
    paths:
      - '.github/workflows/xbox-graphics-test.yml'

permissions:
  contents: read

concurrency:
  group: xbox-graphics-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Prepare dynamic scene and MonoGame UWP host
        shell: python
        run: |
          import hashlib
          import re
          import textwrap
          from pathlib import Path
          from urllib.request import urlopen

          # Reuse the preparation logic of the previously successful managed build.
          url = ('https://raw.githubusercontent.com/'
                 'tjkeelan13-ctrl/Nexia360-emulation-edition/'
                 'c1a9d425bba580f1198f34dae728236028d9f616/'
                 '.github/workflows/xbox-managed-build.yml')
          with urlopen(url, timeout=45) as response:
              data = response.read()
          if hashlib.sha256(data).hexdigest() != '8125a5447c4769bb0579d555751929c6be565c0655167fe74ea5496dcd116ae2':
              raise RuntimeError('Base workflow integrity mismatch')
          blocks = re.findall(r'(?m)^        run: \|\n((?: {10}.*\n|\n)*)', data.decode('utf-8-sig'))
          if len(blocks) != 2:
              raise RuntimeError('Unexpected base workflow structure')
          exec(compile(textwrap.dedent(blocks[0]), 'verified-managed-preparation', 'exec'), {})
          root = Path('xbox-managed-probe')
          for name in ['App.xaml', 'ManagedProbe.csproj', 'Package.appxmanifest', 'build.ps1']:
              path = root / name
              text = path.read_text(encoding='utf-8')
              text = text.replace('NexiaXboxManagedProbe', 'NexiaXboxGraphicsProbe')
              text = text.replace('Nexia Managed Probe', 'Nexia Graphics Probe')
              text = text.replace('0.2.', '0.4.')
              text = text.replace('0cf44b44-3d0a-4c82-969b-cfb64774c99e', '6d44bb2e-cebd-4409-b4ca-c2827b8c09f2')
              text = text.replace('0CF44B44-3D0A-4C82-969B-CFB64774C99E', '6D44BB2E-CEBD-4409-B4CA-C2827B8C09F2')
              path.write_text(text, encoding='utf-8')

          def patch(name, before, after):
              path = root / name
              text = path.read_text(encoding='utf-8')
              if text.count(before) != 1:
                  raise RuntimeError('Patch location missing or ambiguous: ' + name)
              path.write_text(text.replace(before, after, 1), encoding='utf-8')

          (root / 'App.xaml.cs').write_text(r'''// Stage 0.4: original graphics integration experiment, NOT the Nexia emulator.
          using System;
          using System.Collections.Generic;
          using System.IO;
          using System.Linq;
          using Windows.ApplicationModel.Activation;
          using Windows.Storage;
          using Windows.System.Profile;
          using Windows.UI.Xaml;
          using Windows.UI.Xaml.Controls;
          using Windows.UI.Xaml.Media;

          namespace NexiaXboxGraphicsProbe
          {
              internal static class Report
              {
                  private static readonly object Gate = new object();
                  private static readonly Dictionary<string, string> Values = new Dictionary<string, string>();
                  public static string Folder;
                  public static void Set(string key, string value)
                  {
                      lock (Gate) {
                          if (Values.ContainsKey(key) && Values[key] == value) return;
                          Values[key] = value;
                          try { File.AppendAllText(Path.Combine(Folder, "graphics-probe-log.txt"),
                              DateTime.UtcNow.ToString("O") + " " + key + ": " + value + "\r\n"); }
                          catch { }
                      }
                  }
                  public static string Snapshot()
                  {
                      lock (Gate) return "NEXIA GRAPHICS PROBE 0.4 - NOT THE EMULATOR\n" +
                          string.Join("\n", Values.Select(p => p.Key + ": " + p.Value)) +
                          "\nLEFT STICK: orbit/zoom | A: change color | X: save | Y: quiet tone";
                  }
                  public static void Error(string stage, Exception exception)
                  {
                      while (exception is System.Reflection.TargetInvocationException && exception.InnerException != null)
                          exception = exception.InnerException;
                      Set(stage + " ERROR", exception.ToString());
                  }
              }
              sealed partial class App : Application
              {
                  private bool launched, started;
                  private BridgeGame game;
                  private DispatcherTimer timer;
                  public App()
                  {
                      InitializeComponent();
                      RequiresPointerMode = ApplicationRequiresPointerMode.WhenRequested;
                      UnhandledException += (s, e) => Report.Error("Unhandled", e.Exception);
                  }
                  protected override void OnLaunched(LaunchActivatedEventArgs args)
                  {
                      if (launched) { Window.Current.Activate(); return; }
                      launched = true;
                      Report.Folder = ApplicationData.Current.LocalFolder.Path;
                      File.WriteAllText(Path.Combine(Report.Folder, "graphics-probe-log.txt"), "Graphics probe startup\r\n");
                      Report.Set("Device", AnalyticsInfo.VersionInfo.DeviceFamily);
                      Report.Set("Scene", "starting - no game files used");
                      var panel = new SwapChainPanel();
                      var text = new TextBlock { FontSize = 19, TextWrapping = TextWrapping.Wrap,
                          Foreground = new SolidColorBrush(Windows.UI.Colors.White), Margin = new Thickness(14) };
                      var overlay = new Border { Background = new SolidColorBrush(Windows.UI.Color.FromArgb(215, 9, 16, 24)),
                          Margin = new Thickness(40, 24, 40, 0), VerticalAlignment = VerticalAlignment.Top,
                          MaxHeight = 300, IsHitTestVisible = false, Child = text };
                      var grid = new Grid(); grid.Children.Add(panel); grid.Children.Add(overlay);
                      panel.Loaded += (s, e) => {
                          if (started) return;
                          started = true;
                          try {
                              game = MonoGame.Framework.XamlGame<BridgeGame>.Create(
                                  args.Arguments ?? "", Window.Current.CoreWindow, panel);
                          } catch (Exception ex) { Report.Error("Host startup", ex); }
                      };
                      timer = new DispatcherTimer { Interval = TimeSpan.FromMilliseconds(250) };
                      timer.Tick += (s, e) => text.Text = Report.Snapshot();
                      timer.Start();
                      Window.Current.Content = grid;
                      Window.Current.Activate();
                  }
              }
          }
          ''', encoding='utf-8')

          (root / 'BridgeGame.cs').write_text(r'''using System;
          using System.IO;
          using System.Reflection;
          using Microsoft.Xna.Framework;
          using Microsoft.Xna.Framework.Graphics;
          using Windows.ApplicationModel;

          namespace NexiaXboxGraphicsProbe
          {
              public sealed class BridgeGame : Game
              {
                  private readonly GraphicsDeviceManager graphics;
                  private Action<float> updateScene;
                  private Action drawScene, disposeScene;
                  private Func<string> sceneStatus;
                  private bool failed;
                  private long frames;
                  public BridgeGame()
                  {
                      graphics = new GraphicsDeviceManager(this) {
                          PreferredBackBufferWidth = 1280, PreferredBackBufferHeight = 720,
                          GraphicsProfile = GraphicsProfile.HiDef,
                          PreferredDepthStencilFormat = DepthFormat.Depth24Stencil8,
                          SynchronizeWithVerticalRetrace = true
                      };
                      IsFixedTimeStep = true;
                      TargetElapsedTime = TimeSpan.FromSeconds(1.0 / 60.0);
                      IsMouseVisible = false;
                  }
                  protected override void LoadContent()
                  {
                      try {
                          Report.Set("MonoGame", typeof(Game).Assembly.FullName);
                          Report.Set("Graphics", "device created; " + GraphicsDevice.GraphicsProfile);
                          string packaged = Path.Combine(Package.Current.InstalledLocation.Path, "Payload", "scene.bin");
                          string local = Path.Combine(Report.Folder, "NexiaDynamicScene.dll");
                          File.Copy(packaged, local, true);
                          Type contextType = typeof(object).Assembly.GetType("System.Runtime.Loader.AssemblyLoadContext");
                          if (contextType == null || !contextType.IsPublic)
                              throw new NotSupportedException("Public load context is unavailable");
                          var defaultProperty = contextType.GetProperty("Default", BindingFlags.Public | BindingFlags.Static);
                          object context = defaultProperty == null ? null : defaultProperty.GetValue(null);
                          if (context == null) throw new NotSupportedException("No default load context");
                          var loader = contextType.GetMethod("LoadFromStream", BindingFlags.Public | BindingFlags.Instance,
                              null, new Type[] { typeof(Stream) }, null);
                          if (loader == null) throw new NotSupportedException("No public LoadFromStream method");
                          Assembly assembly;
                          using (var stream = new MemoryStream(File.ReadAllBytes(local)))
                              assembly = (Assembly)loader.Invoke(context, new object[] { stream });
                          Type type = assembly.GetType("NexiaDynamicScene.Scene", true);
                          object scene = Activator.CreateInstance(type, new object[] {
                              GraphicsDevice, Report.Folder, new Action<string>(m => Report.Set("Scene event", m)) });
                          updateScene = (Action<float>)type.GetMethod("Update").CreateDelegate(typeof(Action<float>), scene);
                          drawScene = (Action)type.GetMethod("Draw").CreateDelegate(typeof(Action), scene);
                          disposeScene = (Action)type.GetMethod("Dispose").CreateDelegate(typeof(Action), scene);
                          sceneStatus = (Func<string>)type.GetMethod("Status").CreateDelegate(typeof(Func<string>), scene);
                          Report.Set("Dynamic scene", "PASS - stream-loaded DLL uses the host GraphicsDevice");
                          Report.Set("Scene", "3D shader/texture readback PASS; await controller input");
                      } catch (Exception ex) { failed = true; Report.Error("Scene load", ex); }
                  }
                  protected override void Update(GameTime time)
                  {
                      if (!failed && updateScene != null) {
                          try { updateScene(Math.Min(0.05f, (float)time.ElapsedGameTime.TotalSeconds)); }
                          catch (Exception ex) { failed = true; Report.Error("Scene update", ex); }
                      }
                      base.Update(time);
                  }
                  protected override void Draw(GameTime time)
                  {
                      if (!failed && drawScene != null) {
                          try {
                              drawScene();
                              frames++;
                              if (frames % 120 == 0) Report.Set("Live scene", "draws=" + frames + "; " + sceneStatus());
                          } catch (Exception ex) { failed = true; Report.Error("Scene draw", ex); }
                      } else { GraphicsDevice.Clear(new Color(50, 10, 20)); }
                      base.Draw(time);
                  }
                  protected override void UnloadContent()
                  {
                      try { if (disposeScene != null) disposeScene(); }
                      catch (Exception ex) { Report.Error("Dispose", ex); }
                      base.UnloadContent();
                  }
              }
          }
          ''', encoding='utf-8')

          (root / 'Scene.cs').write_text(r'''// A separate, original XNA-API scene. Not CastleMiner Z and not Xbox 360 game code.
          using System;
          using System.Collections.Generic;
          using System.Globalization;
          using System.IO;
          using Microsoft.Xna.Framework;
          using Microsoft.Xna.Framework.Audio;
          using Microsoft.Xna.Framework.Graphics;
          using Microsoft.Xna.Framework.Input;

          namespace NexiaDynamicScene
          {
              public sealed class Scene : IDisposable
              {
                  private readonly GraphicsDevice device;
                  private readonly Action<string> log;
                  private readonly string savePath;
                  private readonly BasicEffect effect;
                  private readonly Texture2D texture;
                  private readonly VertexPositionColorTexture[] cube;
                  private SoundEffect tone;
                  private GamePadState previous;
                  private float orbit, distance = 9, spin;
                  private bool connected, movementSeen;
                  private int palette, colorPresses;
                  private string saveState = "not tested", audioState = "not tested";
                  public Scene(GraphicsDevice graphics, string folder, Action<string> report)
                  {
                      device = graphics; log = report; savePath = Path.Combine(folder, "scene-save.txt");
                      texture = new Texture2D(device, 16, 16);
                      var pixels = new Color[256];
                      for (int y = 0; y < 16; y++) for (int x = 0; x < 16; x++)
                          pixels[y * 16 + x] = ((x / 4 + y / 4) % 2 == 0) ? Color.White : new Color(100, 160, 210);
                      texture.SetData(pixels);
                      effect = new BasicEffect(device) { TextureEnabled = true, Texture = texture, VertexColorEnabled = true };
                      cube = MakeCube();
                      VerifyRendering();
                      if (File.Exists(savePath)) {
                          try {
                              string[] parts = File.ReadAllText(savePath).Split('|');
                              if (parts.Length != 2) throw new InvalidDataException("Unexpected saved state");
                              float yaw = float.Parse(parts[0], CultureInfo.InvariantCulture);
                              int color = int.Parse(parts[1], CultureInfo.InvariantCulture);
                              if (float.IsNaN(yaw) || float.IsInfinity(yaw) || color < 0 || color > 2)
                                  throw new InvalidDataException("Saved values out of range");
                              orbit = yaw; palette = color; saveState = "restored on launch";
                              log("Storage: saved orbit/color restored");
                          } catch (Exception ex) { saveState = "restore FAILED"; log(ex.ToString()); }
                      }
                  }
                  private static VertexPositionColorTexture[] MakeCube()
                  {
                      var list = new List<VertexPositionColorTexture>();
                      Action<Vector3, Vector3, Vector3, Vector3, Color> face = (a, b, c, d, color) => {
                          list.Add(new VertexPositionColorTexture(a, color, new Vector2(0, 1)));
                          list.Add(new VertexPositionColorTexture(b, color, new Vector2(0, 0)));
                          list.Add(new VertexPositionColorTexture(c, color, new Vector2(1, 0)));
                          list.Add(new VertexPositionColorTexture(a, color, new Vector2(0, 1)));
                          list.Add(new VertexPositionColorTexture(c, color, new Vector2(1, 0)));
                          list.Add(new VertexPositionColorTexture(d, color, new Vector2(1, 1)));
                      };
                      face(new Vector3(-1,-1,1), new Vector3(-1,1,1), new Vector3(1,1,1), new Vector3(1,-1,1), Color.White);
                      face(new Vector3(1,-1,-1), new Vector3(1,1,-1), new Vector3(-1,1,-1), new Vector3(-1,-1,-1), new Color(170,170,170));
                      face(new Vector3(-1,-1,-1), new Vector3(-1,1,-1), new Vector3(-1,1,1), new Vector3(-1,-1,1), new Color(190,190,190));
                      face(new Vector3(1,-1,1), new Vector3(1,1,1), new Vector3(1,1,-1), new Vector3(1,-1,-1), new Color(220,220,220));
                      face(new Vector3(-1,1,1), new Vector3(-1,1,-1), new Vector3(1,1,-1), new Vector3(1,1,1), Color.White);
                      face(new Vector3(-1,-1,-1), new Vector3(-1,-1,1), new Vector3(1,-1,1), new Vector3(1,-1,-1), new Color(140,140,140));
                      return list.ToArray();
                  }
                  private void SetStates()
                  {
                      device.BlendState = BlendState.Opaque;
                      device.DepthStencilState = DepthStencilState.Default;
                      device.RasterizerState = RasterizerState.CullNone;
                      device.SamplerStates[0] = SamplerState.PointWrap;
                  }
                  private void DrawCube(Matrix world, Vector3 tint)
                  {
                      effect.World = world; effect.DiffuseColor = tint;
                      foreach (var pass in effect.CurrentTechnique.Passes) {
                          pass.Apply(); device.DrawUserPrimitives(PrimitiveType.TriangleList, cube, 0, cube.Length / 3);
                      }
                  }
                  private void VerifyRendering()
                  {
                      var previousTargets = device.GetRenderTargets();
                      using (var target = new RenderTarget2D(device, 64, 64, false, SurfaceFormat.Color, DepthFormat.Depth24Stencil8)) {
                          try {
                              device.SetRenderTarget(target); device.Clear(Color.Magenta); SetStates();
                              effect.View = Matrix.CreateLookAt(new Vector3(0, 0, 4), Vector3.Zero, Vector3.Up);
                              effect.Projection = Matrix.CreatePerspectiveFieldOfView(MathHelper.PiOver4, 1, 0.1f, 30);
                              DrawCube(Matrix.CreateRotationY(0.4f), Vector3.One);
                          } finally { device.SetRenderTargets(previousTargets); }
                          var pixels = new Color[4096]; target.GetData(pixels);
                          int changed = 0;
                          foreach (var pixel in pixels) if (pixel != Color.Magenta) changed++;
                          if (changed < 100) throw new InvalidOperationException("3D render-target readback failed: " + changed);
                          log("GPU readback PASS: " + changed + " pixels changed after textured BasicEffect draw");
                      }
                  }
                  public void Update(float dt)
                  {
                      spin += dt * 0.45f;
                      GamePadState pad = default(GamePadState);
                      for (int i = 0; i < 4; i++) {
                          var candidate = GamePad.GetState((PlayerIndex)i);
                          if (candidate.IsConnected) { pad = candidate; break; }
                      }
                      if (connected != pad.IsConnected) { connected = pad.IsConnected; log("Controller connected=" + connected); }
                      if (connected) {
                          Vector2 stick = pad.ThumbSticks.Left;
                          orbit += stick.X * dt * 1.8f;
                          distance = MathHelper.Clamp(distance - stick.Y * dt * 5, 5, 16);
                          if (!movementSeen && stick.LengthSquared() > 0.1f) { movementSeen = true; log("Controller movement observed"); }
                          if (pad.IsButtonDown(Buttons.A) && previous.IsButtonUp(Buttons.A)) {
                              palette = (palette + 1) % 3; colorPresses++; log("A button: scene color changed " + colorPresses);
                          }
                          if (pad.IsButtonDown(Buttons.X) && previous.IsButtonUp(Buttons.X)) {
                              try {
                                  string data = orbit.ToString("R", CultureInfo.InvariantCulture) + "|" + palette.ToString(CultureInfo.InvariantCulture);
                                  File.WriteAllText(savePath, data);
                                  if (File.ReadAllText(savePath) != data) throw new IOException("Save readback mismatch");
                                  saveState = "write/read PASS"; log("Save write/read PASS; relaunch to check restoration");
                              } catch (Exception ex) { saveState = "FAILED"; log(ex.ToString()); }
                          }
                          if (pad.IsButtonDown(Buttons.Y) && previous.IsButtonUp(Buttons.Y)) {
                              try {
                                  if (tone == null) {
                                      const int rate = 22050, samples = 4410;
                                      byte[] pcm = new byte[samples * 2];
                                      for (int i = 0; i < samples; i++) {
                                          double envelope = Math.Sin(Math.PI * i / (samples - 1));
                                          short value = (short)(Math.Sin(2 * Math.PI * 440 * i / rate) * envelope * 4000);
                                          pcm[i * 2] = (byte)(value & 255); pcm[i * 2 + 1] = (byte)((value >> 8) & 255);
                                      }
                                      tone = new SoundEffect(pcm, rate, AudioChannels.Mono);
                                  }
                                  bool accepted = tone.Play(0.35f, 0, 0);
                                  audioState = accepted ? "submitted - confirm hearing" : "play rejected";
                                  log("Audio " + audioState);
                              } catch (Exception ex) { audioState = "FAILED"; log(ex.ToString()); }
                          }
                      }
                      previous = pad;
                  }
                  public void Draw()
                  {
                      device.Clear(new Color(15, 25, 42)); SetStates();
                      effect.View = Matrix.CreateLookAt(new Vector3((float)Math.Sin(orbit) * distance, 4.5f,
                          (float)Math.Cos(orbit) * distance), new Vector3(0, 0.5f, 0), Vector3.Up);
                      effect.Projection = Matrix.CreatePerspectiveFieldOfView(MathHelper.PiOver4,
                          Math.Max(0.1f, device.Viewport.AspectRatio), 0.1f, 100);
                      DrawCube(Matrix.CreateScale(5, 0.15f, 5) * Matrix.CreateTranslation(0, -1.3f, 0), new Vector3(0.45f, 0.6f, 0.7f));
                      for (int i = 0; i < 6; i++) {
                          float a = i * MathHelper.TwoPi / 6;
                          DrawCube(Matrix.CreateScale(0.45f, 0.65f, 0.45f) * Matrix.CreateTranslation((float)Math.Sin(a) * 3, -0.5f,
                              (float)Math.Cos(a) * 3), new Vector3(0.7f, 0.7f, 0.8f));
                      }
                      Vector3 tint = palette == 0 ? Vector3.One : palette == 1 ? new Vector3(1, 0.4f, 0.25f) : new Vector3(0.35f, 1, 0.55f);
                      DrawCube(Matrix.CreateRotationY(spin) * Matrix.CreateRotationX(0.15f), tint);
                  }
                  public string Status()
                  {
                      return "pad=" + (connected ? "connected" : "WAITING") + "; movement=" + movementSeen +
                          "; A=" + colorPresses + "; save=" + saveState + "; audio=" + audioState;
                  }
                  public void Dispose() { if (tone != null) tone.Dispose(); effect.Dispose(); texture.Dispose(); }
              }
          }
          ''', encoding='utf-8')

          patch('ManagedProbe.csproj', '<Compile Include="ProbeTests.cs" />', '<Compile Include="BridgeGame.cs" />')
          patch('ManagedProbe.csproj', '<Compile Include="NexiaFacadeFactory.cs" />', r'<Content Include="Payload\scene.bin" />')
          patch('ManagedProbe.csproj', '<PackageReference Include="Mono.Cecil" Version="0.11.6" />',
                '<PackageReference Include="MonoGame.Framework.WindowsUniversal" Version="3.8.1.303" />')
          # Compile the scene against the SAME resolved UWP references as the host.
          # It is packaged as data; the host has no static reference to this scene assembly.
          patch('ManagedProbe.csproj', '</Project>', r'''
            <Target Name="CompileDynamicScene" BeforeTargets="CoreCompile" DependsOnTargets="ResolveReferences">
              <MakeDir Directories="$(MSBuildProjectDirectory)\scene-build;$(MSBuildProjectDirectory)\Payload" />
              <Csc Sources="$(MSBuildProjectDirectory)\Scene.cs" References="@(ReferencePath)"
                   OutputAssembly="$(MSBuildProjectDirectory)\scene-build\NexiaDynamicScene.dll"
                   TargetType="Library" Platform="anycpu" LangVersion="10.0"
                   NoStandardLib="true" NoConfig="true" Optimize="true" />
              <Copy SourceFiles="$(MSBuildProjectDirectory)\scene-build\NexiaDynamicScene.dll"
                    DestinationFiles="$(MSBuildProjectDirectory)\Payload\scene.bin" />
            </Target>
          </Project>
          ''')
          patch('build.ps1', '    $mainManifest = Read-AppxManifest $package', r'''    $payloadCheck = [IO.Compression.ZipFile]::OpenRead($package)
              try {
                  $entry = $payloadCheck.GetEntry('Payload/scene.bin')
                  if (!$entry) { $entry = $payloadCheck.GetEntry('Payload\scene.bin') }
                  if (!$entry -or $entry.Length -lt 1024) { throw 'Dynamic scene payload is missing or empty.' }
                  if (!$payloadCheck.GetEntry('MonoGame.Framework.dll')) { throw 'MonoGame framework is missing from package.' }
                  if ($payloadCheck.GetEntry('NexiaDynamicScene.dll')) { throw 'Scene DLL unexpectedly packaged as a static dependency.' }
              } finally { $payloadCheck.Dispose() }
              $mainManifest = Read-AppxManifest $package''')
          patch('build.ps1', "    Write-Host 'BUILD PASSED. XBOX EXECUTION AND DYNAMIC IL SUPPORT REMAIN UNTESTED.'",
                "    Write-Host 'GRAPHICS BUILD PASSED. This new graphics integration has NOT been tested on Xbox yet.'")
          (root / 'README.txt').write_text('''NEXIA GRAPHICS PROBE 0.4 - ORIGINAL SCENE, NOT THE EMULATOR

          Purpose: combine the load-context path tested in 0.3 with MonoGame UWP 3.8.1.303.
          A separate C# scene assembly is compiled, included as Payload/scene.bin, copied
          to the test app's LocalState, and loaded through public LoadFromStream.
          It receives the host's GraphicsDevice. It is NOT statically referenced by the host.
          No private runtime fields, system patches, game packages or console assets are used.

          Tests: BasicEffect shader, generated texture, depth-buffered cube rendering,
          64x64 GPU readback, live GamePad input, local save readback/restoration, optional tone.
          GPU readback counts pixels changed from a magenta clear; it does not prove perfect
          rendering. Confirm the displayed scene visually. Audio submission is not hearing.
          Input reports WAITING until a controller appears, not a misleading PASS for zero.

          Controls: left stick orbit/zoom; A color; X save; Y a quiet 0.2 second tone.
          After saving, closing and reopening should report restored on launch.
          Copy LocalState/graphics-probe-log.txt before reopening; each launch resets the log.
          Save data is only this app's LocalState/scene-save.txt.

          Install the signed package and included dependencies using Xbox Device Portal.
          Set this separate Nexia Graphics Probe to Game. Keep existing probes/Xenia installed.
          This app still does not contain Nexia's .NET 9 host, its custom TitleLoadContext,
          its patched MonoGame, XNA console runtime, STFS loader, avatars, or CastleMiner Z.
          Stock MonoGame UWP is a legacy, unmaintained experimental backend, NOT a drop-in
          replacement for Nexia's patched DesktopGL build or 360 texture/shader support.
          The new integrated Windows build and Xbox execution are untested at preparation.

          Build logic is reused from a content-verified successful workflow. Restore uses
          NuGet with versioned package references; dependencies and main package identity
          are checked before the ephemeral development certificate signs the output.
          No signing private key is exported. Do not install .cer files as phone profiles.
          ''', encoding='utf-8')
          # Preserve package-provided license metadata and license files as build evidence.
          # Full MonoGame licensing text is fetched from its source tag with git-blob validation.
          license_url = 'https://raw.githubusercontent.com/MonoGame/MonoGame/v3.8.1/LICENSE.txt'
          with urlopen(license_url, timeout=45) as response:
              license_data = response.read()
          blob = hashlib.sha1(b'blob ' + str(len(license_data)).encode('ascii') + b'\0' + license_data).hexdigest()
          if blob != 'c2de72db5f3e88b27fdb32a7bdf3af11b66776bb':
              raise RuntimeError('MonoGame license integrity mismatch')
          (root / 'MONOGAME-LICENSE.txt').write_bytes(license_data)
          patch('ManagedProbe.csproj', '<Content Include="NEXIA-LICENSE.txt" />',
                '<Content Include="NEXIA-LICENSE.txt" /><Content Include="MONOGAME-LICENSE.txt" />')
          (root / 'THIRD-PARTY-NOTICES.txt').write_text('''GRAPHICS PROBE 0.4 - THIRD-PARTY NOTICES
          Original experiment code; no CastleMiner Z assets or Nexia emulator are included.
          MonoGame.Framework.WindowsUniversal 3.8.1.303 (legacy UWP backend):
          https://www.nuget.org/packages/MonoGame.Framework.WindowsUniversal/3.8.1.303
          See MONOGAME-LICENSE.txt (Ms-PL and MIT notices) included with this test.
          SharpDX dependencies are restored with MonoGame, under their MIT package licenses.
          Microsoft.NETCore.UniversalWindowsPlatform 6.2.14 and its runtime dependencies
          retain their packaged manifests and Microsoft signatures. For development testing.
          The artifact's package-licenses folder records restored NuGet metadata and notices.
          No project or contributor endorsement is claimed.
          ''', encoding='utf-8')
          patch('build.ps1', '    Copy-Item $package $out', r'''    # Include restored packages' nuspecs and supplied license files with the artifact.
              $licenseOut = Join-Path $out 'package-licenses'
              New-Item -ItemType Directory -Force $licenseOut | Out-Null
              $assets = Get-Content "$root\obj\project.assets.json" -Raw | ConvertFrom-Json
              foreach ($library in $assets.libraries.PSObject.Properties) {
                  if ($library.Value.type -ne 'package') { continue }
                  $relative = $library.Value.path
                  foreach ($base in $assets.packageFolders.PSObject.Properties.Name) {
                      $directory = Join-Path $base $relative
                      if (!(Test-Path $directory)) { continue }
                      $destination = Join-Path $licenseOut ($library.Name -replace '[/\\]', '_')
                      New-Item -ItemType Directory -Force $destination | Out-Null
                      foreach ($file in @(Get-ChildItem $directory -File | Where-Object {
                          $_.Extension -eq '.nuspec' -or $_.Name -match '(?i)license|notice|copyright'
                      })) { Copy-Item $file.FullName $destination -Force }
                      break
                  }
              }
              Copy-Item "$root\MONOGAME-LICENSE.txt" $out
              Copy-Item $package $out''')
          print('Prepared separate dynamic-scene + MonoGame UWP graphics integration. No Xbox results claimed.')

      - name: Build and development-sign graphics integration
        shell: pwsh
        env:
          PROBE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/xbox-managed-probe/build.ps1", [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          ./xbox-managed-probe/build.ps1 -BuildNumber ([int]$env:PROBE_BUILD_NUMBER)

      - name: Upload signed package or failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: XboxGraphicsTest-x64-${{ github.run_number }}
          path: xbox-managed-probe/out/
          retention-days: 7
          if-no-files-found: warn
